<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call Loop — Buy number prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Call Loop design system — synced from Figma "00 Design System" (BOVX8Hmx1HfwwBeDwOcZQL), 2026-10-19. Source of truth: design-system/tokens.css */
  /* Primary */
  --blue1:#1364F9;--blue2:#1854EA;--blue3:#1885EA;--blue4:#1362AC;--blue5:#E7EFFE;--blue6:#D0E0FE;
  --blue1-dis:rgba(19,100,249,.4);--blue3-dis:rgba(24,133,234,.4);
  --black:#14161A;--white:#FFFFFF;--g1:#757D8A;--g2:#B7BFC8;--g3:#E0E6EE;--g4:#F3F5F8;
  --g2-dis:rgba(183,191,200,.45);--g2-light:rgba(183,191,200,.3);
  --text:#2C2D2E; /* not a Figma style — kept for existing prototype usage */
  /* Secondary */
  --purple1:#7A16F5;--purple2:#C6AFE2;--purple3:#F0E4FF;--aqua1:#A4C5DB;--aqua2:#E4F4FF;
  --orange1:#F86919;--orange2:#D6BAAA;--orange3:#FFEEE4;
  /* States */
  --ok:#05944F;--ok2:#026233;--ok3:#E7F6ED;--notify1:#2E9AE4;--notify2:#E6F7FF;
  --warn1:#FFC043;--warn2:#BA7D04;--warn3:#855A04;--warn4:#FFF8E9;--err:#E11900;--err2:#A11200;--err3:#FFF1F0;
  /* Gradients */
  --grad1:linear-gradient(180deg,#F3F5F8 0%,#EEF5FF 100%);--grad2:linear-gradient(270deg,#F3F5F8 60%,rgba(243,245,248,.8) 100%);--grad3:#E7EFFE;
  /* Effects */
  --shadow1:0 0 2px rgba(83,102,137,.2),0 12px 16px rgba(83,102,137,.08),0 10px 40px rgba(83,102,137,.08);
  --shadow2:0 4px 8px -2px rgba(27,46,94,.04);
  --shadow3:0 0 2px rgba(83,102,137,.2),0 10px 20px rgba(83,102,137,.05),0 30px 50px rgba(83,102,137,.1);
  /* Shape */
  --r-xs:4px;--r:8px;
  --dlg-w:494px; /* Buy number dialog width; height follows each tab's content */
  --font:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--black);background:var(--g4);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--blue1);outline-offset:2px}

.shell{position:fixed;inset:0;display:flex}
.shell .a{width:240px;background:#fff;box-shadow:inset -1px 0 0 var(--g3)}
.shell .b{width:220px;background:#fff;box-shadow:inset -1px 0 0 var(--g3)}
.shell .c{flex:1;padding:48px;display:flex;flex-direction:column;gap:16px}
.shell .c i{display:block;border-radius:8px;background:var(--g3)}
@media (max-width:900px){.shell .a,.shell .b{display:none}}

/* Dialog — one width (820px) for both steps */
.overlay{position:fixed;inset:0;background:rgba(20,22,26,.2);display:flex;justify-content:center;align-items:flex-start;padding:40px 16px;overflow-y:auto}
.dialog{width:var(--dlg-w);max-width:100%;max-height:calc(100vh - 80px);padding:32px 26px 26px;background:#fff;border-radius:20px;box-shadow:var(--shadow1);display:flex;flex-direction:column;gap:20px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.top .kick{display:block;margin-bottom:20px;font-size:13px;line-height:16px;color:var(--g1)}
.top h2{margin:0;font-size:20px;line-height:24px;letter-spacing:-.4px;font-weight:600}
.x{width:24px;height:24px;padding:0;border:0;background:transparent;color:var(--g1);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.x:hover{color:var(--black)}
.step{display:flex;flex-direction:column;gap:8px;margin-top:-12px}
.step span{align-self:flex-end;font-size:12px;line-height:16px;color:var(--g1)}
.bar{height:4px;border-radius:2px;background:var(--g3);overflow:hidden}.bar i{display:block;height:100%;background:var(--blue3);border-radius:2px;transition:width .25s}
.tabs{display:flex;gap:8px;box-shadow:inset 0 -1px 0 var(--g3);overflow-x:auto}
.tab{padding:0 8px 10px;border:0;background:transparent;font-size:14px;line-height:16px;color:var(--g1);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--blue3)}
.tab[aria-selected="true"]{color:var(--blue1);font-weight:500;box-shadow:inset 0 -2px 0 var(--blue1)}

/* Info alert: title + optional body */
.alert{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;border-radius:12px;background:var(--notify2);font-size:14px;line-height:20px}
.alert i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--blue3);display:inline-flex;align-items:center;justify-content:center}
.alert .tx{padding-top:2px}
.alert b{display:block;font-weight:500;color:var(--blue4)}
.alert p{margin:2px 0 0;color:var(--black)}
.alert a{color:var(--blue1);font-weight:600;text-decoration:none;white-space:nowrap}.alert a:hover{text-decoration:underline}

/* Fields */
.field label,.field .lbl{display:block;margin-bottom:8px;font-size:12px;line-height:16px;color:var(--g1)}
.sel{position:relative}
.sel select{width:100%;height:40px;padding:0 40px 0 44px;border:0;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 1px var(--g3);font-size:14px;line-height:16px;appearance:none;-webkit-appearance:none;cursor:pointer;outline:none}
.sel select:hover{box-shadow:inset 0 0 0 1px var(--g2)}
.sel select:focus{box-shadow:inset 0 0 0 1px var(--blue1),0 0 0 3px var(--blue6)}
.sel select:focus-visible{outline:none}
.sel .lead{position:absolute;left:12px;top:50%;transform:translateY(-50%);display:flex;pointer-events:none}
.sel .chev{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--g1);display:flex;pointer-events:none}
.sel .badge{position:absolute;right:40px;top:50%;transform:translateY(-50%);padding:2px 8px;border-radius:6px;background:var(--g3);font-size:12px;line-height:16px;color:var(--black);pointer-events:none}
.sel.card select{padding-right:116px}

/* Number finder (stacked inputs in one box) */
.finder{border-radius:8px;box-shadow:inset 0 0 0 1px var(--g3);background:#fff}
.finder:focus-within{box-shadow:inset 0 0 0 1px var(--blue1),0 0 0 3px var(--blue6)}
.finder .row{display:flex;align-items:center;gap:8px;height:40px;padding:0 8px 0 12px}
.finder .row + .row{box-shadow:inset 0 1px 0 var(--g3)}
.finder svg{flex:none;color:var(--g1)}
.finder input{flex:1;min-width:0;height:100%;border:0;outline:none;background:transparent;font-size:14px;line-height:16px}
.finder input::placeholder{color:var(--g2)}
.seg{flex:none;display:flex;gap:2px}
.seg button{padding:4px 6px;border:0;border-radius:6px;background:transparent;font-size:14px;line-height:16px;color:var(--black);cursor:pointer}
.seg button:hover{color:var(--blue3)}
.seg button[aria-pressed="true"]{color:var(--blue1);font-weight:500}

/* Number picker grid */
.nums{display:grid;grid-template-columns:1fr;gap:18px;margin:4px 0 8px;padding:0;border:0;min-width:0}
.nums.loc{padding:0 10px}
.nums.tf{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:17px}
.num{display:flex;align-items:center;gap:8px;font-size:14px;line-height:16px;white-space:nowrap;cursor:pointer;min-width:0}
.num small{margin-left:auto;padding-left:12px;font-size:12px;color:var(--g1);overflow:hidden;text-overflow:ellipsis}
input[type="radio"]{flex:none;width:16px;height:16px;margin:0;accent-color:var(--blue1);cursor:pointer}
@media (max-width:520px){.nums.tf{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* External tab: table of numbers */
.tools{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.search{flex:1;min-width:160px;position:relative}
.search svg{position:absolute;left:12px;top:12px}
.search input{width:100%;height:40px;padding:8px 12px 8px 36px;border:0;border-radius:8px;box-shadow:inset 0 0 0 1px var(--g3);font-size:14px;outline:none}
.search input:focus{box-shadow:inset 0 0 0 1px var(--blue1),0 0 0 3px var(--blue6)}
.sw{flex:none;height:40px;padding:0 4px;display:inline-flex;align-items:center;gap:10px;border:0;border-radius:8px;background:transparent;font-size:14px;line-height:16px;cursor:pointer}
.sw .cnt{color:var(--g1)}
.track{width:32px;height:20px;border-radius:12px;background:var(--g3);position:relative;display:inline-block;transition:background .2s}
.track i{position:absolute;top:4px;left:4px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .2s}
.sw[aria-checked="true"] .track{background:var(--blue1)}
.sw[aria-checked="true"] .track i{left:16px}
.scroll{overflow:auto;border-radius:8px}
.scroll::-webkit-scrollbar{width:8px;height:8px}.scroll::-webkit-scrollbar-thumb{background:var(--g3);border-radius:4px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;line-height:16px}
th{position:sticky;top:0;z-index:2;height:40px;padding:0 8px;background:var(--g4);color:var(--g1);font-weight:400;font-size:12px;text-align:left;white-space:nowrap}
td{height:44px;padding:0 8px;border-bottom:1px solid var(--g3);white-space:nowrap}
.xt{min-width:400px}
.xt th:first-child{width:48px;padding-left:16px;border-radius:8px 0 0 8px}
.xt th:last-child{width:170px;padding-right:16px;border-radius:0 8px 8px 0}
.xt td:first-child{padding-left:16px}
.xt td:last-child{padding-right:16px}
.xt tbody tr:not(.added):hover td{background:var(--g4)}
tr.added td{color:var(--g2)}
input[type="checkbox"]{width:18px;height:18px;margin:0;accent-color:var(--blue1);cursor:pointer;vertical-align:middle}
.sortb{padding:0;border:0;background:transparent;display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:16px;color:var(--g1);cursor:pointer}
.sortb:hover{color:var(--black)}
th[aria-sort="ascending"] .sortb,th[aria-sort="descending"] .sortb{color:var(--black);font-weight:500}
.sortb .u,.sortb .d{stroke:var(--g2)}
th[aria-sort="ascending"] .u,th[aria-sort="descending"] .d{stroke:var(--blue1)}
.tag{position:relative;margin-left:8px;padding:2px 8px;border-radius:6px;background:var(--g4);color:var(--g1);font-size:12px;line-height:16px;cursor:help;outline:none}
.tb{display:none;position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);z-index:3;padding:6px 8px;border-radius:8px;background:rgba(20,22,26,.9);color:#fff;font-size:12px;line-height:16px;font-weight:400;white-space:nowrap}
.tag:hover .tb,.tag:focus .tb,.help:hover .tb,.help:focus .tb{display:block}
.date{color:var(--g1)}
.none{margin:24px 0;text-align:center;font-size:14px;color:var(--g1)}
.sum{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;line-height:16px;color:var(--g1)}
.sum b{color:var(--black);font-weight:500}

/* Step 2: payment */
.disc{align-self:flex-start;padding:0;border:0;background:transparent;display:inline-flex;align-items:center;gap:6px;font-size:14px;line-height:16px;font-weight:500;color:var(--blue1);cursor:pointer}
.disc:hover{color:var(--blue2)}
.disc svg{transition:transform .2s}
.disc[aria-expanded="false"] svg{transform:rotate(180deg)}
.pay{display:flex;flex-direction:column;gap:12px}
.pt th{width:50%}
.pt th:first-child{padding-left:16px;border-radius:8px 0 0 8px}
.pt th:last-child{border-radius:0 8px 8px 0}
.pt td{height:40px}
.pt td:first-child{padding-left:16px}
.pt .ty{margin-left:8px;font-size:12px;color:var(--g1)}
.total{padding:16px;border-radius:12px;background:var(--g4);display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:16px}
.total .ln{display:flex;justify-content:space-between;align-items:center;gap:12px}
.total .ln small{margin-left:8px;font-size:12px;color:var(--g1)}
.total hr{width:100%;margin:0;border:0;height:1px;background:var(--g3)}
.total .grand{font-weight:600}
.total .grand span{font-weight:400;display:inline-flex;align-items:center;gap:6px}
.help{position:relative;display:inline-flex;width:16px;height:16px;border-radius:50%;background:var(--g2);color:#fff;font-size:11px;line-height:16px;font-weight:600;justify-content:center;cursor:help;outline:none}
.help:focus-visible{outline:2px solid var(--blue1);outline-offset:2px}

.dialog>*{flex:none}
.body{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:20px;margin:-4px -8px;padding:4px 8px}
.body>*{flex:none}
.body>.scroll{flex:0 1 auto;height:336px;min-height:160px}
.body>.pay{flex:0 1 auto;min-height:160px}
#sel-list{flex:0 1 auto;min-height:0;max-height:360px;overflow:auto;border-radius:8px}
#sel-list::-webkit-scrollbar{width:8px}#sel-list::-webkit-scrollbar-thumb{background:var(--g3);border-radius:4px}
.body::-webkit-scrollbar{width:8px}.body::-webkit-scrollbar-thumb{background:var(--g3);border-radius:4px}
.actions{display:flex;gap:12px}
.btn{height:40px;padding:0 16px;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:8px;font-size:14px;line-height:16px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--blue1);color:#fff}.btn.primary:hover{background:var(--blue2)}
.btn.primary:disabled{background:var(--blue1-dis);cursor:not-allowed}
.btn.secondary{background:var(--g2-light)}.btn.secondary:hover{background:var(--g3)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;padding:10px 14px;border-radius:10px;background:rgba(20,22,26,.92);color:#fff;font-size:14px;line-height:20px;white-space:nowrap}
@media (max-width:600px){.dialog{padding:20px;max-height:calc(100vh - 32px)}.overlay{padding:16px 8px}}
</style>
</head>
<body>
<div class="shell" aria-hidden="true"><div class="a"></div><div class="b"></div><div class="c"><i style="width:220px;height:40px"></i><i style="height:40px"></i><i style="height:300px;border-radius:12px;background:#fff"></i></div></div>
<div id="root"></div>
<script>
(function () {
  'use strict';
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = (t) => String(t).replace(/\D/g, '');
  const pad = (n, w) => String(n).padStart(w, '0');
  const fmt = (n) => '$' + n.toFixed(2);
  const PRICE = 5;
  const UNUSED_RATIO = 0.494; // share of the current billing period already paid for (proration credit)

  /* ---- External tab data (unchanged) ---- */
  const MS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const AREAS = ['205', '907', '480', '520', '205', '205', '205', '312', '415', '646', '702', '713', '786', '818', '206', '303', '404', '503', '512', '617', '619', '720', '801', '919'];
  const NUMS = AREAS.map((a, i) => {
    const mid = String(100 + ((i * 137) % 900)).padStart(3, '0');
    const end = String(1000 + ((i * 2741) % 9000)).slice(-4);
    const d = new Date(2026, 9, 14 - i * 3, 9 + (i * 5) % 9, (i * 17) % 60);
    const h = d.getHours();
    const time = ((h + 11) % 12 + 1) + ':' + String(d.getMinutes()).padStart(2, '0') + ' ' + (h < 12 ? 'AM' : 'PM');
    return {
      id: 'n' + i,
      number: i === 0 ? '(205) 548-1655' : i === 4 ? '(205) 555-0101' : i === 5 ? '(205) 555-0102' : i === 6 ? '(205) 555-0103' : '(' + a + ') ' + mid + '-' + end,
      added: i < 4,
      ts: d.getTime(),
      purchased: MS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear() + ' · ' + time
    };
  });

  /* ---- Local and toll-free pools ---- */
  const COUNTRIES = {
    US: { name: 'United States', cities: [['Montgomery', 'AL', '205'], ['Phoenix', 'AZ', '480'], ['Phoenix', 'AZ', '602'], ['Juneau', 'AK', '907'], ['Tucson', 'AZ', '520'], ['Tucson', 'AZ', '520'], ['Chicago', 'IL', '312'], ['San Francisco', 'CA', '415'], ['New York', 'NY', '646'], ['Austin', 'TX', '512'], ['Houston', 'TX', '713'], ['Miami', 'FL', '786'], ['Seattle', 'WA', '206'], ['Denver', 'CO', '303'], ['Atlanta', 'GA', '404'], ['Boston', 'MA', '617'], ['Los Angeles', 'CA', '213'], ['Las Vegas', 'NV', '702']] },
    CA: { name: 'Canada', cities: [['Toronto', 'ON', '416'], ['Vancouver', 'BC', '604'], ['Montreal', 'QC', '514'], ['Calgary', 'AB', '403'], ['Ottawa', 'ON', '613'], ['Edmonton', 'AB', '780'], ['Winnipeg', 'MB', '204'], ['Halifax', 'NS', '902']] }
  };
  const LOCAL = {};
  Object.keys(COUNTRIES).forEach((cc) => {
    const cities = COUNTRIES[cc].cities;
    LOCAL[cc] = Array.from({ length: cities.length * 6 }, (_, i) => {
      const [city, st, area] = cities[i % cities.length];
      const ex = 200 + ((i * 373 + Number(area) * 7) % 790);
      const line = pad((i * 2741 + 1655) % 10000, 4);
      return { id: 'L' + cc + i, number: i === 0 && cc === 'US' ? '(205) 548-1655' : '(' + area + ') ' + ex + '-' + line, place: city + ', ' + st, type: 'Local' };
    });
  });
  const TF_PREFIX = ['888', '844', '855', '833', '800', '866', '877'];
  const TOLLFREE = Array.from({ length: 140 }, (_, i) => ({
    id: 'T' + i,
    number: i === 0 ? '(888) 481-0416' : '(' + TF_PREFIX[i % TF_PREFIX.length] + ') ' + (200 + ((i * 487) % 790)) + '-' + pad((i * 1913 + 416) % 10000, 4),
    type: 'Toll-Free'
  }));
  const PAGE = { local: 4, tollfree: 12 };

  const TABS = [['local', 'Local number'], ['tollfree', 'Toll-Free number'], ['external', 'Manage external number']];
  const CARDS = [['mc', 'Mastercard •••• 4250', true], ['visa', 'Visa •••• 1182', false]];

  const S = {
    step: 1, tab: 'local', toast: '',
    // local / toll-free
    country: 'US', mode: 'city', place: '', digits: '', tfDigits: '', page: { local: 0, tollfree: 0 }, pick: { local: null, tollfree: null }, bought: [],
    // external
    hideAdded: false, q: '', sel: [], sortKey: 'date', sortDir: 'desc',
    // payment
    listOpen: true, card: 'mc'
  };
  let toastTimer = null;
  let prevStep = S.step, prevTab = S.tab;

  const IC = {
    x: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    info: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 7.5v4M8 4.6v.1"/></svg>',
    search: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#757D8A" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5l3 3"/></svg>',
    pin: '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1.5a4.75 4.75 0 0 0-4.75 4.75C3.25 9.8 8 14.5 8 14.5s4.75-4.7 4.75-8.25A4.75 4.75 0 0 0 8 1.5zm0 6.5a1.75 1.75 0 1 1 0-3.5 1.75 1.75 0 0 1 0 3.5z"/></svg>',
    pad: '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="3" cy="3.5" r="1.5"/><circle cx="8" cy="3.5" r="1.5"/><circle cx="13" cy="3.5" r="1.5"/><circle cx="3" cy="8.5" r="1.5"/><circle cx="8" cy="8.5" r="1.5"/><circle cx="13" cy="8.5" r="1.5"/></svg>',
    chev: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>',
    chevUp: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10l4-4 4 4"/></svg>',
    sort: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="u" d="M5 6.5L8 3.5l3 3"/><path class="d" d="M5 9.5l3 3 3-3"/></svg>',
    refresh: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 2.5v3h-3"/></svg>',
    US: '<svg width="20" height="14" viewBox="0 0 20 14" aria-hidden="true"><rect width="20" height="14" rx="2" fill="#fff"/><path d="M0 1h20M0 3.2h20M0 5.4h20M0 7.6h20M0 9.8h20M0 12h20" stroke="#D02F44" stroke-width="1.1"/><rect width="9" height="7.6" rx="1" fill="#46467F"/></svg>',
    CA: '<svg width="20" height="14" viewBox="0 0 20 14" aria-hidden="true"><rect width="20" height="14" rx="2" fill="#fff"/><path d="M0 2a2 2 0 0 1 2-2h3v14H2a2 2 0 0 1-2-2zM15 0h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-3z" fill="#E11900"/><path d="M10 3l1 2 1.4-.5-.6 2.6 1.2-.4-.8 1.6.8.5-2.5.4v1.8h-1V9.2L7 8.8l.8-.5L7 6.7l1.2.4-.6-2.6L9 5z" fill="#E11900"/></svg>',
    mc: '<svg width="24" height="16" viewBox="0 0 24 16" aria-hidden="true"><rect width="24" height="16" rx="3" fill="#fff" stroke="#E0E6EE"/><circle cx="9.5" cy="8" r="4.5" fill="#EB001B"/><circle cx="14.5" cy="8" r="4.5" fill="#F79E1B" fill-opacity=".9"/></svg>',
    visa: '<svg width="24" height="16" viewBox="0 0 24 16" aria-hidden="true"><rect width="24" height="16" rx="3" fill="#1A1F71"/><text x="12" y="11" text-anchor="middle" font-family="Arial" font-size="7" font-weight="700" font-style="italic" fill="#fff">VISA</text></svg>'
  };

  function showToast(msg) {
    clearTimeout(toastTimer);
    S.toast = msg;
    toastTimer = setTimeout(() => { S.toast = ''; render(); }, 2800);
  }

  /* ---- Local / toll-free lists ---- */
  function filteredPool(tab) {
    if (tab === 'tollfree') {
      const d = norm(S.tfDigits);
      return TOLLFREE.filter((n) => !S.bought.includes(n.id) && (!d || norm(n.number).includes(d)));
    }
    const d = norm(S.digits);
    const p = S.place.trim().toLowerCase();
    return LOCAL[S.country].filter((n) => !S.bought.includes(n.id) &&
      (!d || norm(n.number).includes(d)) &&
      (!p || (S.mode === 'city' ? n.place.toLowerCase().includes(p) : norm(n.number).startsWith(norm(p)))));
  }
  function visibleNums(tab) {
    const pool = filteredPool(tab);
    const size = PAGE[tab];
    if (pool.length <= size) return pool;
    const start = (S.page[tab] * size) % pool.length;
    return pool.slice(start).concat(pool.slice(0, start)).slice(0, size);
  }
  function pickFirst(tab) { const v = visibleNums(tab); S.pick[tab] = v.length ? v[0].id : null; }
  function pickedVisible(tab) { return visibleNums(tab).some((n) => n.id === S.pick[tab]); }

  function alertBox(title, body) {
    return '<div class="alert"><i>' + IC.info + '</i><div class="tx"><b>' + title + '</b>' + (body ? '<p>' + body + '</p>' : '') + '</div></div>';
  }
  const LEARN = ' <a href="#" data-act="learn">Learn more</a>';

  function radioGrid(tab) {
    const list = visibleNums(tab);
    if (!list.length) return '<p class="none">No numbers match your search. Try another ' + (tab === 'local' && S.mode === 'city' ? 'city or ' : '') + 'digit filter.</p>';
    return '<fieldset class="nums ' + (tab === 'tollfree' ? 'tf' : 'loc') + '"><legend class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Available numbers</legend>' +
      list.map((n) => '<label class="num"><input type="radio" name="num-' + tab + '" data-act="radio" data-id="' + n.id + '"' + (S.pick[tab] === n.id ? ' checked' : '') + '>' + n.number + (n.place ? '<small title="' + n.place + '">' + n.place + '</small>' : '') + '</label>').join('') +
      '</fieldset>';
  }

  function localView() {
    return (S.country === 'US' ? alertBox('You are required by the carriers to register for A2P 10DLC', 'To avoid messages from being blocked and paying additional carrier penalty fees, after adding the number, please complete the 10DLC registration. A2P 10DLC is required if you want to send messages to United States using local numbers.' + LEARN) : '') +
      '<div class="field"><label for="country">Country</label><div class="sel"><span class="lead">' + IC[S.country] + '</span>' +
      '<select id="country" data-act="country">' + Object.keys(COUNTRIES).map((k) => '<option value="' + k + '"' + (k === S.country ? ' selected' : '') + '>' + COUNTRIES[k].name + '</option>').join('') + '</select>' +
      '<span class="chev">' + IC.chev + '</span></div></div>' +
      '<div class="finder"><div class="row">' + IC.pin +
      '<input id="place" type="text" autocomplete="off" aria-label="' + (S.mode === 'city' ? 'City' : 'Area code') + '" placeholder="' + (S.mode === 'city' ? 'Enter a city name' : 'Enter an area code') + '"' + (S.mode === 'area' ? ' inputmode="numeric"' : '') + ' value="' + esc(S.place) + '">' +
      '<div class="seg" role="group" aria-label="Search by">' +
      '<button type="button" data-act="mode" data-v="city" aria-pressed="' + (S.mode === 'city') + '">City</button>' +
      '<button type="button" data-act="mode" data-v="area" aria-pressed="' + (S.mode === 'area') + '">Area code</button></div></div>' +
      '<div class="row">' + IC.pad + '<input id="digits" type="text" inputmode="numeric" autocomplete="off" aria-label="Filter by digits" placeholder="Filter by digits" value="' + esc(S.digits) + '"></div></div>' +
      radioGrid('local');
  }

  function tollFreeView() {
    return alertBox('You are required by the carriers to verify your toll-free numbers', 'To avoid carrier filtering and ensure better deliverability, please complete the toll-free verification.' + LEARN) +
      '<div class="finder"><div class="row">' + IC.pad + '<input id="tfDigits" type="text" inputmode="numeric" autocomplete="off" aria-label="Filter by digits" placeholder="Filter by digits" value="' + esc(S.tfDigits) + '"></div></div>' +
      radioGrid('tollfree');
  }

  /* ---- External tab ---- */
  function visibleRows() {
    const q = norm(S.q);
    const mul = S.sortDir === 'asc' ? 1 : -1;
    return NUMS.filter((n) => (!S.hideAdded || !n.added) && (!q || norm(n.number).includes(q)))
      .sort((a, b) => mul * (S.sortKey === 'number' ? norm(a.number).localeCompare(norm(b.number)) : a.ts - b.ts));
  }

  function tableView() {
    const rows = visibleRows();
    const selectable = rows.filter((n) => !n.added);
    const all = selectable.length > 0 && selectable.every((n) => S.sel.includes(n.id));
    const ariaSort = (k) => S.sortKey === k ? (S.sortDir === 'asc' ? 'ascending' : 'descending') : 'none';
    const added = NUMS.filter((n) => n.added).length;
    const avail = NUMS.length - added;
    const count = S.sel.length;
    return alertBox('Select the numbers you want to use in Call Loop') +
      '<div class="tools"><div class="search">' + IC.search + '<input id="q" type="search" aria-label="Search numbers" placeholder="Search..." value="' + esc(S.q) + '"></div>' +
      '<button type="button" class="sw" role="switch" aria-checked="' + S.hideAdded + '" data-act="toggleHide"><span class="track" aria-hidden="true"><i></i></span>Hide added numbers <span class="cnt">(' + added + ')</span></button></div>' +
      '<div class="scroll"><table class="xt"><thead><tr>' +
      '<th scope="col"><input type="checkbox" data-act="all" aria-label="Select all available numbers"' + (all ? ' checked' : '') + (selectable.length ? '' : ' disabled') + '></th>' +
      '<th scope="col" aria-sort="' + ariaSort('number') + '"><button type="button" class="sortb" data-act="sort" data-k="number">Phone number' + IC.sort + '</button></th>' +
      '<th scope="col" aria-sort="' + ariaSort('date') + '"><button type="button" class="sortb" data-act="sort" data-k="date">Purchased' + IC.sort + '</button></th></tr></thead><tbody>' +
      rows.map((n) => '<tr' + (n.added ? ' class="added"' : '') + '><td>' +
        (n.added ? '' : '<input type="checkbox" data-act="pick" data-id="' + n.id + '" aria-label="Select ' + n.number + '"' + (S.sel.includes(n.id) ? ' checked' : '') + '>') +
        '</td><td>' + n.number + (n.added ? '<span class="tag" tabindex="0">Added<span class="tb" role="tooltip">Already in Call Loop</span></span>' : '') + '</td>' +
        '<td' + (n.added ? '' : ' class="date"') + '>' + n.purchased + '</td></tr>').join('') +
      '</tbody></table>' + (rows.length ? '' : '<p class="none">No numbers match “' + esc(S.q) + '”.</p>') + '</div>' +
      '<div class="sum"><span>' + avail + ' available · ' + added + (S.hideAdded ? ' added hidden' : ' already added') + '</span>' +
      (count ? '<b>' + count + ' selected · ' + fmt(count * PRICE) + ' / month</b>' : '') + '</div>';
  }

  /* ---- Selection → payment ---- */
  function selectedNumbers() {
    if (S.tab === 'external') return NUMS.filter((n) => S.sel.includes(n.id)).map((n) => ({ number: n.number, type: 'External' }));
    const pool = S.tab === 'tollfree' ? TOLLFREE : LOCAL[S.country];
    const n = pool.find((x) => x.id === S.pick[S.tab]);
    return n ? [n] : [];
  }
  function canContinue() { return S.tab === 'external' ? S.sel.length > 0 : pickedVisible(S.tab); }

  function paymentView() {
    const nums = selectedNumbers();
    const monthly = nums.length * PRICE;
    const unused = Math.round(monthly * UNUSED_RATIO * 100) / 100;
    const card = CARDS.find((c) => c[0] === S.card);
    return '<div class="pay"><button type="button" class="disc" data-act="list" aria-expanded="' + S.listOpen + '" aria-controls="sel-list">' + IC.chevUp + 'Selected numbers: ' + nums.length + '</button>' +
      (S.listOpen ? '<div id="sel-list"><table class="pt"><thead><tr><th scope="col">Phone number</th><th scope="col">Price</th></tr></thead><tbody>' +
        nums.map((n) => '<tr><td>' + n.number + '</td><td>' + fmt(PRICE) + '</td></tr>').join('') +
        '</tbody></table></div>' : '') + '</div>' +
      '<div class="field"><label for="card">Card</label><div class="sel card"><span class="lead">' + IC[card[0]] + '</span>' +
      '<select id="card" data-act="card">' + CARDS.map((c) => '<option value="' + c[0] + '"' + (c[0] === S.card ? ' selected' : '') + '>' + c[1] + '</option>').join('') + '</select>' +
      (card[2] ? '<span class="badge">Primary</span>' : '') + '<span class="chev">' + IC.chev + '</span></div></div>' +
      '<div class="total">' +
      '<div class="ln"><span>Monthly total<small>' + nums.length + ' × $' + PRICE + '</small></span><span>$' + monthly + '/ month</span></div><hr>' +
      '<div class="ln"><span>Monthly total</span><span>' + fmt(monthly) + '</span></div>' +
      '<div class="ln"><span>Unused time</span><span>−' + fmt(unused) + '</span></div><hr>' +
      '<div class="ln grand"><span>Total charged today <span class="help" tabindex="0" aria-label="About this charge">?<span class="tb" role="tooltip">Prorated for the rest of your current billing period</span></span></span><span>' + fmt(monthly - unused) + '</span></div>' +
      '</div>';
  }

  const root = document.getElementById('root');
  function render() {
    const active = document.activeElement;
    const keepId = active && active.id ? active.id : null;
    const pos = keepId && active.setSelectionRange && active.type !== 'radio' ? active.selectionStart : null;
    const scrollEl = root.querySelector('.scroll');
    const scrollTop = scrollEl ? scrollEl.scrollTop : 0;
    const bodyEl = root.querySelector('.body');
    const bodyTop = bodyEl && S.step === prevStep && S.tab === prevTab ? bodyEl.scrollTop : 0;
    prevStep = S.step; prevTab = S.tab;
    const one = S.step === 1;
    const count = S.sel.length;
    let body;
    if (one) {
      body = '<div class="tabs" role="tablist" aria-label="Number type">' + TABS.map(([id, label]) => '<button type="button" class="tab" role="tab" data-act="tab" data-v="' + id + '" aria-selected="' + (S.tab === id) + '">' + label + '</button>').join('') + '</div>' +
        '<div class="body">' + (S.tab === 'local' ? localView() : S.tab === 'tollfree' ? tollFreeView() : tableView()) + '</div>' +
        '<div class="actions"><button type="button" class="btn primary" data-act="continue"' + (canContinue() ? '' : ' disabled') + '>' + (S.tab === 'external' && count ? 'Continue (' + count + ')' : 'Continue') + '</button>' +
        '<button type="button" class="btn secondary" data-act="refresh">' + IC.refresh + 'Refresh</button></div>';
    } else {
      body = '<div class="body">' + paymentView() + '</div>' +
        '<div class="actions"><button type="button" class="btn primary" data-act="buy">Buy number</button>' +
        '<button type="button" class="btn secondary" data-act="back">Back</button></div>';
    }
    root.innerHTML = '<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="t">' +
      '<div class="top"><div><span class="kick">Buy number</span><h2 id="t">' + (one ? 'Choose number' : 'Payment') + '</h2></div><button type="button" class="x" data-act="close" aria-label="Close">' + IC.x + '</button></div>' +
      '<div class="step"><span>Step ' + S.step + ' / 2</span><div class="bar" role="progressbar" aria-label="Step ' + S.step + ' of 2" aria-valuenow="' + S.step + '" aria-valuemin="0" aria-valuemax="2"><i style="width:' + (one ? 50 : 100) + '%"></i></div></div>' +
      body + '</div></div>' + (S.toast ? '<div class="toast" role="status">' + esc(S.toast) + '</div>' : '');
    const newScroll = root.querySelector('.scroll');
    if (newScroll) newScroll.scrollTop = scrollTop;
    const newBody = root.querySelector('.body');
    if (newBody) newBody.scrollTop = bodyTop;
    if (keepId) {
      const el = document.getElementById(keepId) || root.querySelector('[data-act="' + (active.dataset && active.dataset.act) + '"]');
      if (el) { el.focus(); if (pos != null && el.setSelectionRange) el.setSelectionRange(pos, pos); }
    } else if (active && active.dataset && active.dataset.act) {
      const sel = '[data-act="' + active.dataset.act + '"]' + (active.dataset.k ? '[data-k="' + active.dataset.k + '"]' : '') + (active.dataset.v ? '[data-v="' + active.dataset.v + '"]' : '') + (active.dataset.id ? '[data-id="' + active.dataset.id + '"]' : '');
      const el = root.querySelector(sel);
      if (el) el.focus();
    }
  }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const act = t.dataset.act;
    if (act === 'pick' || act === 'all' || act === 'radio' || act === 'country' || act === 'card') return; // handled on change
    if (act === 'learn') { e.preventDefault(); showToast('Opens the help article'); }
    else if (act === 'toggleHide') S.hideAdded = !S.hideAdded;
    else if (act === 'tab') S.tab = t.dataset.v;
    else if (act === 'mode') { if (S.mode !== t.dataset.v) { S.mode = t.dataset.v; S.place = ''; } }
    else if (act === 'sort') {
      const k = t.dataset.k;
      S.sortDir = S.sortKey === k ? (S.sortDir === 'asc' ? 'desc' : 'asc') : (k === 'date' ? 'desc' : 'asc');
      S.sortKey = k;
    } else if (act === 'refresh') {
      if (S.tab === 'external') { S.q = ''; }
      else { S.page[S.tab]++; pickFirst(S.tab); }
      showToast('Numbers refreshed');
    }
    else if (act === 'continue') { if (canContinue()) { S.step = 2; S.listOpen = true; } }
    else if (act === 'back') S.step = 1;
    else if (act === 'list') S.listOpen = !S.listOpen;
    else if (act === 'buy') {
      const n = selectedNumbers().length;
      if (S.tab === 'external') { NUMS.forEach((x) => { if (S.sel.includes(x.id)) x.added = true; }); S.sel = []; }
      else { S.bought.push(S.pick[S.tab]); pickFirst(S.tab); }
      S.step = 1;
      showToast(n === 1 ? 'Number bought' : n + ' numbers bought');
    }
    else if (act === 'close') showToast('Close isn’t part of this prototype');
    render();
  });

  document.addEventListener('change', (e) => {
    const t = e.target;
    if (!t.dataset) return;
    const act = t.dataset.act;
    if (act === 'pick') {
      const id = t.dataset.id;
      S.sel = S.sel.includes(id) ? S.sel.filter((x) => x !== id) : S.sel.concat(id);
    } else if (act === 'all') {
      const ids = visibleRows().filter((n) => !n.added).map((n) => n.id);
      const all = ids.every((id) => S.sel.includes(id));
      S.sel = all ? S.sel.filter((x) => !ids.includes(x)) : Array.from(new Set(S.sel.concat(ids)));
    } else if (act === 'radio') S.pick[S.tab] = t.dataset.id;
    else if (act === 'country') { S.country = t.value; S.place = ''; S.digits = ''; S.page.local = 0; pickFirst('local'); }
    else if (act === 'card') S.card = t.value;
    else return;
    render();
  });

  document.addEventListener('input', (e) => {
    const id = e.target.id;
    if (id === 'q' || id === 'place' || id === 'digits' || id === 'tfDigits') { S[id] = e.target.value; render(); }
  });

  pickFirst('local');
  pickFirst('tollfree');
  render();
})();
</script>
</body>
</html>
