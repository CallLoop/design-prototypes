<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broadcast — New pricing prototype</title>
<!-- New pricing (CWR-4775): announcement modal, Upgrade plan, Buy credits packs per plan.
     Built on the Broadcast Design System (Figma "Broadcast Design System"): tokens, component styles and the
     window.Broadcast component bundle are inlined below. React 18 is loaded from cdnjs. -->
<style>
/* Broadcast Design System tokens as CSS variables, written from its tokens.json (variables used by components/bundle.css). */
:root{
  --main:#2b5cff; --main-hover:#1a4ef9; --main-disabled:#aabeff; --secondary-fill:rgba(183, 191, 200, 0.3);
  --soft-blue:#eef3ff; --soft-blue-hover:#d0e0fe; --soft-blue-active:#e7effe;
  --extra-blue:#1885ea; --extra-blue-hover:#1362ac; --extra-blue-disabled:#a3cef7;
  --text-main:#0b1b33; --text-secondary:#45506a;
  --grey-1:#757d8a; --grey-2:#b7bfc8; --grey-3:#e0e6ee; --grey-4:#f3f5f8; --black:#14161a; --white:#ffffff;
  --canvas:#f5f7fb; --overlay:rgba(20, 22, 26, 0.2);
  --purple-1:#7a16f5; --purple-2:#c6afe2; --purple-3:#f0e4ff;
  --orange-1:#f86919; --orange-2:#d6baaa; --orange-3:#ffeee4;
  --aqua-1:#a4c5db; --aqua-2:#e4f4ff;
  --success-1:#05944f; --success-2:#026233; --success-3:#e7f6ed;
  --warning-1:#ffc043; --warning-2:#ba7d04; --warning-3:#855a04; --warning-4:#fff8e9; --note:#fcf7dd;
  --error-1:#e11900; --error-2:#a11200; --error-3:#fff1f0;
  --notify-1:#2e9ae4; --notify-2:#e6f7ff;
  --sms:#2b5cff; --sms-soft:#dde5ff; --voice:#0e9f95; --voice-soft:#d8f0ee; --voicemail:#7a5af8; --voicemail-soft:#eae5fe; --campaign:#e8890c; --campaign-soft:#fbecd8;
  --space-2xs:2px; --space-xs:4px; --space-sm:8px; --space-md:12px; --space-lg:16px; --space-xl:20px; --space-2xl:24px;
  --radius-sm:4px; --radius-control:6px; --radius-md:8px; --radius-lg:12px; --radius-xl:16px; --radius-2xl:20px; --radius-pill:100px;
  --shadow-1:0 10px 40px 0 #53668914, 0 12px 16px 0 #53668914, 0 0 2px 0 #53668933;
  --shadow-2:0 4px 8px -2px #1b2e5e0a;
  --shadow-white:0 10px 40px 0 #53668914, 0 12px 16px 0 #53668914, 0 0 2px 0 #53668933;
  --shadow-canvas:0 4px 8px -2px #1b2e5e0a;
  --shadow-big:0 2.77px 2.21px 0 #68686812, 0 6.65px 5.32px 0 #6868680d, 0 12.52px 10.02px 0 #6868680b, 0 22.34px 17.87px 0 #68686809, 0 41.78px 33.42px 0 #68686807, 0 100px 80px 0 #68686805;
  --font-sans:Figtree, system-ui, -apple-system, "Segoe UI", sans-serif;
}

</style>
<style>
@import url("https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap");

/* Broadcast design system — component styles. Every value is a token from tokens.json. */

body { margin: 0; font-family: var(--font-sans); color: var(--text-main); background: var(--white); -webkit-font-smoothing: antialiased; }
.bc-sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.bc-glyph, .bc-disc { display: block; flex: none; }

/* ------------------------------- Input ------------------------------- */
.bc-field { display: flex; flex-direction: column; gap: var(--space-sm); width: 272px; max-width: 100%; }
.bc-field__label { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--grey-1); }
.bc-field__hint { display: flex; align-items: center; gap: var(--space-sm); font-size: 12px; line-height: 16px; color: var(--grey-1); }
.bc-field--positive .bc-field__hint { color: var(--success-1); }
.bc-field--negative .bc-field__hint { color: var(--error-1); }

.bc-input { position: relative; display: flex; align-items: center; height: 40px; box-sizing: border-box; border: 1px solid var(--grey-3); border-radius: var(--radius-md); background: var(--white); transition: box-shadow .12s, border-color .12s; }
.bc-input__control { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; padding: 0 var(--space-md); font: inherit; font-size: 14px; line-height: 16px; color: var(--text-main); }
.bc-input__control::placeholder { color: var(--grey-2); }
.bc-input.has-left .bc-input__control { padding-left: 0; }
.bc-input.has-right .bc-input__control { padding-right: 0; }
.bc-input__icon { display: flex; color: var(--grey-1); }
.bc-input__icon--left { padding: 0 var(--space-sm) 0 var(--space-md); }
.bc-input__icon--right { padding: 0 var(--space-md) 0 var(--space-sm); }
.bc-input__clear { flex: none; display: grid; place-items: center; width: 24px; height: 24px; margin-right: var(--space-sm); border: 0; padding: 0; border-radius: var(--radius-pill); background: var(--grey-4); color: var(--grey-1); cursor: pointer; }
.bc-input__clear:hover { background: var(--grey-3); }

.bc-input--hover, .bc-input:hover { box-shadow: 0 0 0 3px rgba(208, 224, 254, 0.4); }
.bc-input--active, .bc-input:focus-within { border-color: var(--main); box-shadow: 0 0 0 3px var(--soft-blue-hover); }
.bc-input--positive, .bc-input--positive:hover, .bc-input--positive:focus-within { border-color: var(--success-1); box-shadow: 0 0 0 3px var(--success-3); }
.bc-input--negative, .bc-input--negative:hover, .bc-input--negative:focus-within { border-color: var(--error-1); background: var(--error-3); box-shadow: 0 0 0 3px var(--error-3); }
.bc-input--disabled, .bc-input--disabled:hover { background: var(--grey-4); border-color: var(--grey-3); box-shadow: none; }
.bc-input--disabled .bc-input__control { color: var(--grey-1); cursor: not-allowed; }

/* ------------------------- Checkbox & Radio rows ------------------------- */
.bc-option { position: relative; display: flex; align-items: center; gap: var(--space-sm); width: 272px; max-width: 100%; height: 40px; box-sizing: border-box; padding: 0 var(--space-md); border: 1px solid var(--grey-3); border-radius: var(--radius-md); background: var(--white); cursor: pointer; font-size: 14px; line-height: 16px; color: var(--text-main); }
.bc-option:hover { box-shadow: 0 0 0 3px rgba(208, 224, 254, 0.4); }
.bc-option.is-on { border-color: var(--main); box-shadow: 0 0 0 3px var(--soft-blue-hover); }
.bc-option.is-disabled { background: var(--grey-4); border-color: var(--grey-3); color: var(--grey-1); box-shadow: none; cursor: not-allowed; }
.bc-option:focus-within { outline: 2px solid var(--main); outline-offset: 2px; }
.bc-option__text { flex: 1; }
.bc-option__help { color: var(--grey-2); }
.bc-option.is-disabled .bc-option__help { opacity: .4; }

.bc-check { flex: none; display: grid; place-items: center; width: 20px; height: 20px; box-sizing: border-box; border: 1.5px solid var(--grey-2); border-radius: var(--radius-control); background: var(--white); color: var(--white); }
.bc-check--sm { width: 16px; height: 16px; border-radius: var(--radius-sm); }
.bc-check.is-on { border-color: var(--main); background: var(--main); }
.bc-check.is-disabled { border-color: rgba(183, 191, 200, 0.45); }
.bc-check.is-on.is-disabled { border-color: var(--main-disabled); background: var(--main-disabled); }
.bc-bare { display: inline-flex; cursor: pointer; border-radius: var(--radius-control); }
.bc-bare:hover .bc-check:not(.is-on) { border-color: var(--main); }
.bc-bare:hover .bc-check.is-on { background: var(--main-hover); border-color: var(--main-hover); }
.bc-bare:focus-visible { outline: 2px solid var(--main); outline-offset: 2px; }

.bc-radio { flex: none; position: relative; width: 16px; height: 16px; box-sizing: border-box; border: 1.5px solid var(--grey-2); border-radius: var(--radius-pill); background: var(--white); }
.bc-radio.is-on { border: 0; background: var(--main); }
.bc-radio.is-on::after { content: ""; position: absolute; inset: 5px; border-radius: var(--radius-pill); background: var(--white); }
.bc-radio.is-disabled { border-color: rgba(183, 191, 200, 0.45); }
.bc-radio.is-on.is-disabled { background: var(--main-disabled); }

/* ------------------------------- Toggle ------------------------------- */
.bc-toggle { position: relative; width: 32px; height: 20px; padding: 0; border: 0; border-radius: var(--radius-pill); background: var(--grey-3); cursor: pointer; transition: background .15s; }
.bc-toggle__knob { position: absolute; top: 4px; left: 4px; width: 12px; height: 12px; border-radius: var(--radius-pill); background: var(--white); transition: left .15s; }
.bc-toggle.is-on { background: var(--main); }
.bc-toggle.is-on:hover { background: var(--main-hover); }
.bc-toggle.is-on .bc-toggle__knob { left: 16px; }
.bc-toggle:disabled { cursor: not-allowed; background: var(--white); box-shadow: inset 0 0 0 1.5px var(--grey-3); }
.bc-toggle:disabled .bc-toggle__knob { background: var(--grey-3); }
.bc-toggle.is-on:disabled { background: rgba(43, 92, 255, 0.3); box-shadow: none; }
.bc-toggle.is-on:disabled .bc-toggle__knob { background: var(--white); }
.bc-toggle:focus-visible { outline: 2px solid var(--main); outline-offset: 2px; }

/* -------------------------------- Tabs -------------------------------- */
.bc-tabs { display: flex; gap: var(--space-sm); box-shadow: inset 0 -1px 0 var(--grey-3); }
.bc-tab { display: flex; flex-direction: column; gap: var(--space-sm); padding: 0; border: 0; background: none; cursor: pointer; font: inherit; }
.bc-tab__text { padding: 0 var(--space-sm); font-size: 14px; line-height: 16px; color: var(--grey-1); }
.bc-tab::after { content: ""; display: block; height: 2px; border-radius: var(--radius-pill); background: transparent; }
.bc-tab:hover .bc-tab__text { color: var(--text-main); }
.bc-tab.is-active .bc-tab__text { color: var(--main); font-weight: 500; }
.bc-tab.is-active::after { background: var(--main); }
.bc-tab:focus-visible { outline: 2px solid var(--main); outline-offset: 2px; border-radius: var(--radius-sm); }

/* ---------------------------- ChannelLabel ---------------------------- */
.bc-label { display: inline-flex; align-items: center; padding: var(--space-2xs) var(--space-sm); border-radius: var(--radius-md); font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; }
.bc-label--sms { background: var(--sms-soft); color: var(--sms); }
.bc-label--voice { background: var(--voice-soft); color: var(--voice); }
.bc-label--voicemail { background: var(--voicemail-soft); color: var(--voicemail); }
.bc-label--campaign { background: var(--campaign-soft); color: var(--campaign); }
.bc-label--marketing { background: var(--grey-4); color: var(--grey-1); }
.bc-label--new { background: var(--purple-3); color: var(--purple-1); }

/* ------------------------------- Status ------------------------------- */
.bc-status { display: inline-flex; align-items: center; gap: var(--space-sm); font-size: 14px; line-height: 16px; white-space: nowrap; }
.bc-status--notify { color: var(--notify-1); }
.bc-status--main { color: var(--main); }
.bc-status--success { color: var(--success-1); }
.bc-status--grey { color: var(--grey-1); }
.bc-status--error { color: var(--error-1); }
.bc-status--orange { color: var(--orange-1); }
.bc-status--warning { color: var(--warning-2); }
.bc-status--purple { color: var(--purple-1); }

/* -------------------------------- Alert ------------------------------- */
.bc-alert { display: flex; align-items: flex-start; gap: var(--space-sm); width: 395px; max-width: 100%; box-sizing: border-box; padding: var(--space-lg); border-radius: var(--radius-lg); font-size: 14px; line-height: 20px; }
.bc-alert--sm { padding: var(--space-md) var(--space-lg); }
.bc-alert__icon { flex: none; display: flex; margin: 0 var(--space-xs) 0 0; }
.bc-alert__ring { flex: none; width: 20px; height: 20px; box-sizing: border-box; border: 2px solid currentColor; border-radius: var(--radius-pill); margin-right: var(--space-xs); }
.bc-alert__text { flex: 1; min-width: 0; font-weight: 600; }
.bc-alert__title { font-weight: 600; }
.bc-alert__desc { margin-top: var(--space-xs); font-weight: 400; color: var(--black); opacity: .8; }
.bc-alert__desc a { color: var(--main); font-weight: 600; text-decoration: none; }
.bc-alert__link { flex: none; font-weight: 600; text-decoration: none; padding-top: 2px; line-height: 16px; }
.bc-alert__link:hover { text-decoration: underline; }
.bc-alert__close { flex: none; display: flex; margin-top: 2px; padding: 0; border: 0; background: none; color: var(--text-main); opacity: .5; cursor: pointer; }
.bc-alert__close:hover { opacity: .8; }
.bc-alert--success { background: var(--success-3); color: var(--success-2); }
.bc-alert--success .bc-alert__icon, .bc-alert--success .bc-alert__link { color: var(--success-1); }
.bc-alert--info { background: var(--notify-2); color: var(--extra-blue); }
.bc-alert--info .bc-alert__icon, .bc-alert--info .bc-alert__link { color: var(--extra-blue); }
.bc-alert--info-light { background: var(--grey-4); color: var(--extra-blue); }
.bc-alert--info-light .bc-alert__icon, .bc-alert--info-light .bc-alert__link { color: var(--extra-blue); }
.bc-alert--warning { background: var(--warning-4); color: var(--warning-3); }
.bc-alert--warning .bc-alert__icon { color: var(--warning-1); }
.bc-alert--warning .bc-alert__link { color: var(--warning-2); }
.bc-alert--error { background: var(--error-3); color: var(--error-2); }
.bc-alert--error .bc-alert__icon, .bc-alert--error .bc-alert__link { color: var(--error-1); }
.bc-alert--black { background: var(--black); color: var(--white); }
.bc-alert--black .bc-alert__text { font-weight: 400; }
.bc-alert--black .bc-alert__link { color: var(--white); }
.bc-alert--black .bc-alert__close { color: var(--white); }

/* ------------------------------- Tooltip ------------------------------ */
.bc-tip { position: relative; display: inline-flex; align-items: flex-start; gap: var(--space-sm); padding: var(--space-sm); border-radius: var(--radius-md); font-size: 14px; line-height: 16px; }
.bc-tip--dark { background: rgba(20, 22, 26, 0.9); color: var(--white); }
.bc-tip--dark .bc-tip__pre { color: var(--grey-2); }
.bc-tip--warning { background: var(--warning-1); color: var(--black); }
.bc-tip--warning .bc-tip__icon { color: var(--warning-3); display: flex; }
.bc-tip--warning .bc-tip__pre { color: var(--warning-3); }
.bc-tip__pre { font-size: 12px; line-height: 16px; }
.bc-tip::after { content: ""; position: absolute; width: 8px; height: 8px; background: inherit; transform: rotate(45deg); border-radius: 1px; }
.bc-tip--top::after { bottom: -4px; left: calc(50% - 4px); }
.bc-tip--bottom::after { top: -4px; left: calc(50% - 4px); }
.bc-tip--left::after { right: -4px; top: calc(50% - 4px); }
.bc-tip--right::after { left: -4px; top: calc(50% - 4px); }

/* ----------------------------- Pagination ----------------------------- */
.bc-pager { position: relative; display: flex; align-items: center; justify-content: space-between; box-sizing: border-box; width: 100%; padding: var(--space-xl) var(--space-sm); border-top: 1px solid var(--grey-3); background: var(--white); font-size: 14px; line-height: 16px; color: var(--grey-1); }
.bc-pager__icon { display: flex; padding: var(--space-xs); border: 0; border-radius: var(--radius-sm); background: none; color: var(--grey-1); cursor: pointer; }
.bc-pager__icon:hover { background: var(--grey-4); }
.bc-pager__pages { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: var(--space-sm); }
.bc-pager__arrow { display: grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 0; border-radius: var(--radius-md); background: var(--white); color: var(--grey-1); cursor: pointer; }
.bc-pager__arrow:hover:not(:disabled) { background: var(--grey-4); }
.bc-pager__arrow:disabled { color: var(--grey-2); cursor: default; }
.bc-pager__num { display: grid; place-items: center; min-width: 24px; height: 24px; padding: 0 var(--space-xs); box-sizing: border-box; border: 0; border-radius: var(--radius-md); background: var(--white); font: inherit; font-weight: 600; color: var(--grey-1); cursor: pointer; }
.bc-pager__num:hover { background: var(--grey-4); }
.bc-pager__num.is-active { background: var(--soft-blue-active); color: var(--main); }
.bc-pager__num.is-more { cursor: default; background: none; }
.bc-pager__rows { display: flex; align-items: center; gap: var(--space-xs); }
.bc-pager__rows b { display: inline-flex; align-items: center; gap: var(--space-2xs); color: var(--main); font-weight: 600; cursor: pointer; }
.bc-pager button:focus-visible { outline: 2px solid var(--main); outline-offset: 1px; }

/* ----------------------------- SidebarItem ---------------------------- */
.bc-side { display: flex; align-items: center; gap: var(--space-lg); width: 240px; max-width: 100%; height: 44px; box-sizing: border-box; padding: 0 var(--space-lg); border: 0; border-radius: var(--radius-md); background: var(--white); font: inherit; font-size: 14px; line-height: 16px; color: var(--text-main); text-align: left; cursor: pointer; }
.bc-side__icon { display: flex; color: var(--grey-1); }
.bc-side__text { flex: 1; }
.bc-side__action { display: flex; color: var(--grey-1); }
.bc-side:hover, .bc-side.is-hover { background: var(--grey-4); }
.bc-side.is-active { background: var(--aqua-2); }
.bc-side.is-active .bc-side__icon { color: var(--main); }
.bc-side.is-danger:hover { background: var(--error-3); }
.bc-side.is-danger:hover .bc-side__icon { color: var(--error-1); }
.bc-side:disabled { background: rgba(183, 191, 200, 0.3); color: var(--grey-2); cursor: not-allowed; }
.bc-side:disabled .bc-side__icon { color: var(--grey-2); }
.bc-side:focus-visible { outline: 2px solid var(--main); outline-offset: 2px; }

/* ---------------------------- DropdownMenu ---------------------------- */
.bc-menu { display: inline-flex; flex-direction: column; min-width: 200px; box-sizing: border-box; padding: var(--space-sm); border-radius: var(--radius-md); background: var(--white); box-shadow: var(--shadow-1); }
.bc-menu__title { padding: var(--space-sm); font-size: 12px; line-height: 16px; color: var(--grey-1); }
.bc-menu__item { display: flex; align-items: center; gap: var(--space-sm); height: 32px; padding: 0 var(--space-sm); border: 0; border-radius: var(--radius-md); background: none; font: inherit; font-size: 14px; line-height: 16px; color: var(--text-main); text-align: left; cursor: pointer; }
.bc-menu__item:hover, .bc-menu__item.is-selected { background: var(--grey-4); }
.bc-menu__item.is-danger { color: var(--error-1); }
.bc-menu__item.is-danger:hover { background: var(--error-3); }
.bc-menu__icon, .bc-menu__right { display: flex; color: var(--grey-1); }
.bc-menu__item.is-danger .bc-menu__icon { color: var(--error-1); }
.bc-menu__text { flex: 1; }
.bc-menu__item:focus-visible { outline: 2px solid var(--main); outline-offset: -2px; }

/* --------------------------- preview helpers --------------------------- */
.bc-demo { display: flex; flex-wrap: wrap; gap: var(--space-2xl); align-items: flex-start; padding: var(--space-2xl); }
.bc-demo--col { flex-direction: column; gap: var(--space-lg); }
.bc-demo--tight { gap: var(--space-lg); }
.bc-demo--canvas { background: var(--canvas); }

/* ====== layout patterns read from the 04-Broadcasts screens, styled with the current system ====== */

/* ------------------------------- Button ------------------------------- */
.bc-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-sm); box-sizing: border-box; border: 0; border-radius: var(--radius-md); font: inherit; font-size: 14px; line-height: 16px; font-weight: 600; white-space: nowrap; cursor: pointer; transition: background .12s, filter .12s; }
.bc-btn--medium { height: 40px; padding: 0 var(--space-lg); }
.bc-btn--small { height: 32px; padding: 0 var(--space-md); }
.bc-btn--xsmall { height: 24px; padding: 0 var(--space-sm); font-size: 12px; font-weight: 500; border-radius: var(--radius-sm); gap: var(--space-xs); }
.bc-btn--medium:has(.bc-btn__icon):not(.bc-btn--icon) { padding-left: var(--space-md); }
.bc-btn--icon.bc-btn--medium { width: 40px; padding: 0; }
.bc-btn--icon.bc-btn--small { width: 32px; padding: 0; }
.bc-btn--icon.bc-btn--xsmall { width: 24px; padding: 0; }
.bc-btn__icon { display: flex; }
.bc-btn--primary { background: var(--main); color: var(--white); }
.bc-btn--primary .bc-btn__icon { color: var(--white); }
.bc-btn--primary:hover:not(:disabled) { background: var(--main-hover); }
.bc-btn--primary:disabled { background: var(--main-disabled); }
.bc-btn--secondary { background: var(--secondary-fill); color: var(--black); }
.bc-btn--secondary .bc-btn__icon { color: var(--grey-1); }
.bc-btn--secondary:hover:not(:disabled) { background: var(--grey-3); }
.bc-btn--soft { background: var(--soft-blue-active); color: var(--main); }
.bc-btn--soft:hover:not(:disabled) { background: var(--soft-blue-hover); }
.bc-btn--ghost { background: transparent; color: var(--grey-1); }
.bc-btn--ghost:hover:not(:disabled) { background: var(--grey-4); }
.bc-btn--quiet { background: var(--grey-4); color: var(--grey-1); }
.bc-btn--quiet:hover:not(:disabled) { background: var(--grey-3); }
.bc-btn--danger { background: var(--error-1); color: var(--white); }
.bc-btn--danger:hover:not(:disabled) { background: var(--error-2); }
.bc-btn:disabled { cursor: not-allowed; }
.bc-btn--secondary:disabled, .bc-btn--soft:disabled, .bc-btn--ghost:disabled, .bc-btn--quiet:disabled { color: var(--grey-2); }
.bc-btn:focus-visible { outline: 2px solid var(--main); outline-offset: 2px; }
.bc-btn__spin { width: 16px; height: 16px; box-sizing: border-box; border: 2px solid currentColor; border-right-color: transparent; border-radius: var(--radius-pill); animation: bc-spin .8s linear infinite; }
.bc-btn.is-loading { min-width: 88px; }
@keyframes bc-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .bc-btn__spin { animation-duration: 2.4s; } }

/* ------------------------------ ListChip ------------------------------ */
.bc-chip { display: inline-flex; align-items: center; gap: var(--space-xs); height: 24px; box-sizing: border-box; padding: 0 var(--space-sm); border-radius: var(--radius-sm); background: var(--grey-3); color: var(--grey-1); font-size: 14px; line-height: 16px; white-space: nowrap; }
.bc-chip__text { color: var(--black); }
.bc-chip__count { color: var(--grey-1); }

body{background:var(--white)}
a{color:var(--main)}a:hover{color:var(--main-hover)}
.np-bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:32px;flex-wrap:wrap;padding:12px 24px;background:var(--white);box-shadow:inset 0 -1px 0 var(--grey-3)}
.np-bar__title{display:flex;flex-direction:column;gap:2px}
.np-bar__title b{font-size:16px;line-height:20px;font-weight:600}
.np-bar__title span{font-size:12px;line-height:16px;color:var(--grey-1)}
.np-frame{position:relative;display:flex;min-height:calc(100vh - 66px);min-height:960px}
.np-side{width:272px;flex:none;box-sizing:border-box;padding:0 16px;box-shadow:inset -1px 0 0 var(--grey-3);display:flex;flex-direction:column;gap:4px}
.np-logo{height:76px;display:flex;align-items:center;gap:12px;padding-left:8px;font-size:17px;line-height:24px;font-weight:600}
.np-main{flex:1;min-width:0;display:flex;flex-direction:column}
.np-page{padding:32px 64px;display:flex;flex-direction:column;gap:24px}
.np-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.np-head h1{margin:0;font-size:40px;line-height:48px;letter-spacing:-.02em;font-weight:600}
.np-head__actions{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.np-box{padding:24px;border-radius:var(--radius-lg);border:1px solid var(--grey-3);display:flex;flex-direction:column;gap:8px}
.np-box b{font-size:20px;line-height:24px;font-weight:600;letter-spacing:-.02em}
.np-full{width:100% !important;box-sizing:border-box}
.np-countdown{padding:16px;border-radius:var(--radius-lg);background:var(--grey-4);display:flex;align-items:center;gap:24px}
.np-tiles{flex:none;display:grid;grid-template-columns:repeat(4,56px);gap:6px}
.np-tile{padding:6px 0;border-radius:var(--radius-md);background:var(--white);display:flex;flex-direction:column;align-items:center;gap:2px}
.np-tile b{font-size:20px;line-height:24px;font-weight:600;color:var(--main);font-variant-numeric:tabular-nums}
.np-tile span{font-size:10px;line-height:12px;font-weight:500;color:var(--grey-1)}
.np-seg-label{padding:6px 12px;border-radius:var(--radius-md);background:var(--grey-4);font-size:14px}
.np-free{font-size:10px;color:var(--success-1);background:var(--success-3);padding:1px 4px;border-radius:4px}
.np-pay{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:24px;align-items:start}
.np-details{padding:20px 16px;border-radius:var(--radius-xl);background:var(--grey-4);display:flex;flex-direction:column}
.np-details__rows{padding:16px 0;margin-bottom:16px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--grey-3);font-size:14px;line-height:20px}
.np-details__rows>div,.np-details__total{display:flex;justify-content:space-between;gap:8px}
.np-details__rows>div>span:first-child{color:var(--grey-1)}
.np-details__rows>div>span:last-child{text-align:right}
.np-details__total{font-size:14px;line-height:20px;font-weight:600;font-variant-numeric:tabular-nums}
.np-visa{padding:2px 6px;border-radius:var(--radius-sm);background:#1a1f71;color:#fff;font-size:10px;font-weight:700;letter-spacing:.5px}
.np-field{height:40px;padding:0 12px;border:1px solid var(--grey-3);border-radius:var(--radius-md);background:var(--white);display:flex;align-items:center;justify-content:space-between;font:inherit;font-size:14px;color:var(--text-main);cursor:pointer}
.np-field.is-open{border-color:var(--main);box-shadow:0 0 0 3px var(--soft-blue-hover)}
.np-limits{margin:0;padding-left:18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;font-size:14px;line-height:20px}
.np-doc{padding:48px 64px;display:flex;flex-direction:column;gap:24px;max-width:1280px}
.np-doc h2{margin:0;font-size:28px;line-height:32px;letter-spacing:-.02em;font-weight:600}
.np-doc p{margin:0;max-width:920px;font-size:14px;line-height:20px;color:var(--grey-1)}
.np-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
@media (max-width:800px),(max-height:600px){
  .np-side{display:none}.np-page,.np-doc{padding:24px 16px}.np-pay,.np-two{grid-template-columns:1fr}
}
</style>
