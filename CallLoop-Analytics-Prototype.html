<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call Loop — Analytics prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Call Loop design system — synced from Figma "00 Design System" (BOVX8Hmx1HfwwBeDwOcZQL), 2026-10-19. Source of truth: design-system/tokens.css */
  /* Primary */
  --blue1:#1364F9;--blue2:#1854EA;--blue3:#1885EA;--blue4:#1362AC;--blue5:#E7EFFE;--blue6:#D0E0FE;
  --blue1-dis:rgba(19,100,249,.4);--blue3-dis:rgba(24,133,234,.4);
  --black:#14161A;--white:#FFFFFF;--g1:#757D8A;--g2:#B7BFC8;--g3:#E0E6EE;--g4:#F3F5F8;
  --g2-dis:rgba(183,191,200,.45);--g2-light:rgba(183,191,200,.3);
  --text:#2C2D2E; /* not a Figma style — kept for existing prototype usage */
  /* Secondary */
  --purple1:#7A16F5;--purple2:#C6AFE2;--purple3:#F0E4FF;--aqua1:#A4C5DB;--aqua2:#E4F4FF;
  --orange1:#F86919;--orange2:#D6BAAA;--orange3:#FFEEE4;
  /* States */
  --ok:#05944F;--ok2:#026233;--ok3:#E7F6ED;--notify1:#2E9AE4;--notify2:#E6F7FF;
  --warn1:#FFC043;--warn2:#BA7D04;--warn3:#855A04;--warn4:#FFF8E9;--err:#E11900;--err2:#A11200;--err3:#FFF1F0;
  /* Gradients */
  --grad1:linear-gradient(180deg,#F3F5F8 0%,#EEF5FF 100%);--grad2:linear-gradient(270deg,#F3F5F8 60%,rgba(243,245,248,.8) 100%);--grad3:#E7EFFE;
  /* Effects */
  --shadow1:0 0 2px rgba(83,102,137,.2),0 12px 16px rgba(83,102,137,.08),0 10px 40px rgba(83,102,137,.08);
  --shadow2:0 4px 8px -2px rgba(27,46,94,.04);
  --shadow3:0 0 2px rgba(83,102,137,.2),0 10px 20px rgba(83,102,137,.05),0 30px 50px rgba(83,102,137,.1);
  /* Shape */
  --r-xs:4px;--r:8px;
  --font:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--black);background:#fff;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:var(--blue1)}a:hover{color:var(--blue2)}
.muted{color:var(--g1)}
.app{display:flex;flex-wrap:wrap;min-height:100vh}

/* Sidebar */
.side{width:240px;flex:none;height:100vh;position:sticky;top:0;overflow:auto;padding:16px 12px;box-shadow:inset -1px 0 0 var(--g3);display:flex;flex-direction:column;justify-content:space-between;gap:24px;background:#fff}
.org{height:40px;padding:0 8px;display:flex;align-items:center;gap:10px;border:0;background:transparent;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.divider{height:1px;background:var(--g3);margin:8px 4px}
.nav{height:36px;padding:0 8px 0 12px;display:flex;align-items:center;gap:12px;border-radius:8px;color:var(--black);text-decoration:none;font-size:14px;line-height:16px}
.nav:hover{background:var(--g4);color:var(--black)}
.nav svg{stroke:var(--text);flex:none}
.nav.on{background:var(--aqua2);font-weight:500}.nav.on svg{stroke:var(--blue1)}
.nav .grow{flex:1}
.cnt{min-width:16px;height:16px;padding:0 5px;border-radius:8px;color:#fff;font-size:10px;line-height:16px;font-weight:600;text-align:center}
.new{padding:2px 8px;border-radius:6px;background:var(--purple3);color:var(--purple1);font-size:11px;line-height:14px;font-weight:500}
.trial{margin-top:12px;padding:12px;border-radius:12px;background:var(--g4);display:flex;flex-direction:column;gap:10px}
.trial .row{display:flex;justify-content:space-between;align-items:center;font-size:11px;line-height:14px}
.trial a{text-decoration:none}
.prog{height:6px;border-radius:3px;background:#fff;box-shadow:inset 0 0 0 1px var(--g3);overflow:hidden}.prog i{display:block;height:100%;width:100%;background:var(--blue3);border-radius:3px}

/* Main */
.main{flex:999 1 560px;min-width:0;padding:40px 48px 96px}
.wrap{max-width:1120px;display:flex;flex-direction:column;gap:24px}
h1{margin:0;font-size:40px;line-height:48px;letter-spacing:-.8px;font-weight:600}
.h3{margin:0;font-size:15px;line-height:20px;font-weight:600}
.tabs{display:flex;gap:8px;box-shadow:inset 0 -1px 0 var(--g3)}
.tab{padding:0 8px 10px;font-size:14px;line-height:16px;color:var(--g1);text-decoration:none}
.tab:hover{color:var(--blue3)}
.tab.on{color:var(--blue1);font-weight:500;box-shadow:inset 0 -2px 0 var(--blue1)}
.crumb{font-size:12px;line-height:16px;color:var(--g1);text-decoration:none;padding-left:28px;align-self:flex-start}
.crumb:hover{color:var(--blue3)}
.back{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;color:var(--g1)}
.back:hover{color:var(--black)}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:10}
.dd{position:relative}
.ddbtn{height:36px;padding:0 10px 0 12px;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 1px var(--g3);font-size:14px;line-height:16px;cursor:pointer;white-space:nowrap}
.ddbtn:hover,.ddbtn[aria-expanded="true"]{box-shadow:inset 0 0 0 1px var(--g2)}
.ddbtn:focus-visible,.opt:focus-visible,.day:focus-visible,.navb:focus-visible{outline:2px solid var(--blue1);outline-offset:1px}
.ddbtn .chev{transition:transform .15s}
.ddbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.badge{min-width:16px;height:16px;padding:0 5px;border-radius:8px;background:var(--blue1);color:#fff;font-size:10px;line-height:16px;font-weight:600;text-align:center}
.pop{position:absolute;top:42px;left:0;z-index:41;background:#fff;border-radius:8px;box-shadow:var(--shadow1);padding:8px;display:flex;flex-direction:column;gap:2px;max-height:360px;overflow:auto}
.search{position:relative;margin-bottom:4px}
.search svg{position:absolute;left:10px;top:8px}
.search input{width:100%;height:32px;padding:6px 10px 6px 32px;border:0;border-radius:8px;box-shadow:inset 0 0 0 1px var(--g3);font-size:14px;outline:none}
.search input:focus{box-shadow:inset 0 0 0 1px var(--blue1),0 0 0 3px var(--blue6)}
.grp{padding:8px 8px 4px;font-size:12px;line-height:16px;color:var(--g1)}
.opt{width:100%;min-height:32px;padding:6px 8px;display:flex;align-items:center;gap:8px;border:0;border-radius:6px;background:transparent;font-size:14px;line-height:16px;text-align:left;cursor:pointer}
.opt:hover,.opt.sel{background:var(--g4)}
.opt .ck{width:16px;height:16px;flex:none;display:inline-flex}
.opt .ol{flex:1;white-space:nowrap}
.none{padding:8px;font-size:14px;color:var(--g1)}

/* Date picker */
.calpop{padding:0;flex-direction:row;max-height:none;overflow:visible}
.presets{width:148px;flex:none;padding:8px;box-shadow:inset -1px 0 0 var(--g3);display:flex;flex-direction:column;gap:2px}
.presets .opt{height:32px}
.month{padding:12px 16px 16px;display:flex;flex-direction:column;gap:8px}
.mhead{height:28px;display:flex;align-items:center;justify-content:space-between;font-size:14px;line-height:16px;font-weight:500}
.navb{width:28px;height:28px;padding:0;border:0;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 1px var(--g3);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.navb:hover{background:var(--g4)}
.spacer{width:28px}
.grid7{display:grid;grid-template-columns:repeat(7,38px)}
.wd{height:28px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--g1)}
.cell{height:32px;display:flex;align-items:center;justify-content:center}
.cell.band{background:var(--blue5)}
.cell.bl{background:linear-gradient(90deg,transparent 50%,var(--blue5) 50%)}
.cell.br{background:linear-gradient(90deg,var(--blue5) 50%,transparent 50%)}
.day{width:32px;height:32px;padding:0;border:0;border-radius:8px;background:transparent;font-size:13px;cursor:pointer}
.day:hover{background:var(--g4)}
.day.edge{background:var(--blue1);color:#fff;font-weight:600}
.out{font-size:13px;color:var(--g2)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stat{padding:12px 12px 14px;border-radius:12px;background:var(--g4);display:flex;flex-direction:column;gap:10px}
.stat .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;line-height:16px;color:var(--text)}
.stat .lab{display:flex;align-items:center;gap:4px}
.stat .val{font-size:28px;line-height:32px;letter-spacing:-.56px}
.tip{position:relative;display:inline-flex;color:var(--g1);cursor:help;outline:none}
.tip:hover,.tip:focus{color:var(--black)}
.tip .tb{display:none;position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);z-index:20;width:220px;padding:8px;border-radius:8px;background:rgba(20,22,26,.9);color:#fff;font-size:12px;line-height:16px;text-align:left;font-weight:400}
.tip:hover .tb,.tip:focus .tb{display:block}
.hint{cursor:help;text-decoration:underline dotted var(--g2);text-underline-offset:3px}

/* Tables */
.tbl{position:relative;overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;line-height:16px}
th{height:36px;padding:0 8px;background:var(--g4);color:var(--g1);font-weight:400;font-size:12px;text-align:left;white-space:nowrap}
th:first-child{padding-left:12px;border-radius:8px 0 0 8px}
th:last-child{padding-right:12px;border-radius:0 8px 8px 0}
td{height:44px;padding:0 8px;border-bottom:1px solid var(--g3);white-space:nowrap}
td:first-child{padding-left:12px}
td:last-child{padding-right:12px}
tr.hov:hover td{background:var(--g4)}
tr.hov:hover td:first-child{border-radius:8px 0 0 8px}
tr.hov:hover td:last-child{border-radius:0 8px 8px 0}
.chl{text-decoration:none;font-weight:500}
.eye{display:inline-flex;color:var(--g1);opacity:0}
tr:hover .eye,.eye:focus{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.emptybox{padding:24px;border-radius:12px;border:1px dashed var(--g2);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.emptybox b{font-size:14px;line-height:20px;font-weight:600}
.emptybox span{font-size:12px;line-height:16px;color:var(--g1)}

/* Stacked chart */
.chart{display:flex;flex-direction:column;gap:12px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.legend{margin:0;padding:0;list-style:none;display:flex;gap:16px;flex-wrap:wrap}
.legend li{display:flex;align-items:center;gap:6px;font-size:13px;line-height:16px;color:var(--text)}
.legend i,.ctip i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.plot{display:flex;gap:8px}
.yax{width:32px;flex:none;height:180px;display:flex;flex-direction:column;justify-content:space-between;font-size:10px;line-height:10px;color:var(--g1);margin-top:-5px}
.scroll{flex:1;min-width:0;padding-bottom:8px}
.scroll.x{overflow-x:auto}
.track{display:flex}
.col{flex:1 0 0;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;border-right:1px dashed var(--g3)}
.scroll.x .col{flex:1 0 56px}
.scroll.x.fcx .col{flex:1 0 0}
.bararea{height:180px;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.col:hover .bararea{background:var(--g4)}
.stack{width:72%;max-width:44px;display:flex;flex-direction:column-reverse;gap:2px}
.seg{border-radius:4px}
.xl{font-size:10px;line-height:12px;color:var(--g1);white-space:nowrap}
.ctip{display:none;position:absolute;top:4px;left:calc(50% + 26px);z-index:5;padding:8px;border-radius:8px;background:rgba(20,22,26,.9);color:#fff;font-size:12px;line-height:16px;white-space:nowrap;pointer-events:none;flex-direction:column;gap:6px}
.ctip span{display:flex;align-items:center;gap:6px}
.col.flip .ctip{left:auto;right:calc(50% + 26px)}
.col:hover .ctip{display:flex}

/* Bar list */
.blist{display:flex;flex-direction:column;gap:8px}
.blist .h3{margin-bottom:4px}
.blr{display:grid;column-gap:12px;align-items:center;font-size:13px;line-height:20px}
.blr b{font-weight:500}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{display:block;height:8px;border-radius:4px;background:var(--g4);overflow:hidden}
.meter span{display:block;height:100%;background:var(--blue6);border-radius:4px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:40px 48px;align-items:start}

/* Funnel */
.funnel{display:flex;flex-direction:column;gap:12px}
.fhead{display:flex;flex-direction:column;gap:4px}
.fhead p{margin:0;font-size:12px;line-height:16px;color:var(--text)}
.fcols{flex:1;min-width:0;display:flex}
.fcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px;border-right:1px dashed var(--g3)}
.farea{width:100%;display:flex;justify-content:center;align-items:flex-end;gap:8px}
.fbarw{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.fbar{width:100%;background:var(--blue6);border-radius:4px;display:flex;flex-direction:column;align-items:center}
.fv{font-size:15px;line-height:20px;font-weight:600}
.fp{font-size:12px;line-height:16px;color:var(--g1)}
.fl{font-size:10px;line-height:12px;color:var(--g1);text-align:center}
.fempty{align-self:stretch;width:100%;max-width:260px;margin:4px 12px 0;padding:12px;border-radius:12px;background:#fff;border:1px dashed var(--g2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.fempty b{font-size:14px;line-height:20px}
.fcol.wide{flex-grow:2}
.fplot{overflow-x:auto;padding-bottom:4px}
.fempty span{font-size:12px;line-height:16px;color:var(--g1)}
.btn-sb{margin-top:4px;height:32px;padding:8px 12px;border-radius:8px;background:var(--blue5);color:var(--blue1);font-size:14px;line-height:16px;font-weight:600;text-decoration:none;white-space:nowrap}
.btn-sb:hover{background:var(--blue6);color:var(--blue1)}
.fempty .btn-sb{height:auto;white-space:normal;text-align:center}

/* Forecast */
.tab .new{margin-left:6px;padding:1px 6px;font-size:10px;line-height:12px;vertical-align:1px}
.fnote{display:flex;align-items:flex-start;gap:8px;margin:0;font-size:13px;line-height:20px;color:var(--g1)}
.fnote svg{flex:none;margin-top:3px}
.fnote b{font-weight:500;color:var(--black)}
.stat .sub{display:block;margin-top:-6px;font-size:12px;line-height:16px;color:var(--g1)}
.stat .sub + .sub{margin-top:-8px}
.stat .up{color:var(--ok)}.stat .down{color:var(--warn2)}.stat .warn{color:var(--warn2)}
.alert{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;font-size:14px;line-height:20px}
.alert svg{flex:none}
.alert p{flex:1 1 320px;margin:0}
.alert.warn{background:var(--warn4);color:var(--warn3)}
.alert.info{background:var(--notify2);color:var(--black)}
.alert .acts{display:flex;align-items:center;gap:12px}
.btn-p{height:32px;padding:8px 12px;border-radius:8px;background:var(--blue1);color:#fff;font-size:14px;line-height:16px;font-weight:600;text-decoration:none;white-space:nowrap}
.btn-p:hover{background:var(--blue2);color:#fff}
.pill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;line-height:16px;font-weight:500}
.pill.hi{background:var(--ok3);color:var(--ok2)}
.pill.md{background:var(--blue5);color:var(--blue2)}
.pill.lo{background:var(--warn4);color:var(--warn3)}
tr.tot td{font-weight:600;border-bottom:0}
.fcx .track{align-items:stretch}
.fzone{display:flex;flex-direction:column;min-width:0}
.fzone.fut{border-left:1.5px dashed var(--blue1)}
.zl{height:16px;padding-left:6px;font-size:10px;line-height:12px;color:var(--g1);white-space:nowrap}
.fzone.fut .zl{color:var(--blue1);font-weight:600}
.zcols{flex:1;display:flex}
.fcx .bararea{position:relative}
.seg.fut{background-image:repeating-linear-gradient(135deg,rgba(20,22,26,.13) 0 1.5px,transparent 1.5px 5px)}
.seg.usual{outline:1px dashed var(--blue1);outline-offset:-1px}
.whisk{position:absolute;left:50%;width:1.5px;background:var(--g1);transform:translateX(-50%)}
.whisk::before,.whisk::after{content:"";position:absolute;left:-4px;width:9.5px;height:1.5px;background:var(--g1)}
.whisk::before{top:0}.whisk::after{bottom:0}
.legend .lg-f{width:14px;height:10px;background-color:var(--g3);background-image:repeating-linear-gradient(135deg,rgba(20,22,26,.25) 0 1.5px,transparent 1.5px 5px)}
.legend .lg-w{width:9px;height:12px;border-radius:0;background:linear-gradient(var(--g1),var(--g1)) center/1.5px 100% no-repeat,linear-gradient(var(--g1),var(--g1)) top/100% 1.5px no-repeat,linear-gradient(var(--g1),var(--g1)) bottom/100% 1.5px no-repeat}
.ctip em{font-style:normal;color:var(--g2)}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:4px 16px;flex-wrap:wrap}
.sec-h p{margin:0;font-size:12px;line-height:16px;color:var(--g1)}
.divsec{margin-top:16px;padding-top:32px;border-top:1px solid var(--g3)}
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.hlc{padding:12px 14px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--g3);display:flex;flex-direction:column;gap:4px}
.hlc span{font-size:12px;line-height:16px;font-weight:500;color:var(--blue1)}
.hlc p{margin:0;font-size:13px;line-height:20px}
.hlc b,.gfoot b,.plan b{font-weight:600}
.growth{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.gcard{padding:12px 14px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--g3);display:flex;flex-direction:column;gap:6px;min-width:0}
.glab{display:flex;justify-content:space-between;gap:8px;font-size:13px;line-height:16px;color:var(--text)}
.glab .muted{font-size:12px}
.gval{font-size:22px;line-height:28px;letter-spacing:-.4px}
.gval .muted{font-size:13px;letter-spacing:0}
.gd{font-size:12px;line-height:16px;color:var(--g1)}
.gd .up{color:var(--ok)}.gd .down{color:var(--warn2)}
.gcard svg{margin:6px 0 2px}
.gfoot{font-size:12px;line-height:16px;color:var(--text)}
.plan{padding:16px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--g3);display:flex;flex-direction:column;gap:12px}
.plan p{margin:0;font-size:13px;line-height:20px}
.pbar{display:flex;gap:2px;height:10px;border-radius:5px;background:var(--g4);overflow:hidden}
.pbar span{display:block;height:100%;background:var(--blue1)}
.pbar .over{background:var(--warn1)}
.pleg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;line-height:16px;color:var(--text)}
.pleg span{display:inline-flex;align-items:center;gap:6px}
.pleg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.plan .acts{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.phead{display:flex;flex-direction:column;gap:10px}
.phead .glab{width:100%}
.plink{font-size:14px;line-height:16px;font-weight:500;text-decoration:none}
.plan .pnote{font-size:12px;line-height:16px}
.segc{display:inline-flex;align-self:flex-start;padding:2px;border-radius:8px;background:var(--g4)}
.segc button{height:28px;padding:0 12px;border:0;border-radius:6px;background:transparent;font-size:13px;color:var(--g1);cursor:pointer}
.segc button[aria-pressed="true"]{background:#fff;color:var(--black);font-weight:500;box-shadow:var(--shadow2),0 0 0 1px var(--g3)}
.segc button:focus-visible{outline:2px solid var(--blue1);outline-offset:1px}
.tiers{display:flex;flex-wrap:wrap;gap:6px}
.tier{min-width:52px;padding:6px 8px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--g3);display:inline-flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;line-height:16px;font-weight:500}
.tier small{font-size:10px;line-height:12px;font-weight:400;color:var(--g1)}
.tier.below{color:var(--g2)}
.tier.cur{box-shadow:inset 0 0 0 1.5px var(--g1)}
.tier.rec{background:var(--blue5);box-shadow:inset 0 0 0 1.5px var(--blue1);color:var(--blue1)}
.tier.rec small{color:var(--blue1)}
.how{border-radius:12px;box-shadow:inset 0 0 0 1px var(--g3)}
.how > button{width:100%;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;background:transparent;font-size:14px;line-height:20px;font-weight:600;cursor:pointer;text-align:left}
.how > button:focus-visible{outline:2px solid var(--blue1);outline-offset:-2px;border-radius:12px}
.how > button[aria-expanded="true"] .chev{transform:rotate(180deg)}
.how dl{margin:0;padding:0 16px 16px;display:grid;grid-template-columns:minmax(140px,200px) minmax(0,1fr);gap:10px 24px;font-size:13px;line-height:20px}
.how dt{color:var(--g1)}
.how dd{margin:0}

/* Plan modals */
button.btn-sb,button.btn-p,button.plink{border:0;cursor:pointer;font-family:inherit}
button.plink{padding:0;background:transparent;color:var(--blue1)}
button.plink:hover{color:var(--blue2)}
.ovl{position:fixed;inset:0;z-index:70;background:rgba(20,22,26,.2);display:flex;justify-content:center;align-items:flex-start;padding:40px 16px;overflow-y:auto}
.dlg{width:900px;max-width:100%;padding:28px 32px;background:#fff;border-radius:20px;box-shadow:var(--shadow1);display:flex;flex-direction:column;gap:20px;outline:none}
.dlg.pay{width:780px}
.dtop{display:flex;align-items:center;gap:24px}
.dtop h2{margin:0;font-size:20px;line-height:24px;letter-spacing:-.4px;font-weight:600}
.dtop .xbtn{margin-left:auto}
.xbtn{width:32px;height:32px;padding:0;border:0;border-radius:8px;background:transparent;color:var(--g1);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.xbtn:hover{color:var(--black);background:var(--g4)}
.xbtn:focus-visible,.ropt:focus-within,.steps .n:focus-visible,.btn:focus-visible{outline:2px solid var(--blue1);outline-offset:1px}
.dsub{margin:-8px 0 0;font-size:14px;line-height:20px;color:var(--text)}
.dsub b{font-weight:600}
tr.bestrow td{background:var(--ok3)}
tr.bestrow td:first-child{border-radius:8px 0 0 8px}
tr.bestrow td:last-child{border-radius:0 8px 8px 0}
.pill.gr{background:var(--g3);color:var(--text)}
.save{padding:2px 6px;border-radius:6px;background:var(--ok3);color:var(--ok);font-size:12px;line-height:16px;font-weight:500;white-space:nowrap}
.steps{display:flex;align-items:center;gap:8px;font-size:14px;line-height:16px;font-weight:500;color:var(--blue1)}
.steps .n{width:24px;height:24px;padding:0;border:0;border-radius:6px;background:var(--blue1);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.steps button.n{cursor:pointer}.steps button.n:hover{background:var(--blue2)}
.paygrid{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;align-items:start}
.flab{display:block;margin-bottom:8px;font-size:12px;line-height:16px;color:var(--g1)}
.ropt{display:flex;align-items:center;gap:8px;min-height:32px;margin-bottom:8px;padding:6px 12px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--g3);font-size:14px;line-height:20px;cursor:pointer}
.ropt:hover{box-shadow:inset 0 0 0 1px var(--g2)}
.ropt input{flex:none;width:16px;height:16px;margin:0 4px 0 0;accent-color:var(--blue1);cursor:pointer}
.ropt b{margin-left:8px;font-weight:600}
.ropt .muted{margin-left:-4px}
.cardsel{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--g3);font-size:14px;line-height:16px}
.visa{width:32px;height:20px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--g3);display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;font-style:italic;color:#1A1F71}
.dpanel{padding:16px;border-radius:16px;background:var(--g4);display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:20px}
.dpanel .dt{font-weight:600}
.dpanel .r{display:flex;justify-content:space-between;gap:12px;color:var(--g1)}
.dpanel .r b{color:var(--black);font-weight:500;text-align:right}
.dpanel .tot,.dpanel .tot b{color:var(--black);font-weight:600}
.dpanel hr{width:100%;margin:0;border:0;border-top:1px solid var(--g3)}
.dpanel small{margin-top:-10px;font-size:11px;line-height:14px}
.dact{display:flex;gap:12px;margin-top:4px}
.btn{height:40px;padding:0 16px;display:inline-flex;align-items:center;border:0;border-radius:8px;font-size:14px;line-height:16px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--blue1);color:#fff}.btn.primary:hover{background:var(--blue2)}
.btn.secondary{background:var(--g2-light);color:var(--black)}.btn.secondary:hover{background:var(--g3)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;padding:10px 14px;border-radius:10px;background:rgba(20,22,26,.92);color:#fff;font-size:14px;line-height:20px;white-space:nowrap;box-shadow:var(--shadow1)}

/* Prototype switch */
.proto{position:fixed;right:16px;top:8px;z-index:60;display:flex;align-items:center;gap:4px;padding:2px 2px 2px 10px;border-radius:10px;background:rgba(20,22,26,.92);color:#fff;font-size:12px;line-height:16px;box-shadow:var(--shadow1)}
.proto span{margin-right:4px;color:#B7BFC8}
.proto button{height:24px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:#fff;font-size:12px;cursor:pointer}
.proto button[aria-pressed="true"]{background:#fff;color:var(--black);font-weight:600}

@media (max-width:800px){
  .side{position:static;height:auto;width:100%;box-shadow:inset 0 -1px 0 var(--g3)}
  .side .bottom{display:none}
  .main{padding:24px 16px 96px}
  h1{font-size:28px;line-height:32px;letter-spacing:-.56px}
  .calpop{flex-direction:column;max-width:calc(100vw - 32px)}
  .presets{width:auto;flex-direction:row;flex-wrap:wrap;box-shadow:inset 0 -1px 0 var(--g3)}
  .calpop .month + .month{display:none}
  .two{grid-template-columns:minmax(0,1fr)}
  .scroll{overflow-x:auto}
  .col{min-width:44px}
  .scroll.x.fcx .col{min-width:0}
  .fempty{margin:4px 0 0;padding:10px 8px}
  .fempty .btn-sb{padding:6px 8px;font-size:13px}
  .how dl{grid-template-columns:minmax(0,1fr);gap:2px}
  .dlg{padding:24px 16px}
  .dtop{flex-wrap:wrap;gap:12px}
  .paygrid{grid-template-columns:minmax(0,1fr)}
  .how dd{margin-bottom:10px}
  .proto span{display:none}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  'use strict';

  /* ---------- helpers ---------- */
  const MS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const ML = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (v) => Math.round(v).toLocaleString('en-US');
  const money = (v) => '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const pctS = (r) => (r * 100).toFixed(1) + '%';
  const norm = (t) => String(t).toLowerCase().replace(/[^a-z0-9]/g, '');
  const dkey = (d) => d.getFullYear() * 10000 + d.getMonth() * 100 + d.getDate();
  const fmtD = (d) => MS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
  const TODAY = new Date(2026, 7, 26);

  const IC = {
    cal: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#757D8A" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="10" rx="2"/><path d="M2.5 6.5h11M5.5 2v3M10.5 2v3"/></svg>',
    filter: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#757D8A" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4.5h11M4.5 8h7M6.5 11.5h3"/></svg>',
    source: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#757D8A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3.5l4 3.5-4 3.5M13 7H7.5A4.5 4.5 0 0 0 3 11.5v1"/></svg>',
    phone: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#757D8A" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="4.5" y="2" width="7" height="12" rx="1.5"/><path d="M7.25 11.5h1.5"/></svg>',
    chev: '<svg class="chev" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#757D8A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>',
    check: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#1364F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>',
    search: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#757D8A" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5l3 3"/></svg>',
    left: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4L6 8l4 4"/></svg>',
    right: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg>',
    eye: '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M1.5 9S4.2 4 9 4s7.5 5 7.5 5-2.7 5-7.5 5-7.5-5-7.5-5z"/><circle cx="9" cy="9" r="2.2"/></svg>',
    info: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M8 7.3v3.7M8 5v.1"/></svg>',
    trend: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#757D8A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 11.5l3.5-3.5 2.5 2 5-5.5M10 4.5h3.5V8"/></svg>',
    bcast: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#757D8A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 2.5l-11 4.8 4.5 1.7 1.7 4.5zM7 9l3-3"/></svg>',
    warn: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#BA7D04" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L1.8 17h16.4z"/><path d="M10 8.5v3.8M10 14.6v.1"/></svg>',
    note: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#2E9AE4" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M10 9v5M10 6.2v.1"/></svg>'
  };

  /* ---------- shared data ---------- */
  const SOURCES = [
    { id: 'inbox', label: 'Inbox (conversations)', share: 0.366 },
    { id: 'broadcast', label: 'Broadcast', share: 0.235 },
    { id: 'campaign', label: 'Campaign', share: 0.11 },
    { id: 'api', label: 'API', share: 0.081 },
    { id: 'trigger', label: 'Trigger', share: 0.066 },
    { id: 'hubspot', label: 'HubSpot Actions', share: 0.044 },
    { id: 'keyword', label: 'Keyword', share: 0.038 },
    { id: 'webform', label: 'Web Form', share: 0.034 },
    { id: 'zapier', label: 'Zapier', share: 0.026 }
  ];
  const PHONES = [
    { title: 'Local numbers', options: [{ id: 'l1', label: '(205) 548-1655' }, { id: 'l2', label: '(205) 548-1621' }] },
    { title: 'Toll Free', options: [
      { id: 't1', label: '(833) 548-1602' }, { id: 't2', label: '(833) 548-1677' }, { id: 't3', label: '(844) 210-3391' },
      { id: 't4', label: '(855) 774-0182' }, { id: 't5', label: '(877) 309-5520' }, { id: 't6', label: '(888) 640-1149' },
      { id: 't7', label: '(800) 512-7736' }
    ] }
  ];
  const SERVICES = [{ title: '', options: [{ id: 'all', label: 'All services' }, { id: 'sms', label: 'SMS' }, { id: 'voice', label: 'Voice' }, { id: 'ringless', label: 'Ringless' }] }];
  const SOURCE_GROUPS = [{ title: '', options: [{ id: 'all', label: 'All sources' }].concat(SOURCES.map((s) => ({ id: s.id, label: s.label }))) }];
  const GRAN = [{ title: '', options: [{ id: 'Monthly', label: 'Monthly' }, { id: 'Weekly', label: 'Weekly' }, { id: 'Daily', label: 'Daily' }] }];

  /* ---------- state ---------- */
  const S = {
    page: 'messages',
    empty: false,
    range: { start: new Date(2025, 8, 21), end: new Date(2026, 7, 26) },
    draft: null,
    preset: null,
    view: { y: 2025, m: 8 },
    svc: 'all',
    src: 'all',
    phones: [],
    gran: {},
    open: null,
    q: '',
    fh: '30',
    fb: '90',
    fbc: 'sched',
    fnew: false,
    how: false,
    pcyc: 'monthly',
    modal: null, // 'compare' | 'pay'
    mcyc: 'monthly',
    pay: null, // { c, cyc }
    perMonth: 0,
    toast: ''
  };
  const PAGES = ['messages', 'credits', 'forecast', 'sms', 'voice', 'ringless'];
  let DD = {};

  function factors() {
    const pf = S.phones.length ? 0.35 + 0.65 * S.phones.length / 9 : 1;
    const row = SOURCES.find((x) => x.id === S.src);
    const sf = row ? row.share : 1;
    return { pf, sf, f: pf * sf };
  }

  /* ---------- components ---------- */
  function dropdown(id, o) {
    const multi = !!o.multi;
    const val = Array.isArray(o.value) ? o.value : [o.value];
    DD[id] = { multi, val, onSet: o.onSet };
    const open = S.open === id;
    const all = o.groups.flatMap((g) => g.options);
    const sel = all.find((x) => x.id === val[0]);
    const label = multi ? o.label : (sel ? sel.label : o.label);
    let pop = '';
    if (open) {
      const q = norm(S.q);
      const groups = o.groups.map((g) => ({ title: g.title, options: g.options.filter((x) => !q || norm(x.label).includes(q)) })).filter((g) => g.options.length);
      pop = '<div class="pop" role="listbox" aria-label="' + esc(label) + '"' + (multi ? ' aria-multiselectable="true"' : '') + ' style="width:' + (o.width || (multi ? 208 : 180)) + 'px">' +
        (o.search ? '<div class="search">' + IC.search + '<input id="q-' + id + '" type="search" data-input="search" placeholder="Search..." aria-label="Search" value="' + esc(S.q) + '"></div>' : '') +
        groups.map((g) => (g.title ? '<div class="grp">' + esc(g.title) + '</div>' : '') + g.options.map((x) => {
          const on = val.includes(x.id);
          return '<button type="button" class="opt' + (!multi && on ? ' sel' : '') + '" role="option" aria-selected="' + on + '" data-act="pick" data-id="' + id + '" data-val="' + x.id + '">' +
            (multi ? '<span class="ck">' + (on ? IC.check : '') + '</span>' : '') +
            '<span class="ol">' + esc(x.label) + '</span>' + (!multi && on ? IC.check : '') + '</button>';
        }).join('')).join('') +
        (groups.length ? '' : '<div class="none">No matches</div>') + '</div>';
    }
    return '<div class="dd"><button type="button" class="ddbtn" data-act="toggle" data-id="' + id + '" aria-haspopup="listbox" aria-expanded="' + open + '">' +
      (o.icon ? IC[o.icon] : '') + '<span>' + esc(label) + '</span>' +
      (multi && val.length ? '<span class="badge">' + val.length + '</span>' : '') + IC.chev + '</button>' + pop + '</div>';
  }

  function presetList() {
    const back = (days) => new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate() - days + 1);
    const backM = (m) => new Date(TODAY.getFullYear(), TODAY.getMonth() - m, TODAY.getDate() + 1);
    return [
      ['Last 7 days', back(7)], ['Last 14 days', back(14)], ['Last 30 days', back(30)],
      ['Last 3 months', backM(3)], ['Last 6 months', backM(6)], ['This year', new Date(2026, 0, 1)],
      ['Last 12 months', backM(12)], ['All time', new Date(2024, 0, 1)]
    ];
  }

  function monthGrid(y, m, idx) {
    const r = S.draft || S.range;
    const lo = dkey(r.start);
    const hi = r.end ? dkey(r.end) : lo;
    const off = (new Date(y, m, 1).getDay() + 6) % 7;
    let cells = '';
    for (let k = off; k > 0; k--) cells += '<div class="cell"><span class="out">' + new Date(y, m, 1 - k).getDate() + '</span></div>';
    const days = new Date(y, m + 1, 0).getDate();
    for (let n = 1; n <= days; n++) {
      const kk = dkey(new Date(y, m, n));
      const isLo = kk === lo, isHi = kk === hi, edge = isLo || isHi;
      let cls = 'cell';
      if (kk > lo && kk < hi) cls += ' band';
      else if (lo !== hi && isLo) cls += ' bl';
      else if (lo !== hi && isHi) cls += ' br';
      cells += '<div class="' + cls + '"><button type="button" class="day' + (edge ? ' edge' : '') + '" data-act="day" data-k="' + y + '-' + m + '-' + n + '" aria-pressed="' + edge + '" aria-label="' + ML[m] + ' ' + n + ', ' + y + '">' + n + '</button></div>';
    }
    const prev = idx === 0 ? '<button type="button" class="navb" data-act="calnav" data-d="-1" aria-label="Previous month">' + IC.left + '</button>' : '<span class="spacer"></span>';
    const next = idx === 1 ? '<button type="button" class="navb" data-act="calnav" data-d="1" aria-label="Next month">' + IC.right + '</button>' : '<span class="spacer"></span>';
    return '<div class="month"><div class="mhead">' + prev + '<span>' + ML[m] + ' ' + y + '</span>' + next + '</div><div class="grid7">' +
      ['Mo','Tu','We','Th','Fr','Sa','Su'].map((w) => '<span class="wd">' + w + '</span>').join('') + cells + '</div></div>';
  }

  function dateRange() {
    const open = S.open === 'date';
    const r = S.draft || S.range;
    let pop = '';
    if (open) {
      const a = new Date(S.view.y, S.view.m, 1);
      const b = new Date(S.view.y, S.view.m + 1, 1);
      pop = '<div class="pop calpop" role="dialog" aria-label="Choose date range"><div class="presets">' +
        presetList().map((p, i) => '<button type="button" class="opt' + (S.preset === p[0] ? ' sel' : '') + '" data-act="preset" data-i="' + i + '">' + p[0] + '</button>').join('') +
        '</div>' + monthGrid(a.getFullYear(), a.getMonth(), 0) + monthGrid(b.getFullYear(), b.getMonth(), 1) + '</div>';
    }
    return '<div class="dd"><button type="button" class="ddbtn" data-act="toggle" data-id="date" aria-haspopup="dialog" aria-expanded="' + open + '">' + IC.cal +
      '<span>' + fmtD(r.start) + '</span><span class="muted">–</span><span>' + (r.end ? fmtD(r.end) : 'Select end') + '</span>' + IC.chev + '</button>' + pop + '</div>';
  }

  function stats(list) {
    return '<div class="stats">' + list.map((s) =>
      '<div class="stat"><div class="top"><span class="lab">' + esc(s.label) +
      (s.tip ? '<span class="tip" tabindex="0" role="img" aria-label="' + esc(s.tip) + '">' + IC.info + '<span class="tb">' + esc(s.tip) + '</span></span>' : '') +
      '</span>' + (s.pct ? '<span class="muted">' + s.pct + '</span>' : '') + '</div><span class="val">' + s.value + '</span>' +
      (s.sub || []).map((x) => '<span class="sub">' + x + '</span>').join('') + '</div>'
    ).join('') + '</div>';
  }

  function chart(id, title, series, seed, scale) {
    const gran = S.gran[id] || 'Monthly';
    let start = S.range.start, end = S.range.end;
    const buckets = [];
    if (gran === 'Weekly') {
      let d = new Date(start);
      while (d <= end) {
        const e = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 6);
        const last = e > end ? end : e;
        let label = MS[d.getMonth()] + ' ' + d.getDate();
        if (dkey(last) !== dkey(d)) label += '–' + (last.getMonth() === d.getMonth() ? '' : MS[last.getMonth()] + ' ') + last.getDate();
        buckets.push({ label, key: dkey(d) + 7 });
        d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 7);
      }
    } else if (gran === 'Daily') {
      let d = new Date(start);
      while (d <= end) {
        buckets.push({ label: MS[d.getMonth()] + ' ' + d.getDate(), key: dkey(d) + 3 });
        d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
      }
    } else {
      let y = start.getFullYear(), m = start.getMonth();
      const cross = start.getFullYear() !== end.getFullYear();
      while (y * 12 + m <= end.getFullYear() * 12 + end.getMonth()) {
        buckets.push({ label: MS[m] + (cross && (m === 0 || buckets.length === 0) ? ' ’' + String(y).slice(2) : ''), key: y * 100 + m });
        m++; if (m > 11) { m = 0; y++; }
      }
    }
    const max = 280, plotH = 180;
    const scroll = buckets.length > 16;
    const rnd = (k, j) => { const x = Math.sin(seed * 101.3 + k * 0.0137 + j * 78.233) * 43758.5453; return x - Math.floor(x); };
    const cols = buckets.map((b, i) => {
      let vals = series.map((s, j) => Math.round((0.12 + 0.88 * rnd(b.key, j)) * s.w * 190 * scale));
      const sum = vals.reduce((a, v) => a + v, 0);
      if (sum > 270) vals = vals.map((v) => Math.round(v * 270 / sum));
      const total = vals.reduce((a, v) => a + v, 0);
      const segs = series.map((s, j) => vals[j] > 0 ? '<div class="seg" style="height:' + (vals[j] / max * plotH).toFixed(1) + 'px;background:' + s.color + '"></div>' : '').join('');
      const tip = '<div class="ctip"><strong>' + esc(b.label) + ' · ' + total + '</strong>' + series.map((s, j) => '<span><i style="background:' + s.color + '"></i>' + esc(s.label) + ' - ' + vals[j] + '</span>').join('') + '</div>';
      return '<div class="col' + (i >= buckets.length - 3 ? ' flip' : '') + '"><div class="bararea"><div class="stack">' + segs + '</div></div><span class="xl">' + esc(b.label) + '</span>' + tip + '</div>';
    }).join('');
    return '<section class="chart"><div class="chead"><h3 class="h3">' + esc(title) + '</h3><ul class="legend" aria-label="Legend">' +
      series.map((s) => '<li><i style="background:' + s.color + '"></i>' + esc(s.label) + '</li>').join('') + '</ul></div><div>' +
      dropdown('gran-' + id, { icon: 'cal', groups: GRAN, value: gran, width: 160, onSet: (v) => { S.gran[id] = v; } }) +
      '</div><div class="plot"><div class="yax" aria-hidden="true"><span>280</span><span>210</span><span>140</span><span>70</span><span>0</span></div>' +
      '<div class="scroll' + (scroll ? ' x' : '') + '"><div class="track" role="img" aria-label="' + esc(title + ', ' + gran.toLowerCase() + ', ' + fmtD(start) + ' to ' + fmtD(end)) + '" style="min-width:' + (scroll ? buckets.length * 56 : 0) + 'px">' + cols + '</div></div></div></section>';
  }

  function barList(title, rows, lw) {
    const max = Math.max(1, ...rows.map((r) => r.n || 0));

      const ratio = r.ratio != null ? r.ratio : (r.n || 0) / max;

      return '<div class="blr" style="grid-template-columns:' + lw + 'px minmax(0,1fr) ' + (hp ? '48px 48px' : '52px') + '"><span class="ell">' + esc(r.label) + '</span>' +

        '<b>' + (r.value != null ? r.value : fmt(r.n || 0)) + '</b>' + (hp ? '<span class="muted">' + r.pct + '</span>' : '') + '</div>';

  function funnel(title, caption, max, stages) {
    const plotH = stages.some((s) => s.empty) ? 180 : 150;
    const ticks = [4, 3, 2, 1, 0].map((k) => fmt(max / 4 * k));
    const cols = stages.map((st) => {
      let inner = '';
      if (st.empty) {
        inner = '<div class="fempty"><b>' + esc(st.empty.title) + '</b><span>' + esc(st.empty.text) + '</span>' +
          (st.empty.action ? '<a class="btn-sb" href="#" data-dead>' + esc(st.empty.action) + '</a>' : '') + '</div>';
      } else {
        inner = st.bars.map((b) => {
          const h = Math.max(4, b.n / max * plotH);
          const inside = h >= 56;
          const label = '<span class="fv">' + fmt(b.n) + '</span>' + (b.pct ? '<span class="fp">' + b.pct + '</span>' : '');
          return '<div class="fbarw" style="width:' + (st.bars.length > 1 ? 72 : 88) + 'px">' + (inside ? '' : '<div style="display:flex;flex-direction:column;align-items:center">' + label + '</div>') +
            '<div class="fbar" style="height:' + h.toFixed(1) + 'px;padding-top:' + (inside ? 10 : 0) + 'px">' + (inside ? label : '') + '</div></div>';
        }).join('');
      }
      return '<div class="fcol' + (st.empty ? ' wide' : '') + '"><div class="farea" style="height:' + plotH + 'px">' + inner + '</div><span class="fl">' + esc(st.label) + '</span></div>';
    }).join('');
    const aria = title + ': ' + stages.map((s) => s.label + ' ' + (s.empty ? s.empty.title : s.bars.map((b) => b.n).join(' and '))).join(', ');
    return '<section class="funnel"><div class="fhead"><h3 class="h3">' + esc(title) + '</h3>' + (caption ? '<p>' + esc(caption) + '</p>' : '') + '</div>' +
      '<div class="plot fplot" role="img" aria-label="' + esc(aria) + '"><div class="yax" aria-hidden="true" style="height:' + plotH + 'px">' + ticks.map((t) => '<span>' + t + '</span>').join('') + '</div><div class="fcols" style="min-width:' + stages.reduce((a, st) => a + (st.empty ? 200 : st.bars.length * 80 + 16), 0) + 'px">' + cols + '</div></div></section>';
  }
