  /* ---------- forecast model ---------- */
  const WDS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const dOff = (o) => new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate() + o);
  const offOf = (d) => Math.round((d - TODAY) / 864e5);
  const fmtS = (d) => MS[d.getMonth()] + ' ' + d.getDate();
  const CHS = ['sms', 'voice', 'ringless'];
  const CH_LABEL = { sms: 'SMS', voice: 'Voice', ringless: 'Ringless' };
  const CH_UNIT = { sms: 'clicks', voice: 'transfers', ringless: 'callbacks' };
  const FC = {
    balance: 14021,
    credit: { sms: 1.35, voice: 3.6, ringless: 2 },
    // engagements per message sent: SMS clicks, Voice transfers, Ringless callbacks
    eng: { sms: 0.94 * 0.085, voice: 0.879 * 0.563 * 0.43, ringless: 0.717 * 0.26 },
    revPerClick: 9.16,
    engTrend: 0.015, // engagement rates improve ~1.5% a month
    accuracy: 0.962, // last full month: forecast ÷ actual revenue
    plan: { line: 'Pro', cycle: 'monthly', credits: 2500 }, // credits a month
    usualPerWeek: 175,
    newDays: 9,
    flows: [
      { id: 'camp', perDay: 18, trend: 0.06, spread: 0.15, mix: { sms: 0.7, voice: 0.15, ringless: 0.15 }, basis: '3 active campaigns · ~125 new enrollments a week',
        items: [['New lead nurture', 0.5], ['Abandoned cart', 0.3], ['Post-purchase review', 0.2]] },
      { id: 'trig', perDay: 12, trend: 0.12, spread: 0.25, mix: { sms: 0.8, voice: 0.2, ringless: 0 }, basis: '2 active triggers · ~85 webhook events a week',
        items: [['Shopify: order created', 0.65], ['Calendly: booking made', 0.35]] },
      { id: 'other', perDay: 26, trend: 0.03, spread: 0.2, mix: { sms: 0.85, voice: 0.15, ringless: 0 }, basis: 'Inbox replies, API, keywords, web forms, Zapier, HubSpot' }
    ],
    scheduled: [
      { name: 'Labor Day sale', date: new Date(2026, 8, 4), ch: 'sms', n: 520 },
      { name: 'September newsletter', date: new Date(2026, 8, 10), ch: 'sms', n: 380 },
      { name: 'Webinar reminder', date: new Date(2026, 8, 17), ch: 'sms', n: 240 },
      { name: 'Open house drop', date: new Date(2026, 9, 7), ch: 'ringless', n: 220 },
      { name: 'Fall promo call', date: new Date(2026, 8, 29), ch: 'voice', n: 180 },
      { name: 'Black Friday early access', date: new Date(2026, 9, 21), ch: 'sms', n: 640 },
      { name: 'Halloween offer', date: new Date(2026, 9, 29), ch: 'sms', n: 450 }
    ]
  };
  // Pro plans: c = credits a month (annual plans get c × 12 a year), m = monthly price, a = annual price, x = price per extra credit
  const PRO = [
    { c: 250, m: 15, a: 151, x: 0.045 }, { c: 500, m: 25, a: 252, x: 0.04 }, { c: 1000, m: 49, a: 504, x: 0.035 },
    { c: 2500, m: 99, a: 1008, x: 0.0325 }, { c: 5000, m: 179, a: 1812, x: 0.0315 }, { c: 7500, m: 249, a: 2520, x: 0.031 },
    { c: 10000, m: 329, a: 3324, x: 0.03 }, { c: 25000, m: 749, a: 7560, x: 0.0295 }, { c: 35000, m: 1049, a: 10584, x: 0.0285 },
    { c: 50000, m: 1499, a: 15120, x: 0.028 }
  ];
  const kfmt = (v) => v >= 1000 ? Number((v / 1000).toFixed(1)) + 'K' : String(Math.round(v));
  const usd = (v) => Math.abs(v - Math.round(v)) < 0.005 ? '$' + fmt(v) : money(v);
  const cents = (v) => Number((v * 100).toFixed(2)) + '¢';
  const proTier = (c) => PRO.find((t) => t.c === c);
  const planName = (t, cyc) => 'Pro ' + (cyc === 'annual' ? 'Annual ' + kfmt(t.c * 12) : 'Monthly ' + kfmt(t.c));
  // Monthly-equivalent cost of covering `perMonth` credits on a plan: plan price + extra credits at that plan's rate
  function planCost(t, cyc, perMonth) {
    const price = cyc === 'annual' ? t.a / 12 : t.m;
    const extra = Math.max(0, perMonth - t.c);
    return { t, cyc, price, extra, extraCost: extra * t.x, total: price + extra * t.x };
  }
  // Cheapest option; within $1, prefer the bigger plan (more room to grow)
  // Plans we may suggest: bigger than the current one, or the same one billed annually instead of monthly
  function upgrades(perMonth, cycles) {
    const cur = proTier(FC.plan.credits);
    return cycles.flatMap((cyc) => PRO.filter((t) => t.c > cur.c || (t === cur && cyc === 'annual' && FC.plan.cycle === 'monthly')).map((t) => planCost(t, cyc, perMonth)));
  }
  function cheapest(opts) {
    const min = Math.min(...opts.map((o) => o.total));
    return opts.filter((o) => o.total <= min + 1).pop();
  }

  const FSER = [
    { id: 'bc', label: 'Broadcasts', color: '#D0E0FE' },
    { id: 'usual', label: 'Usual broadcasts', color: '#D0E0FE', cls: 'usual' },
    { id: 'camp', label: 'Campaigns', color: '#C6AFE2' },
    { id: 'trig', label: 'Triggers', color: '#F6CD92' },
    { id: 'other', label: 'Inbox, API & other', color: '#A4C5DB' }
  ];
  // A shorter basis reacts faster to recent change: steeper trend, wider range
  const BASIS = { 30: { level: 1.05, trend: 1.5, spread: 1.35 }, 90: { level: 1, trend: 1, spread: 1 }, 180: { level: 0.93, trend: 0.7, spread: 0.85 } };
  const WK = [0.55, 1.1, 1.15, 1.1, 1.1, 1, 0.6]; // Sun..Sat, mean 0.943
  const frnd = (o, j) => { const x = Math.sin(o * 12.9898 + j * 78.233) * 43758.5453; return x - Math.floor(x); };
  const zero = () => ({ sms: 0, voice: 0, ringless: 0 });

  // Messages per channel for each series on day `o` (0 = today, negative = history)
  function fDay(o) {
    const out = { bc: zero(), usual: zero(), camp: zero(), trig: zero(), other: zero() };
    const wk = WK[dOff(o).getDay()] / 0.943;
    if (o <= 0) {
      if (S.fnew && o <= -FC.newDays) return out;
      if (o <= -6 && (-o - 6) % 14 === 0) out.bc.sms = Math.round(280 + 140 * frnd(o, 9));
      FC.flows.forEach((fl, j) => {
        const v = fl.perDay * Math.pow(1 + fl.trend, o / 30) * wk * (0.75 + 0.5 * frnd(o, j));
        CHS.forEach((c) => { out[fl.id][c] = v * fl.mix[c]; });
      });
      return out;
    }
    FC.scheduled.forEach((b) => { if (offOf(b.date) === o) out.bc[b.ch] += b.n; });
    if (S.fnew) return out;
    if (S.fbc === 'usual' && !FC.scheduled.some((b) => Math.abs(offOf(b.date) - o) <= 3)) out.usual.sms = FC.usualPerWeek / 7;
    const B = BASIS[S.fb];
    FC.flows.forEach((fl) => {
      const v = fl.perDay * B.level * Math.pow(1 + fl.trend * B.trend, o / 30) * wk;
      CHS.forEach((c) => { out[fl.id][c] = v * fl.mix[c]; });
    });
    return out;
  }

  function fSum(a, b) {
    const t = {};
    FSER.forEach((s) => { t[s.id] = zero(); });
    for (let o = a; o <= b; o++) {
      const d = fDay(o);
      FSER.forEach((s) => CHS.forEach((c) => { t[s.id][c] += d[s.id][c]; }));
    }
    return t;
  }

  function fMet(ch, m, all) {
    const chs = all || S.svc === 'all' ? CHS : [S.svc];
    const k = (c) => m === 'messages' ? 1 : m === 'credits' ? FC.credit[c] : m === 'engagements' ? FC.eng[c] : (c === 'sms' ? FC.eng.sms * FC.revPerClick : 0);
    return chs.reduce((a, c) => a + ch[c] * k(c), 0);
  }

  function fSpread(id) {
    if (id === 'bc') return 0.03;
    if (id === 'usual') return 0.35;
    const h = +S.fh;
    return FC.flows.find((x) => x.id === id).spread * BASIS[S.fb].spread * (h === 7 ? 0.8 : h === 90 ? 1.25 : 1);
  }

  function fTot(t, m, fut) {
    let v = 0, lo = 0, hi = 0;
    FSER.forEach((s) => {
      const x = fMet(t[s.id], m);
      const sp = fut ? fSpread(s.id) : 0;
      v += x; lo += x * (1 - sp); hi += x * (1 + sp);
    });
    return { v, lo, hi };
  }

  // Days until the balance runs out at forecast pace (all channels); Infinity past a year
  function fRunway() {
    if (S.fnew) return null;
    let left = FC.balance;
    for (let o = 1; o <= 365; o++) {
      const d = fDay(o);
      FSER.forEach((s) => { left -= fMet(d[s.id], 'credits', true); });
      if (left <= 0) return o;
    }
    return Infinity;
  }

  const fTrend = () => {
    const tot = FC.flows.reduce((a, f) => a + f.perDay, 0);
    return FC.flows.reduce((a, f) => a + f.perDay * f.trend, 0) / tot * BASIS[S.fb].trend;
  };
  const sgnPct = (r) => (r >= 0 ? '+' : '−') + Math.round(Math.abs(r) * 100) + '%';
  const rr = (v) => v >= 1000 ? Math.round(v / 10) * 10 : Math.round(v);
  const fv = (m, v) => (m === 'revenue' ? '$' : '') + fmt(v);
  const niceMax = (v) => { if (!(v > 0)) return 4; const p = Math.pow(10, Math.floor(Math.log10(v))); return [1, 2, 2.5, 5, 10].find((x) => x * p >= v) * p; };
  const shortN = (v, m) => (m === 'revenue' ? '$' : '') + (v >= 1000 ? (v / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : fmt(v));
  const swatch = (s) => '<i style="width:10px;height:10px;border-radius:3px;display:inline-block;flex:none;background:' + s.color + (s.cls ? ';outline:1px dashed var(--blue1);outline-offset:-1px' : '') + '"></i>';

  function fBuckets(h) {
    const res = [];
    if (h === 7) {
      for (let o = -13; o <= 7; o++) res.push({ a: o, b: o, fut: o > 0 });
    } else {
      const hw = h === 30 ? 12 : 13;
      for (let k = hw - 1; k >= 0; k--) res.push({ a: -7 * k - 6, b: -7 * k, fut: false });
      for (let o = 1; o <= h; o += 7) res.push({ a: o, b: Math.min(h, o + 6), fut: true });
    }
    return res;
  }

  function fChart(h) {
    const m = 'credits';
    const ser = FSER.filter((s) => s.id !== 'usual' || (S.fbc === 'usual' && !S.fnew));
    const data = fBuckets(h).map((b) => {
      const t = fSum(b.a, b.b);
      return { b, tot: fTot(t, m, b.fut), vals: ser.map((s) => fMet(t[s.id], m)) };
    });
    const max = niceMax(Math.max(...data.map((d) => d.tot.hi)));
    const H = 180;
    const nH = data.filter((d) => !d.b.fut).length;
    const sparse = data.length > 14;
    const col = (d, i) => {
      const a = dOff(d.b.a), z = dOff(d.b.b), days = d.b.b - d.b.a + 1;
      const full = days === 1 ? WDS[a.getDay()] + ', ' + fmtS(a) : fmtS(a) + ' – ' + fmtS(z) + (days < 7 ? ' (' + days + ' days)' : '');
      const show = !sparse || ((i - nH) % 2 + 2) % 2 === 0;
      const segs = ser.map((s, j) => d.vals[j] > 0.05 * max / 100 ? '<div class="seg' + (d.b.fut ? ' fut' : '') + (s.cls ? ' ' + s.cls : '') + '" style="height:' + Math.max(1.5, d.vals[j] / max * H).toFixed(1) + 'px;background-color:' + s.color + '"></div>' : '').join('');
      const wh = d.b.fut && d.tot.hi - d.tot.lo > 0 ? '<span class="whisk" style="bottom:' + (d.tot.lo / max * H).toFixed(1) + 'px;height:' + ((d.tot.hi - d.tot.lo) / max * H).toFixed(1) + 'px"></span>' : '';
      const tip = '<div class="ctip"><strong>' + esc(full) + ' · ' + (d.b.fut ? 'Forecast' : 'Actual') + '</strong>' +
        ser.map((s, j) => d.vals[j] >= 0.5 ? '<span>' + swatch(s) + esc(s.label) + ' - ' + fv(m, d.vals[j]) + '</span>' : '').join('') +
        '<span>Total - ' + fv(m, d.tot.v) + (d.b.fut ? ' <em>(likely ' + fv(m, rr(d.tot.lo)) + '–' + fv(m, rr(d.tot.hi)) + ')</em>' : '') + '</span></div>';
      return '<div class="col' + (i >= data.length - 4 ? ' flip' : '') + '"><div class="bararea">' + wh + '<div class="stack">' + segs + '</div></div><span class="xl">' + (show ? esc(days > 1 && days < 7 ? fmtS(a) + '–' + (z.getMonth() === a.getMonth() ? z.getDate() : fmtS(z)) : fmtS(a)) : '&nbsp;') + '</span>' + tip + '</div>';
    };
    const cols = data.map(col);
    const titles = { credits: 'Credits used and forecast', messages: 'Messages sent and forecast', engagements: 'Engagements and forecast', revenue: 'Revenue and forecast' };
    const ticks = [4, 3, 2, 1, 0].map((k) => shortN(max / 4 * k, m));
    const minW = data.length * 26;
    return '<section class="chart"><div class="chead"><h2 class="h3">' + titles[m] + '</h2><ul class="legend" aria-label="Legend">' +
      ser.map((s) => '<li>' + swatch(s) + esc(s.label) + '</li>').join('') +
      '<li><i class="lg-f"></i>Forecast</li><li><i class="lg-w"></i>Likely range</li></ul></div>' +
      '<div class="plot"><div class="yax" aria-hidden="true" style="margin-top:11px">' + ticks.map((t) => '<span>' + t + '</span>').join('') + '</div>' +
      '<div class="scroll x fcx"><div class="track" role="img" aria-label="' + esc(titles[m] + ': actual for the last ' + (h === 7 ? '14 days' : nH + ' weeks') + ', forecast for the next ' + h + ' days') + '" style="min-width:' + minW + 'px">' +
      '<div class="fzone" style="flex:' + nH + ' 1 0"><div class="zl">Actual</div><div class="zcols">' + cols.slice(0, nH).join('') + '</div></div>' +
      '<div class="fzone fut" style="flex:' + (data.length - nH) + ' 1 0"><div class="zl">Forecast →</div><div class="zcols">' + cols.slice(nH).join('') + '</div></div>' +
      '</div></div></div></section>';
  }

  // Calendar months: 11 full months back, the current month (actual to date + forecast), 3 months ahead
  function fMonths() {
    // Long-range trend always includes usual broadcasts, or months with nothing scheduled yet would look like a drop
    const keep = S.fbc;
    S.fbc = 'usual';
    const rows = [];
    for (let k = -11; k <= 3; k++) {
      const s = new Date(TODAY.getFullYear(), TODAY.getMonth() + k, 1);
      const e = new Date(TODAY.getFullYear(), TODAY.getMonth() + k + 1, 0);
      const a = offOf(s), b = offOf(e);
      const t = fSum(a, b);
      const fut = k > 0;
      const ef = Math.pow(1 + FC.engTrend, (a + b) / 2 / 30);
      const widen = fut ? 0.6 + 0.4 * k : 1;
      const row = { k, d: s, fut, now: k === 0 };
      ['messages', 'credits', 'engagements', 'revenue'].forEach((m) => {
        const x = fTot(t, m, fut);
        const f = m === 'engagements' || m === 'revenue' ? ef : 1;
        row[m] = { v: x.v * f, lo: (x.v - (x.v - x.lo) * widen) * f, hi: (x.v + (x.hi - x.v) * widen) * f };
      });
      const e1 = row.engagements;
      row.cpe = e1.v ? { v: row.credits.v / e1.v, lo: row.credits.v / e1.hi, hi: row.credits.v / e1.lo } : { v: 0, lo: 0, hi: 0 };
      rows.push(row);
    }
    S.fbc = keep;
    return rows;
  }

  const monLab = (d, yr) => MS[d.getMonth()] + (yr ? ' ’' + String(d.getFullYear()).slice(2) : '');

  // Small line chart: actual solid, forecast dashed with a likely-range band
  function trendLine(rows, key, f, label) {
    const W = 280, H = 96, top = 8, bot = 20;
    const n = rows.length;
    const iL = rows.findIndex((r) => r.now) - 1; // last full month
    const x = (i) => 6 + i * (W - 12) / (n - 1);
    const max = Math.max(...rows.map((r) => r[key].hi)) * 1.08 || 1;
    const y = (v) => top + (H - top - bot) * (1 - v / max);
    const pt = (i, v) => x(i).toFixed(1) + ',' + y(v).toFixed(1);
    const act = rows.slice(0, iL + 1).map((r, i) => pt(i, r[key].v)).join(' ');
    const fc = rows.slice(iL).map((r, j) => pt(iL + j, r[key].v)).join(' ');
    const band = rows.slice(iL).map((r, j) => pt(iL + j, j ? r[key].hi : r[key].v)).join(' ') + ' ' +
      rows.slice(iL).map((r, j) => pt(iL + j, j ? r[key].lo : r[key].v)).reverse().join(' ');
    const tx = x(iL + TODAY.getDate() / 31);
    const dots = rows.map((r, i) => {
      const t = monLab(r.d, true) + (r.fut ? ' forecast' : r.now ? ' (to date + forecast)' : '') + ': ' + f(r[key].v) + (r.fut ? ' (likely ' + f(r[key].lo) + '–' + f(r[key].hi) + ')' : '');
      return '<g><title>' + esc(t) + '</title><circle cx="' + x(i).toFixed(1) + '" cy="' + y(r[key].v).toFixed(1) + '" r="2.5" style="fill:' + (r.fut || r.now ? '#fff' : 'var(--blue1)') + ';stroke:var(--blue1);stroke-width:1.5"/>' +
        '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(r[key].v).toFixed(1) + '" r="9" fill="transparent"/></g>';
    }).join('');
    const lab = (i, anchor, txt) => '<text x="' + x(i).toFixed(1) + '" y="' + (H - 4) + '" text-anchor="' + anchor + '" style="fill:var(--g1);font-size:10px">' + txt + '</text>';
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="' + esc(label) + '" style="display:block;overflow:visible">' +
      '<line x1="0" x2="' + W + '" y1="' + (H - bot) + '" y2="' + (H - bot) + '" style="stroke:var(--g3)"/>' +
      '<polygon points="' + band + '" style="fill:var(--blue5)"/>' +
      '<line x1="' + tx.toFixed(1) + '" x2="' + tx.toFixed(1) + '" y1="' + (top - 4) + '" y2="' + (H - bot) + '" style="stroke:var(--g2);stroke-dasharray:2 3"/>' +
      '<polyline points="' + act + '" fill="none" style="stroke:var(--blue1);stroke-width:2;stroke-linejoin:round"/>' +
      '<polyline points="' + fc + '" fill="none" style="stroke:var(--blue1);stroke-width:2;stroke-dasharray:4 3;stroke-linejoin:round"/>' +
      dots + lab(0, 'start', monLab(rows[0].d, true)) + lab(iL + 1, 'middle', 'Today') + lab(n - 1, 'end', monLab(rows[n - 1].d)) + '</svg>';
  }

  function pageForecast() {
    const h = +S.fh, bas = +S.fb;
    const cur = fSum(1, h);
    // Compare with the basis period's average pace, scaled to the forecast length
    const prev = fSum(1 - bas, 0);
    const T = {};
    // Engagement rates keep improving (FC.engTrend), so value metrics are adjusted to each period's midpoint
    const efF = Math.pow(1 + FC.engTrend, h / 2 / 30);
    ['credits', 'messages', 'engagements', 'revenue'].forEach((m) => {
      const val = m === 'engagements' || m === 'revenue';
      const x = fTot(cur, m, true), k = val ? efF : 1;
      T[m] = { f: { v: x.v * k, lo: x.lo * k, hi: x.hi * k }, p: fTot(prev, m, false).v * h / bas * (val ? Math.pow(1 + FC.engTrend, -bas / 2 / 30) : 1) };
    });
    const sched = FC.scheduled.filter((b) => { const o = offOf(b.date); return o >= 1 && o <= h && (S.svc === 'all' || b.ch === S.svc); });
    const runway = fRunway();
    const credAll = FSER.reduce((a, s) => a + fMet(cur[s.id], 'credits', true), 0);
    const revTracked = S.svc === 'all' || S.svc === 'sms';
    const readyOn = dOff(14 - FC.newDays);

    const delta = (m, good) => {
      if (S.fnew) return 'No earlier period to compare';
      const r = T[m].f.v / T[m].p - 1;
      return '<span class="' + (good ? (r >= 0 ? 'up' : 'down') : '') + '">' + (r >= 0 ? '↑ ' : '↓ ') + Math.round(Math.abs(r) * 100) + '%</span> vs your ' + bas + '-day average';
    };
    const range = (m) => T[m].f.hi > 0 ? 'Likely ' + fv(m, rr(T[m].f.lo)) + ' – ' + fv(m, rr(T[m].f.hi)) : 'Nothing to forecast yet';
    let balSub;
    if (runway === null) balSub = ['Runout date: not enough data yet'];
    else if (runway === Infinity) balSub = ['Lasts 12+ months at this pace'];
    else balSub = ['Lasts until ~' + fmtS(dOff(runway)) + (runway <= h ? ' · <span class="warn">before this period ends</span>' : '')];
    balSub.push(credAll > FC.balance
      ? '<span class="warn">Needs ≈ ' + fmt(rr(credAll - FC.balance)) + ' more for this period</span>'
      : '≈ ' + fmt(FC.balance - credAll) + ' left after ' + fmtS(dOff(h)));

    const note = S.fnew
      ? '<b>' + fmtD(dOff(1)) + ' – ' + fmtD(dOff(h)) + '.</b> Your account has ' + FC.newDays + ' days of sending, so this forecast only counts scheduled broadcasts' +
        (sched.length ? ' (' + sched.length + ' in this period).' : ', and none are scheduled in this period yet.')
      : '<b>' + fmtD(dOff(1)) + ' – ' + fmtD(dOff(h)) + '.</b> Based on your sending from ' + fmtS(dOff(1 - bas)) + ' to ' + fmtS(TODAY) + ', a ' + sgnPct(fTrend()) + ' monthly trend' +
        (sched.length ? ' and ' + sched.length + ' scheduled broadcast' + (sched.length === 1 ? '' : 's') : ' (no broadcasts scheduled yet)') + '. These are estimates, not guarantees.';

    let alert = '';
    if (S.fnew) {
      alert = '<div class="alert info" role="status">' + IC.note + '<p>Campaigns, triggers and other sending are added to the forecast after 14 days of history, on <b>' + fmtS(readyOn) + '</b>. Until then, only scheduled broadcasts are counted.</p></div>';
    } else if (runway !== Infinity && runway <= h) {
      const weekly = fTot(cur, revTracked ? 'revenue' : 'engagements', true).v / h * 7;
      alert = '<div class="alert warn" role="alert">' + IC.warn + '<p>At this pace, your credits run out around <b>' + fmtD(dOff(runway)) + '</b>, ' + (h - runway) + ' days before this period ends. Campaigns and triggers would pause, and they bring in about <b>' +
        (revTracked ? fv('revenue', rr(weekly)) : fmt(weekly) + ' engagements') + ' a week</b>.</p>' +
        '<div class="acts"><button type="button" class="btn-p" data-act="mopen">Upgrade plan</button></div></div>';
    }

    // Return on credits: revenue (or engagements when revenue isn't tracked) per 100 credits
    const roM = revTracked ? 'revenue' : 'engagements';
    const roF = T.credits.f.v ? T[roM].f.v / T.credits.f.v * 100 : 0;
    const roP = T.credits.p ? T[roM].p / T.credits.p * 100 : 0;
    const roDelta = S.fnew || !roP ? 'No earlier period to compare'
      : '<span class="' + (roF >= roP ? 'up' : 'down') + '">' + (roF >= roP ? '↑ ' : '↓ ') + Math.round(Math.abs(roF / roP - 1) * 100) + '%</span> vs your ' + bas + '-day average';
    const st = [
      revTracked
        ? { label: 'Expected revenue', value: '≈ ' + fv('revenue', T.revenue.f.v), sub: [range('revenue'), delta('revenue', true)], tip: 'Expected from SMS link clicks, at your average of ' + money(FC.revPerClick) + ' per click from conversion tracking.' }
        : { label: 'Expected revenue', value: '<span class="muted">—</span>', sub: ['Tracked for SMS only'] },
      { label: 'Engagements', value: '≈ ' + fmt(T.engagements.f.v), sub: [range('engagements'), delta('engagements', true)], tip: 'Link clicks (SMS) + calls transferred (Voice) + callbacks (Ringless), at your recent rates.' },
      { label: 'Return on credits', value: roF ? (revTracked ? '$' + roF.toFixed(0) : roF.toFixed(1)) : '<span class="muted">—</span>', sub: [revTracked ? 'revenue per 100 credits' : 'engagements per 100 credits', roDelta],
        tip: 'What every 100 credits brings back: ' + (revTracked ? 'expected revenue' : 'expected engagements') + ' ÷ credits used × 100.' },
      { label: 'Messages', value: '≈ ' + fmt(T.messages.f.v), sub: [range('messages'), delta('messages', true)], tip: 'SMS and MMS sent, calls placed and ringless drops sent.' }
    ];

    // Highlights
    const M = S.fnew ? null : fMonths();
    const iL = M ? M.findIndex((r) => r.now) - 1 : 0;
    const hl = [];
    if (M) {
      const fast = FC.flows.filter((f) => f.items).reduce((a, f) => f.trend > a.trend ? f : a);
      hl.push(['Growing fastest', ({ camp: 'Campaigns', trig: 'Triggers' })[fast.id] + ' are up <b>' + sgnPct(fast.trend * BASIS[S.fb].trend) + ' a month</b>, led by ' + esc(fast.items[0][0]) + '.']);
      const c0 = M[0].cpe.v, c1 = M[iL].cpe.v;
      if (c0 && c1 < c0) hl.push(['More efficient', 'Each engagement costs <b>' + Math.round((1 - c1 / c0) * 100) + '% fewer credits</b> than in ' + monLab(M[0].d, true) + '.']);
    }
    const val = (b) => revTracked ? (b.ch === 'sms' ? b.n * FC.eng.sms * FC.revPerClick : 0) : b.n * FC.eng[b.ch];
    const big = sched.slice().sort((a, b) => val(b) - val(a))[0];
    if (big) hl.push(['Coming up', esc(big.name) + ' on ' + fmtS(big.date) + ' should bring <b>≈ ' + fmt(big.n * FC.eng[big.ch]) + ' ' + CH_UNIT[big.ch] + '</b>' +
      (big.ch === 'sms' && revTracked ? ' and <b>' + fv('revenue', big.n * FC.eng.sms * FC.revPerClick) + '</b>' : '') + '.']);
    if (M && revTracked) {
      const act = M[iL].revenue.v;
      hl.push(['Forecast accuracy', 'Our ' + ML[M[iL].d.getMonth()] + ' forecast was <b>' + Math.round(FC.accuracy * 100) + '% accurate</b>: ' + fv('revenue', rr(act * FC.accuracy)) + ' forecast, ' + fv('revenue', rr(act)) + ' actual.']);
    }
    const highlights = hl.length ? '<section class="hl" aria-label="Highlights">' + hl.map((x) => '<div class="hlc"><span>' + x[0] + '</span><p>' + x[1] + '</p></div>').join('') + '</section>' : '';

    // How you're growing
    let growth;
    if (!M) {
      growth = emptyBox('Growth trends need a full month of sending', 'Monthly revenue, engagement and message trends appear here after ' + ML[(TODAY.getMonth() + 1) % 12] + ' 1.');
    } else {
      const money0 = (v) => '$' + fmt(v);
      const cards = [
        revTracked ? { key: 'revenue', label: 'Revenue', f: money0, unit: '/ month' } : null,
        { key: 'engagements', label: 'Engagements', f: fmt, unit: '/ month' },
        { key: 'messages', label: 'Messages', f: fmt, unit: '/ month' },
        { key: 'cpe', label: 'Credits per engagement', f: (v) => v.toFixed(1), unit: '', down: true }
      ].filter(Boolean).map((c) => {
        const first = M[0][c.key].v, last = M[iL][c.key].v, end = M[M.length - 1][c.key];
        const mo = Math.pow(last / first, 1 / iL) - 1;
        const good = c.down ? last <= first : last >= first;
        const d = c.down
          ? '<span class="' + (good ? 'up' : 'down') + '">' + (last <= first ? '↓ ' : '↑ ') + Math.round(Math.abs(last / first - 1) * 100) + '%</span> since ' + monLab(M[0].d, true)
          : '<span class="' + (good ? 'up' : 'down') + '">' + (mo >= 0 ? '↑ ' : '↓ ') + (Math.abs(mo) * 100).toFixed(1) + '% a month</span> · ' + sgnPct(last / first - 1) + ' since ' + monLab(M[0].d, true);
        return '<div class="gcard"><div class="glab">' + c.label + '<span class="muted">' + ML[M[iL].d.getMonth()] + '</span></div>' +
          '<div class="gval">' + c.f(last) + (c.unit ? ' <span class="muted">' + c.unit + '</span>' : '') + '</div><div class="gd">' + d + '</div>' +
          trendLine(M, c.key, c.f, c.label + ' by month, ' + monLab(M[0].d, true) + ' to ' + monLab(M[M.length - 1].d, true) + ', with forecast') +
          '<div class="gfoot">' + monLab(M[M.length - 1].d) + ' forecast: <b>' + c.f(end.v) + '</b> <span class="muted">(likely ' + c.f(end.lo) + '–' + c.f(end.hi) + ')</span></div></div>';
      }).join('');
      growth = '<div class="growth">' + cards + '</div>';
    }

    // Plan fit: what covering the forecast costs on each Pro plan
    const ptip = (t) => '<span class="tip" tabindex="0" role="img" aria-label="' + esc(t) + '">' + IC.info + '<span class="tb">' + esc(t) + '</span></span>';
    const yr = S.pcyc === 'annual';
    const mult = yr ? 12 : 1, per = yr ? 'a year' : 'a month';
    const perMonth = credAll / h * 30;
    S.perMonth = perMonth;
    const need = perMonth * mult;
    const curT = proTier(FC.plan.credits);
    const now = planCost(curT, FC.plan.cycle, perMonth);
    const top = PRO[PRO.length - 1];
    const custom = perMonth > top.c;
    // Only ever suggest moving up: a bigger plan, or the same plan billed annually. Suggest it only if it costs less.
    const ups = upgrades(perMonth, S.pcyc === 'monthly' ? ['monthly', 'annual'] : ['annual']);
    const cand = ups.length ? cheapest(ups) : null;
    const pick = cand && cand.total < now.total - 1 ? cand : null;
    const cycleSw = '<div class="segc" role="group" aria-label="Billing cycle">' +
      [['monthly', 'Monthly'], ['annual', 'Annually']].map((c) => '<button type="button" data-act="pcyc" data-v="' + c[0] + '" aria-pressed="' + (S.pcyc === c[0]) + '">' + c[1] + '</button>').join('') + '</div>';
    const tiers = '<div class="tiers" role="list" aria-label="Pro plans, credits ' + per + '">' + PRO.map((t) => {
      const isCur = t === curT, isBest = !custom && pick && t === pick.t;
      return '<span role="listitem" class="tier' + (isCur ? ' cur' : '') + (isBest ? ' rec' : '') + (!isCur && !isBest && (t.c < curT.c || t.c < perMonth) ? ' below' : '') + '">' + kfmt(t.c * mult) +
        (isBest ? '<small>' + (pick.cyc !== S.pcyc ? 'Best annually' : 'Recommended') + '</small>' : isCur ? '<small>Current</small>' : '') + '</span>';
    }).join('') + '<span role="listitem" class="tier' + (custom ? ' rec' : '') + '">Custom' + (custom ? '<small>Best fit</small>' : '') + '</span></div>';
    let planBody;
    if (S.fnew) {
      planBody = '<p>We\'ll compare your plan with your sending after 14 days of history.</p>';
    } else {
      const cap = curT.c * mult;
      const inPlan = Math.min(need, cap);
      let msg = '<p>You\'re on pace to use <b>≈ ' + kfmt(need) + ' credits ' + per + '</b>';
      if (custom) msg += ', more than the largest Pro plan. A <b>Custom</b> plan fits high-volume sending.';
      else {
        msg += now.extra ? '. Your plan includes ' + kfmt(cap) + ', so you\'d buy <b>≈ ' + kfmt(now.extra * mult) + ' extra credits</b> for ≈ ' + usd(Math.round(now.extraCost * mult)) + ', <b>≈ ' + usd(Math.round(now.total * mult)) + ' ' + per + '</b> in total.' : ', and your plan covers it.';
        if (!pick) msg += ' None of the bigger plans would cost less for this forecast.';
        else if (pick) msg += ' <b>' + planName(pick.t, pick.cyc) + '</b> covers it for <b>≈ ' + usd(Math.round(pick.total * mult)) + ' ' + per + '</b>' +
          (pick.extra ? ' with extra credits' : '') + ', saving ≈ ' + usd(Math.round((now.total - pick.total) * mult)) + ' ' + per + '.';
      }
      msg += '</p>';
      planBody = '<div class="pbar" role="img" aria-label="Forecast ' + kfmt(need) + ' credits ' + per + ', plan includes ' + kfmt(cap) + '"><span style="width:' + (inPlan / Math.max(need, cap) * 100).toFixed(1) + '%"></span>' +
          (need > cap ? '<span class="over" style="width:' + ((need - cap) / need * 100).toFixed(1) + '%"></span>' : '') + '</div>' +
        '<div class="pleg"><span><i style="background:var(--blue1)"></i>Plan credits ' + kfmt(inPlan) +
          ptip('Credits included in your ' + planName(curT, FC.plan.cycle) + ' plan. They\'re already paid for with your subscription.') + '</span>' +
          (need > cap ? '<span><i style="background:var(--warn1)"></i>Credits to buy ' + kfmt(need - cap) +
            ptip('Credits your forecast needs on top of your plan, at ' + cents(curT.x) + ' each on your plan. Bigger plans include more credits and charge less for extra ones.') + '</span>' : '') + '</div>' +
        msg + tiers +
        '<div class="acts">' + (custom ? '<a class="btn-sb" href="#" data-dead>Talk to sales</a>'
          : (pick ? '<button type="button" class="btn-sb" data-act="paysel" data-c="' + pick.t.c + '" data-cyc="' + pick.cyc + '">Switch to ' + planName(pick.t, pick.cyc) + '</button>' : '') +
            '<button type="button" class="' + (pick ? 'plink' : 'btn-sb') + '" data-act="mopen">Compare plans</button>') + '</div>' +
        (!custom ? '<p class="muted pnote">Sending more than ' + kfmt(top.c * mult) + ' credits ' + per + '? <a href="#" data-dead>Custom plans</a> are built for high volume.</p>' : '');
    }
    const plan = '<section class="plan"><div class="phead"><div class="glab">Your plan<span class="muted">' + planName(curT, FC.plan.cycle) + ' · ' + usd(FC.plan.cycle === 'annual' ? curT.a : curT.m) + (FC.plan.cycle === 'annual' ? ' a year' : ' a month') + '</span></div>' +
      (S.fnew ? '' : cycleSw) + '</div>' + planBody + '</section>';

    // Forecast by source
    const shown = FSER.filter((s) => s.id !== 'usual' || (S.fbc === 'usual' && !S.fnew));
    const conf = (sp) => sp <= 0.1 ? ['hi', 'High'] : sp <= 0.25 ? ['md', 'Medium'] : ['lo', 'Low'];
    const srcRows = shown.map((s) => {
      const t = cur[s.id];
      const fl = FC.flows.find((x) => x.id === s.id);
      const waiting = S.fnew && fl;
      let basis;
      if (s.id === 'bc') basis = sched.length ? sched.length + ' scheduled · ' + fmt(sched.reduce((a, b) => a + b.n, 0)) + ' recipients' : 'Nothing scheduled in this period';
      else if (s.id === 'usual') basis = '~' + FC.usualPerWeek + ' a week, in weeks with nothing scheduled';
      else if (waiting) basis = 'Needs 14 days of sending · from ' + fmtS(readyOn);
      else basis = fl.basis + ' · ' + sgnPct(fl.trend * BASIS[S.fb].trend) + '/mo';
      const sp = fSpread(s.id);
      const c = conf(sp);
      const dash = '<span class="muted">—</span>';
      return '<tr class="hov"><td><span style="display:inline-flex;align-items:center;gap:8px;font-weight:500">' + swatch(s) + esc(s.label) + '</span></td>' +
        '<td class="muted">' + esc(basis) + '</td>' +
        '<td>' + (waiting ? dash : '<span class="pill ' + c[0] + ' hint" title="Likely within ±' + Math.round(sp * 100) + '%">' + c[1] + '</span>') + '</td>' +
        '<td>' + (waiting ? dash : revTracked ? '<b style="font-weight:500">' + fv('revenue', fMet(t, 'revenue')) + '</b>' : '<span class="muted">Not tracked</span>') + '</td>' +
        ['engagements', 'messages', 'credits'].map((m) => '<td' + (m === 'credits' ? ' class="muted"' : '') + '>' + (waiting ? dash : fmt(fMet(t, m))) + '</td>').join('') + '</tr>';
    }).join('') +
      '<tr class="tot"><td>Total</td><td></td><td></td><td>' + (revTracked ? fv('revenue', T.revenue.f.v) : '') + '</td>' +
      ['engagements', 'messages', 'credits'].map((m) => '<td>' + fmt(T[m].f.v) + '</td>').join('') + '</tr>';
    const srcHead = [
      { t: 'Source', w: '20%' }, { t: 'Based on' },
      { t: '<span class="hint" title="How close the result is likely to be. Known recipients are High; event-based sending varies more.">Confidence</span>' },
      { t: 'Revenue' }, { t: 'Engagements' }, { t: 'Messages' }, { t: 'Credits' }
    ];
    const srcTable = '<div class="tbl"><table style="min-width:960px"><thead><tr>' + srcHead.map((x) => '<th scope="col"' + (x.w ? ' style="width:' + x.w + '"' : '') + '>' + x.t + '</th>').join('') + '</tr></thead><tbody>' + srcRows + '</tbody></table></div>';

    // Scheduled broadcasts
    const bcTable = sched.length
      ? table([{ t: 'Broadcast', w: '26%' }, { t: 'Send date' }, { t: 'Channel' }, { t: 'Recipients' }, { t: 'Est. revenue' }, { t: 'Est. engagements' }, { t: 'Est. credits' }],
        sched.map((b) => [
          '<a class="chl" href="#" data-dead>' + esc(b.name) + '</a>',
          WDS[b.date.getDay()] + ', ' + fmtS(b.date),
          CH_LABEL[b.ch],
          fmt(b.n),
          b.ch === 'sms' ? '<b style="font-weight:500">' + fv('revenue', b.n * FC.eng.sms * FC.revPerClick) + '</b>' : '<span class="muted">Not tracked</span>',
          fmt(b.n * FC.eng[b.ch]) + ' <span class="muted">' + CH_UNIT[b.ch] + '</span>',
          '<span class="muted">' + fmt(b.n * FC.credit[b.ch]) + '</span>'
        ]), 820)
      : emptyBox('No broadcasts scheduled in the next ' + h + ' days', 'Broadcasts you schedule are added to the forecast automatically.');

    // Breakdown lists
    const chList = CHS.filter((c) => S.svc === 'all' || c === S.svc).map((c) => {
      const n = FSER.reduce((a, s) => a + cur[s.id][c] * FC.credit[c], 0);
      return { label: CH_LABEL[c], n, pct: credAll ? (n / credAll * 100).toFixed(1) + '%' : '0%' };
    });
    const engAll = FSER.reduce((a, s) => a + fMet(cur[s.id], 'engagements'), 0);
    const engList = CHS.filter((c) => S.svc === 'all' || c === S.svc).map((c) => {
      const n = FSER.reduce((a, s) => a + cur[s.id][c] * FC.eng[c], 0);
      return { label: CH_LABEL[c], n, pct: engAll ? (n / engAll * 100).toFixed(1) + '%' : '0%' };
    });
    const drivers = S.fnew
      ? '<section class="blist"><h3 class="h3">Campaigns &amp; triggers</h3>' + emptyBox('Not enough history yet', 'Campaign and trigger forecasts start on ' + fmtS(readyOn) + '.') + '</section>'
      : barList('Campaigns & triggers: expected engagements and monthly trend', FC.flows.filter((f) => f.items).flatMap((f) => f.items.map((it) => ({
        label: it[0], n: fMet(cur[f.id], 'engagements') * it[1], pct: sgnPct(f.trend * BASIS[S.fb].trend)
      }))).sort((a, b) => b.n - a.n), 170);

    const B = BASIS[S.fb];
    const how = '<section class="how"><button type="button" data-act="how" aria-expanded="' + S.how + '" aria-controls="how-body">How this forecast works' + IC.chev + '</button>' +
      (S.how ? '<dl id="how-body">' +
        '<dt>Scheduled broadcasts</dt><dd>Counted at their recipient count on the send date. Only delivery can vary.</dd>' +
        '<dt>Campaigns, triggers, other</dt><dd>Your daily average for the last ' + bas + ' days, extended with its trend (' + FC.flows.map((f) => ({ camp: 'campaigns', trig: 'triggers', other: 'other' })[f.id] + ' ' + sgnPct(f.trend * B.trend)).join(', ') + ' a month) and your usual weekday pattern. A shorter basis follows recent changes faster but is less steady.</dd>' +
        '<dt>Usual broadcasts</dt><dd>Optional. Adds your typical broadcast volume (~' + FC.usualPerWeek + ' messages a week) to weeks with nothing scheduled. Turn it on if you send broadcasts regularly but schedule them late.</dd>' +
        '<dt>Credits</dt><dd>Your current average per channel: SMS ' + FC.credit.sms + ' per message (includes MMS and long messages), Voice ' + FC.credit.voice + ' per call, Ringless ' + FC.credit.ringless + ' per drop.</dd>' +
        '<dt>Engagements</dt><dd>Your recent rates: SMS ' + (FC.eng.sms * 100).toFixed(1) + '% of sent clicked, Voice ' + (FC.eng.voice * 100).toFixed(1) + '% of calls transferred, Ringless ' + (FC.eng.ringless * 100).toFixed(1) + '% of drops called back.</dd>' +
        '<dt>Revenue</dt><dd>' + money(FC.revPerClick) + ' per SMS click, your average from conversion tracking. Voice and Ringless revenue isn\'t tracked.</dd>' +
        '<dt>Comparisons</dt><dd>Each "vs" figure compares the forecast with your average pace over the last ' + bas + ' days, scaled to the same number of days. A week with no broadcast scheduled can look lower than average.</dd>' +
        '<dt>Return on credits</dt><dd>Expected revenue (or engagements, when revenue isn\'t tracked) for every 100 credits used.</dd>' +
        '<dt>Growth trends</dt><dd>Calendar months. The current month is actual to date plus forecast for the rest. Future months include your usual broadcasts, so months with nothing scheduled yet don\'t look like a drop. Engagement rates have improved ~' + (FC.engTrend * 100).toFixed(1) + '% a month, and the forecast assumes that continues.</dd>' +
        '<dt>Likely range</dt><dd>Where the result should land about 8 times out of 10. It\'s narrow for scheduled broadcasts and wider for triggers, longer periods and a shorter basis.</dd>' +
        '</dl>' : '') + '</section>';

    return '<div style="display:flex;flex-direction:column;gap:20px"><h1>Analytics</h1>' + tabs('forecast') + '</div>' +
      '<div class="filters">' +
      dropdown('fh', { icon: 'cal', groups: [{ title: '', options: [{ id: '7', label: 'Next 7 days' }, { id: '30', label: 'Next 30 days' }, { id: '90', label: 'Next 90 days' }] }], value: S.fh, width: 180, onSet: (v) => { S.fh = v; } }) +
      dropdown('fb', { icon: 'trend', groups: [{ title: '', options: [{ id: '30', label: 'Based on last 30 days' }, { id: '90', label: 'Based on last 90 days' }, { id: '180', label: 'Based on last 180 days' }] }], value: S.fb, width: 230, onSet: (v) => { S.fb = v; } }) +
      dropdown('svc', { icon: 'filter', label: 'All services', groups: SERVICES, value: S.svc, onSet: (v) => { S.svc = v; } }) +
      dropdown('fbc', { icon: 'bcast', groups: [{ title: '', options: [{ id: 'sched', label: 'Scheduled broadcasts only' }, { id: 'usual', label: 'Scheduled + usual broadcasts' }] }], value: S.fbc, width: 260, onSet: (v) => { S.fbc = v; } }) +
      '</div>' +
      '<p class="fnote">' + IC.info + '<span>' + note + '</span></p>' +
      alert + stats(st) + highlights +
      '<section class="sec"><div class="sec-h"><h2 class="h3">How you’re growing</h2><p>By month, last 12 months and the next 3 · hover a point for its value</p></div>' + growth + '</section>' +
      '<section class="sec"><h2 class="h3">Expected value by source</h2>' + srcTable + '</section>' +
      '<section class="sec"><h2 class="h3">Scheduled broadcasts in this period</h2>' + bcTable + '</section>' +
      '<div class="two">' + drivers + barList('Engagements by channel', engList, 100) + '</div>' +
      '<section class="sec divsec"><div class="sec-h"><h2 class="h3">Credits &amp; plan</h2><p>What this sending will cost</p></div>' +
      stats([
        { label: 'Credits', value: '≈ ' + fmt(T.credits.f.v), sub: [range('credits'), delta('credits', false)], tip: 'Credits all forecast sending will use in this period, at your current rates per channel.' },
        { label: 'Credit balance', value: fmt(FC.balance), sub: balSub, tip: 'Runout date assumes all channels keep sending at the forecast pace.' }
      ]) + fChart(h) +
      '<div class="two">' + plan + barList('Credits by channel', chList, 100) + '</div></section>' + how;
  }

  /* ---------- plan modals ---------- */
  const XBTN = '<button type="button" class="xbtn" data-act="mclose" aria-label="Close"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button>';
  const cycSw = (act, val) => '<div class="segc" role="group" aria-label="Billing cycle">' +
    [['monthly', 'Monthly'], ['annual', 'Annually']].map((c) => '<button type="button" data-act="' + act + '" data-v="' + c[0] + '" aria-pressed="' + (val === c[0]) + '">' + c[1] + '</button>').join('') + '</div>';

  function compareModal() {
    const cyc = S.mcyc, yr = cyc === 'annual';
    const pm = S.perMonth;
    const cur = proTier(FC.plan.credits);
    const now = planCost(cur, FC.plan.cycle, pm);
    const ups = upgrades(pm, [cyc]);
    const opts = (cyc === FC.plan.cycle ? [now] : []).concat(ups);
    const cand = ups.length ? cheapest(ups) : null;
    const best = pm > PRO[PRO.length - 1].c || !cand || cand.total >= now.total - 1 ? null : cand;
    const rows = opts.map((o) => {
      const t = o.t, isCur = t === cur && cyc === FC.plan.cycle, isBest = best && o === best;
      return '<tr class="hov' + (isBest ? ' bestrow' : '') + '">' +
        '<td><span style="font-weight:500">' + kfmt(t.c * (yr ? 12 : 1)) + '</span>' +
          (isCur ? ' <span class="pill gr">Current</span>' : '') + (isBest ? ' <span class="pill hi">Best value</span>' : '') + '</td>' +
        '<td>' + (yr ? usd(t.a) + ' <span class="muted">/ yr</span>' : usd(t.m) + ' <span class="muted">/ mo</span>') + '</td>' +
        '<td>' + cents((yr ? t.a : t.m) / (t.c * (yr ? 12 : 1))) + '</td>' +
        '<td>' + cents(t.x) + '</td>' +
        '<td>' + (o.extra ? kfmt(o.extra) + ' <span class="muted">· ' + usd(Math.round(o.extraCost)) + '</span>' : '<span class="muted">—</span>') + '</td>' +
        '<td><b style="font-weight:600">≈ ' + usd(Math.round(o.total)) + '</b>' + (isCur || o.total >= now.total - 1 ? '' : ' <span class="save">Save ' + usd(Math.round(now.total - o.total)) + '</span>') + '</td>' +
        '<td style="text-align:right">' + (isCur ? '<span class="muted">Your plan</span>' : '<button type="button" class="btn-sb" style="margin:0" data-act="paysel" data-c="' + t.c + '" data-cyc="' + cyc + '">Select</button>') + '</td></tr>';
    }).join('');
    const head = [yr ? 'Credits a year' : 'Credits a month', 'Price', '<span class="hint" title="Plan price ÷ credits included">Per plan credit</span>', '<span class="hint" title="What each credit beyond the plan costs">Per extra credit</span>',
      '<span class="hint" title="Credits your forecast needs on top of the plan, a month, and what they cost">Credits to buy / mo</span>', '<span class="hint" title="Plan price (annual ÷ 12) + credits to buy">Est. cost / month</span>', '<span class="sr">Action</span>'];
    return '<div class="ovl" data-act="mclose"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-t" tabindex="-1" data-act="noop">' +
      '<div class="dtop"><h2 id="dlg-t">Compare plans</h2>' + XBTN + '</div>' +
      '<p class="dsub">What your forecast of <b>≈ ' + kfmt(pm) + ' credits a month</b> would cost on each Pro plan. Today you pay <b>≈ ' + usd(Math.round(now.total)) + ' a month</b> on ' + planName(cur, FC.plan.cycle) +
        (now.extra ? ', including extra credits' : '') + '. Bigger plans charge less per credit, both included and extra.</p>' +
      cycSw('mcyc', cyc) +
      '<div class="tbl"><table style="min-width:720px"><thead><tr>' + head.map((x) => '<th scope="col">' + x + '</th>').join('') + '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<p class="muted pnote" style="margin:0">Need more than ' + kfmt(PRO[PRO.length - 1].c) + ' credits a month? <a href="#" data-dead>Talk to sales</a> about a Custom plan. Prices exclude taxes.</p></div></div>';
  }

  function payModal() {
    const t = proTier(S.pay.c), cyc = S.pay.cyc, yr = cyc === 'annual';
    const name = planName(t, cyc);
    const save = t.m * 12 - t.a;
    const opt = (v, label, extra, price) => '<label class="ropt" data-act="paycyc" data-v="' + v + '"><input type="radio" name="bill"' + (cyc === v ? ' checked' : '') + '><span>' + label + '</span>' + extra + '<b>' + price + '</b><span class="muted">/ month</span></label>';
    return '<div class="ovl" data-act="mclose"><div class="dlg pay" role="dialog" aria-modal="true" aria-labelledby="dlg-t" tabindex="-1" data-act="noop">' +
      '<div class="dtop"><h2 id="dlg-t">Upgrade plan</h2><div class="steps"><button type="button" class="n" data-act="mback" aria-label="Step 1: choose a plan">1</button><span class="n" aria-current="step">2</span>Payment</div>' + XBTN + '</div>' +
      '<div class="paygrid"><div>' +
        '<span class="flab">Billing</span>' +
        opt('monthly', 'Monthly', '', usd(t.m)) +
        opt('annual', 'Annually', '<span class="save">Save ' + usd(save) + '</span>', usd(t.a / 12)) +
        '<span class="flab" style="margin-top:24px">Card</span>' +
        '<div class="cardsel"><span class="visa">VISA</span><span style="flex:1">Visa ... 1111</span><span class="pill gr">Primary</span><span class="muted">Exp 11/55</span>' + IC.chev + '</div>' +
      '</div><aside class="dpanel" aria-label="Details"><b class="dt">Details</b>' +
        '<div class="r"><span>Plan</span><b>' + name + '</b></div>' +
        '<div class="r"><span>Credits</span><b>' + fmt(t.c * (yr ? 12 : 1)) + '</b></div>' +
        '<div class="r"><span>Additional credit</span><b>' + cents(t.x) + '</b></div><hr>' +
        '<div class="r tot"><span>Total</span><b>' + usd(yr ? t.a : t.m) + '</b></div><small class="muted">+ applicable taxes' + (yr ? '' : ' · billed monthly') + '</small>' +
      '</aside></div>' +
      '<div class="dact"><button type="button" class="btn primary" data-act="payok">Upgrade to ' + name + '</button><button type="button" class="btn secondary" data-act="mback">Back</button></div>' +
      '</div></div>';
  }

  /* ---------- render ---------- */
  const root = document.getElementById('root');
  function render() {
    DD = {};
    const body = { messages: pageMessages, credits: pageCredits, forecast: pageForecast, sms: pageSMS, voice: pageVoice, ringless: pageRingless }[S.page]();
    const titles = { messages: 'Analytics — Messages', credits: 'Analytics — Credit Usage', forecast: 'Analytics — Forecast', sms: 'Analytics — SMS', voice: 'Analytics — Voice', ringless: 'Analytics — Ringless' };
    document.title = titles[S.page] + ' · Call Loop prototype';
    const proto = S.page === 'forecast'
      ? '<span>Account history:</span>' +
        '<button type="button" data-act="fnew" data-v="0" aria-pressed="' + !S.fnew + '">90+ days</button>' +
        '<button type="button" data-act="fnew" data-v="1" aria-pressed="' + S.fnew + '">New account (' + FC.newDays + ' days)</button>'
      : '<span>Prototype data:</span>' +
        '<button type="button" data-act="variant" data-v="0" aria-pressed="' + !S.empty + '">With interactions</button>' +
        '<button type="button" data-act="variant" data-v="1" aria-pressed="' + S.empty + '">No interactions yet</button>';
    root.innerHTML = '<div class="app">' + sidebar() + '<main class="main"><div class="wrap">' + body + '</div></main></div>' +
      // Credit Usage has no interaction data, so the switch would do nothing there
      (S.page === 'credits' ? '' : '<div class="proto" role="group" aria-label="Prototype data">' + proto + '</div>') +
      (S.page === 'forecast' && S.modal === 'compare' ? compareModal() : '') +
      (S.page === 'forecast' && S.modal === 'pay' ? payModal() : '') +
      (S.toast ? '<div class="toast" role="status">' + esc(S.toast) + '</div>' : '');
    document.body.style.overflow = S.modal ? 'hidden' : '';
    const dlg = document.querySelector('.dlg');
    if (dlg) dlg.focus({ preventScroll: true });
    if (S.open && document.getElementById('q-' + S.open)) {
      const el = document.getElementById('q-' + S.open);
      el.focus();
      el.setSelectionRange(el.value.length, el.value.length);
    }
  }

  function closePop() {
    if (S.open === 'date') S.draft = null;
    S.open = null;
    S.q = '';
  }

  document.addEventListener('click', (e) => {
    const dead = e.target.closest('[data-dead]');
    if (dead) { e.preventDefault(); return; }
    const link = e.target.closest('a[href^="#"]');
    if (link) {
      const pg = link.getAttribute('href').slice(1);
      if (PAGES.includes(pg)) {
        e.preventDefault();
        go(pg);
        try { history.pushState(null, '', '#' + pg); } catch (err) { /* file previews may block history */ }
        return;
      }
    }
    const t = e.target.closest('[data-act]');
    if (!t) {
      if (S.open && !e.target.closest('.pop')) { closePop(); render(); }
      return;
    }
    const act = t.dataset.act;
    const id = t.dataset.id;
    if (act === 'toggle') {
      const wasOpen = S.open === id;
      closePop();
      if (!wasOpen) {
        S.open = id;
        if (id === 'date') { S.view = { y: S.range.start.getFullYear(), m: S.range.start.getMonth() }; }
      }
    } else if (act === 'pick') {
      const d = DD[id];
      const v = t.dataset.val;
      if (d.multi) {
        d.onSet(d.val.includes(v) ? d.val.filter((x) => x !== v) : d.val.concat(v));
      } else {
        d.onSet(v);
        closePop();
      }
    } else if (act === 'preset') {
      const p = presetList()[+t.dataset.i];
      S.range = { start: p[1], end: new Date(TODAY) };
      S.preset = p[0];
      closePop();
    } else if (act === 'calnav') {
      const d = new Date(S.view.y, S.view.m + (+t.dataset.d), 1);
      S.view = { y: d.getFullYear(), m: d.getMonth() };
    } else if (act === 'day') {
      const [y, m, dd] = t.dataset.k.split('-').map(Number);
      const day = new Date(y, m, dd);
      if (!S.draft) {
        S.draft = { start: day, end: null };
      } else {
        let a = S.draft.start, b = day;
        if (b < a) { const tmp = a; a = b; b = tmp; }
        S.range = { start: a, end: b };
        S.draft = null;
        S.preset = null;
      }
    } else if (act === 'variant') {
      S.empty = t.dataset.v === '1';
    } else if (act === 'fnew') {
      S.fnew = t.dataset.v === '1';
    } else if (act === 'pcyc') {
      S.pcyc = t.dataset.v;
    } else if (act === 'noop') {
      return;
    } else if (act === 'mopen') {
      S.modal = 'compare';
      S.mcyc = S.pcyc;
    } else if (act === 'mclose') {
      if (t.classList.contains('ovl') && e.target !== t) return; // clicks inside the dialog bubble to the overlay
      S.modal = null;
    } else if (act === 'mcyc') {
      S.mcyc = t.dataset.v;
    } else if (act === 'paysel') {
      S.pay = { c: +t.dataset.c, cyc: t.dataset.cyc };
      S.modal = 'pay';
    } else if (act === 'paycyc') {
      if (S.pay.cyc === t.dataset.v) return;
      S.pay.cyc = t.dataset.v;
    } else if (act === 'mback') {
      S.modal = 'compare';
      S.mcyc = S.pay.cyc;
    } else if (act === 'payok') {
      const tier = proTier(S.pay.c);
      FC.plan = { line: 'Pro', cycle: S.pay.cyc, credits: tier.c };
      S.pcyc = S.pay.cyc;
      S.toast = 'You\'re now on ' + planName(tier, S.pay.cyc) + '.';
      S.modal = null;
      setTimeout(() => { S.toast = ''; render(); }, 3500);
    } else if (act === 'how') {
      S.how = !S.how;
    }
    render();
  });

  document.addEventListener('input', (e) => {
    if (e.target.dataset && e.target.dataset.input === 'search') {
      S.q = e.target.value;
      render();
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && S.modal && !S.open) {
      S.modal = null;
      render();
      return;
    }
    if (e.key === 'Escape' && S.open) {
      const id = S.open;
      closePop();
      render();
      const btn = document.querySelector('.ddbtn[data-id="' + id + '"]');
      if (btn) btn.focus();
    }
  });

  function go(next) {
    if (next !== S.page) { S.page = next; closePop(); window.scrollTo(0, 0); }
    render();
  }
  function fromHash() {
    const h = location.hash.replace('#', '');
    go(PAGES.includes(h) ? h : 'messages');
  }
  window.addEventListener('hashchange', fromHash);
  window.addEventListener('popstate', fromHash);
  fromHash();
})();
</script>
</body>
</html>
