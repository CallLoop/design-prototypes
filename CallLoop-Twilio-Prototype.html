<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call Loop — Twilio integration prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Call Loop design system — synced from Figma "00 Design System" (BOVX8Hmx1HfwwBeDwOcZQL), 2026-10-19. Source of truth: design-system/tokens.css */
  /* Primary */
  --blue1:#1364F9;--blue2:#1854EA;--blue3:#1885EA;--blue4:#1362AC;--blue5:#E7EFFE;--blue6:#D0E0FE;
  --blue1-dis:rgba(19,100,249,.4);--blue3-dis:rgba(24,133,234,.4);
  --black:#14161A;--white:#FFFFFF;--g1:#757D8A;--g2:#B7BFC8;--g3:#E0E6EE;--g4:#F3F5F8;
  --g2-dis:rgba(183,191,200,.45);--g2-light:rgba(183,191,200,.3);
  --text:#2C2D2E; /* not a Figma style — kept for existing prototype usage */
  /* Secondary */
  --purple1:#7A16F5;--purple2:#C6AFE2;--purple3:#F0E4FF;--aqua1:#A4C5DB;--aqua2:#E4F4FF;
  --orange1:#F86919;--orange2:#D6BAAA;--orange3:#FFEEE4;
  /* States */
  --ok:#05944F;--ok2:#026233;--ok3:#E7F6ED;--notify1:#2E9AE4;--notify2:#E6F7FF;
  --warn1:#FFC043;--warn2:#BA7D04;--warn3:#855A04;--warn4:#FFF8E9;--err:#E11900;--err2:#A11200;--err3:#FFF1F0;
  /* Gradients */
  --grad1:linear-gradient(180deg,#F3F5F8 0%,#EEF5FF 100%);--grad2:linear-gradient(270deg,#F3F5F8 60%,rgba(243,245,248,.8) 100%);--grad3:#E7EFFE;
  /* Effects */
  --shadow1:0 0 2px rgba(83,102,137,.2),0 12px 16px rgba(83,102,137,.08),0 10px 40px rgba(83,102,137,.08);
  --shadow2:0 4px 8px -2px rgba(27,46,94,.04);
  --shadow3:0 0 2px rgba(83,102,137,.2),0 10px 20px rgba(83,102,137,.05),0 30px 50px rgba(83,102,137,.1);
  /* Shape */
  --r-xs:4px;--r:8px;
  --dlg-w:494px; /* Buy number dialog width; height follows each tab's content */
  --font:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--black);background:#fff;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--blue1)}a:hover{color:var(--blue2)}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--blue1);outline-offset:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{display:flex;flex-wrap:wrap;min-height:100vh}

/* Sidebar */
.side{width:240px;flex:none;height:100vh;position:sticky;top:0;overflow:auto;padding:16px 12px;box-shadow:inset -1px 0 0 var(--g3);display:flex;flex-direction:column;justify-content:space-between;gap:24px;background:#fff}
.shead{height:44px;padding:0 8px 0 12px;border-radius:12px;background:var(--g4);display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600}
.sclose{width:28px;height:28px;padding:0;border:0;border-radius:8px;background:var(--blue1);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.divider{height:1px;background:var(--g3);margin:8px 4px}
.nav{height:36px;padding:0 12px;display:flex;align-items:center;gap:12px;border-radius:8px;color:var(--black);text-decoration:none;font-size:14px;line-height:16px}
.nav:hover{background:var(--g4);color:var(--black)}
.nav svg{stroke:var(--text);flex:none}
.nav.on{background:var(--aqua2);font-weight:500}.nav.on svg{stroke:var(--blue1)}
.plan{margin-top:12px;padding:12px;border-radius:12px;background:var(--g4);display:flex;flex-direction:column;gap:10px}
.plan .row{display:flex;justify-content:space-between;align-items:center;font-size:11px;line-height:14px}
.plan a{text-decoration:none;font-weight:600}
.prog{height:6px;border-radius:3px;background:#fff;box-shadow:inset 0 0 0 1px var(--g3);overflow:hidden}.prog i{display:block;height:100%;width:79%;background:var(--blue3);border-radius:3px}

/* Main */
.main{flex:999 1 560px;min-width:0;padding:40px 48px 96px}
.wrap{max-width:1120px;display:flex;flex-direction:column;gap:32px}
h1{margin:0;font-size:40px;line-height:48px;letter-spacing:-.8px;font-weight:600}
.muted{color:var(--g1)}
.btn{height:40px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:8px;font-size:14px;line-height:16px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--blue1);color:#fff}.btn.primary:hover{background:var(--blue2)}
.btn.primary:disabled{background:var(--blue1-dis);cursor:not-allowed}
.btn.secondary{background:var(--g2-light);color:var(--black)}.btn.secondary:hover{background:var(--g3)}
.btn.blue{background:var(--blue5);color:var(--blue1)}.btn.blue:hover{background:var(--blue6)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.search{position:relative}
.search svg{position:absolute;left:12px;top:12px}
.search input{width:240px;height:40px;padding:8px 12px 8px 36px;border:0;border-radius:8px;box-shadow:inset 0 0 0 1px var(--g3);font-size:14px;outline:none}
input:focus,select:focus{box-shadow:inset 0 0 0 1px var(--blue1),0 0 0 3px var(--blue6)!important;outline:none}

/* Integration cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{position:relative;min-height:224px;padding:12px 16px 16px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1px var(--g3);display:flex;flex-direction:column;align-items:center;gap:12px}
.card:hover{box-shadow:inset 0 0 0 1px var(--g2)}
.ctop{align-self:stretch;height:28px;display:flex;justify-content:space-between;align-items:center}
.native{padding:2px 8px;border-radius:6px;background:var(--purple3);color:var(--purple1);font-size:12px;line-height:16px}
.more{width:28px;height:28px;padding:0;border:0;border-radius:8px;background:var(--g4);color:var(--g1);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.more:hover{background:var(--g3);color:var(--black)}
.logo{width:72px;height:72px;border-radius:22px;box-shadow:inset 0 0 0 1px var(--g3);display:flex;align-items:center;justify-content:center;font-size:20px;line-height:24px;font-weight:600;letter-spacing:-.4px}
.cname{font-size:15px;line-height:20px;text-align:center}
.cact{margin-top:auto;align-self:stretch;display:flex;gap:8px}
.cact .btn{height:36px}
.cact .grow{flex:1}
.pill{flex:1;min-width:0;height:36px;padding:0 10px;border:0;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;line-height:16px}
.pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.ok{background:var(--ok3);color:var(--ok2)}
.explore{flex:1;height:36px;padding:0 12px;border:0;border-radius:8px;background:var(--blue5);color:var(--blue1);display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600;cursor:pointer}
.explore:hover{background:var(--blue6)}
.menu{position:absolute;top:44px;right:12px;z-index:31;width:212px;padding:8px;background:#fff;border-radius:8px;box-shadow:var(--shadow1);display:flex;flex-direction:column;gap:2px}
.mi{height:32px;padding:0 8px;border:0;border-radius:6px;background:transparent;font-size:14px;text-align:left;cursor:pointer}
.mi:hover{background:var(--g4)}

/* Numbers table */
.tbl{overflow-x:auto;padding-bottom:4px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;line-height:16px}
.nt{min-width:820px}
th{height:40px;padding:0 8px;background:var(--g4);color:var(--g1);font-weight:400;font-size:12px;text-align:left;white-space:nowrap}
.nt th:first-child{padding-left:16px;border-radius:8px 0 0 8px}
.nt th:last-child{padding-right:16px;border-radius:0 8px 8px 0;text-align:right}
td{height:56px;padding:0 8px;border-bottom:1px solid var(--g3);white-space:nowrap}
.nt td:first-child{padding-left:16px;font-weight:500}
.nt td:last-child{padding-right:16px;text-align:right}
.nt tbody tr:hover td{background:var(--g4)}
.nt tr.fresh td{background:var(--blue5)}
.ibtn{width:32px;height:32px;padding:0;border:0;border-radius:8px;background:var(--g4);color:var(--g1);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;vertical-align:middle}
.ibtn:hover{background:var(--g3);color:var(--black)}
.ibtn.danger:hover{background:var(--err3);color:var(--err)}
.rowact{display:inline-flex;gap:8px;justify-content:flex-end}
.st{display:inline-flex;align-items:center;gap:6px}
.st.ok{color:var(--ok)}.st.warn{color:var(--warn2)}
.st i{width:14px;height:14px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:10px;font-weight:700}
.st.ok i{background:var(--ok)}.st.warn i{background:var(--warn2)}
.st.rev{color:var(--notify1)}.st.rev i{background:var(--notify1)}
/* "(external)" after the type: the only Twilio-specific mark on the Numbers page */
.ext{position:relative;color:var(--g1);cursor:help;outline:none}
.ext .tip{display:none;position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);z-index:3;padding:6px 8px;border-radius:8px;background:rgba(20,22,26,.9);color:#fff;font-size:12px;line-height:16px;white-space:nowrap}
.ext:hover .tip,.ext:focus .tip{display:block}
.ext:focus-visible{outline:2px solid var(--blue1);outline-offset:2px;border-radius:4px}
.colset{width:24px;height:24px;padding:0;border:0;border-radius:6px;background:transparent;color:var(--g1);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;vertical-align:middle}
.colset:hover{color:var(--black)}
td.dim{color:var(--g2)}
.empty{padding:32px 24px;border-radius:12px;border:1px dashed var(--g2);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.empty b{font-size:15px;line-height:20px}
.empty span{max-width:420px;font-size:14px;line-height:20px;color:var(--g1)}
.tabs{display:flex;gap:8px;box-shadow:inset 0 -1px 0 var(--g3);overflow-x:auto}
.tab{padding:0 8px 10px;border:0;background:transparent;font-size:14px;line-height:16px;color:var(--g1);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab:hover{color:var(--blue3)}
.tab[aria-selected="true"]{color:var(--blue1);font-weight:500;box-shadow:inset 0 -2px 0 var(--blue1)}
.tab .n{padding:0 6px;border-radius:6px;background:var(--g4);color:var(--g1);font-size:12px;line-height:16px;font-weight:400}

/* Source identity — the one visual language for "where does this number live"
   Call Loop = brand-blue mark; Twilio = Twilio mark. Used on the source picker, the destination strip,
   the payment header, the Numbers table and toasts. */
.srcchip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px 0 4px;border-radius:6px;font-size:12px;line-height:16px;font-weight:500;white-space:nowrap}
.srcchip.cl{background:var(--blue5);color:var(--blue1)}
.srcchip.tw{background:var(--g4);color:var(--black);box-shadow:inset 0 0 0 1px var(--g3)}
.srcchip .acct{font-weight:400;color:var(--g1)}
.mark{flex:none;display:inline-flex;align-items:center;justify-content:center}

/* Modals */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(20,22,26,.2);display:flex;justify-content:center;align-items:flex-start;padding:100px 16px 16px;overflow-y:auto}
.overlay.tall{padding:24px 16px}
.dialog{width:528px;max-width:100%;padding:24px;background:#fff;border-radius:20px;box-shadow:var(--shadow1);display:flex;flex-direction:column;gap:20px}
.dhead{display:flex;align-items:center;gap:12px}
.dhead h2{flex:1;margin:0;font-size:20px;line-height:24px;letter-spacing:-.4px;font-weight:600}
.mlogo{width:32px;height:32px;flex:none;border-radius:8px;box-shadow:inset 0 0 0 1px var(--g3);display:inline-flex;align-items:center;justify-content:center}
.x{width:24px;height:24px;padding:0;border:0;background:transparent;color:var(--g1);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.x:hover{color:var(--black)}
.alert{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;border-radius:12px;background:var(--notify2);font-size:14px;line-height:20px}
.alert i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--blue3);display:inline-flex;align-items:center;justify-content:center}
.alert .tx{padding-top:2px}
.alert b{display:block;font-weight:500;color:var(--blue4)}
.alert p{margin:2px 0 0;color:var(--black)}
.alert a{font-weight:600;text-decoration:none;white-space:nowrap}.alert a:hover{text-decoration:underline}
.fields{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:8px}
.field label,.field .lbl{font-size:12px;line-height:16px;color:var(--g1)}
.field input{height:40px;padding:8px 12px;border:0;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 1px var(--g3);font-size:14px;outline:none}
.dact{display:flex;gap:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;padding:10px 14px;border-radius:10px;background:rgba(20,22,26,.92);color:#fff;display:flex;align-items:center;gap:8px;font-size:14px;line-height:20px;white-space:nowrap;box-shadow:var(--shadow1)}
.toggles{display:flex;flex-direction:column;gap:16px}
.tog{padding:12px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--g3);display:flex;gap:16px;justify-content:space-between;align-items:flex-start}
.tog b{display:block;font-size:14px;line-height:20px;font-weight:600;margin-bottom:4px}
.tog span{font-size:12px;line-height:16px;color:var(--g1)}
.box{padding:16px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--g3);display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:20px}
.box b{font-weight:600}
.box ul{margin:0;padding:0 0 0 20px;display:flex;flex-direction:column;gap:8px}
.box li::marker{color:var(--blue1)}
.ack{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:20px;cursor:pointer}
.ack input{width:18px;height:18px;margin:1px 0 0;flex:none;accent-color:var(--blue1);cursor:pointer}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none;position:relative}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .tr{width:32px;height:18px;border-radius:9px;background:var(--g3);position:relative;flex:none;transition:background .15s}
.sw .tr::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(20,22,26,.2);transition:left .15s}
.sw input:checked + .tr{background:var(--blue1)}.sw input:checked + .tr::after{left:16px}
.sw input:focus-visible + .tr{outline:2px solid var(--blue1);outline-offset:1px}
.sw .cnt{color:var(--g1)}

/* Buy number dialog (shared with 03 · Buy number) */
.dialog.buy{width:var(--dlg-w);max-height:calc(100vh - 48px);padding:24px 26px 26px}
.dialog.buy>*{flex:none}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.top .kick{display:flex;align-items:center;gap:6px;margin-bottom:16px;font-size:13px;line-height:16px;color:var(--g1)}
.top h2{margin:0;font-size:20px;line-height:24px;letter-spacing:-.4px;font-weight:600}
.step{display:flex;flex-direction:column;gap:8px;margin-top:-12px}
.step span{align-self:flex-end;font-size:12px;line-height:16px;color:var(--g1)}
.bar{height:4px;border-radius:2px;background:var(--g3);overflow:hidden}.bar i{display:block;height:100%;background:var(--blue3);border-radius:2px;transition:width .25s}
.dialog.buy>.body{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:20px;margin:-4px -8px;padding:4px 8px}
.body>*{flex:none}
.body::-webkit-scrollbar{width:8px}.body::-webkit-scrollbar-thumb{background:var(--g3);border-radius:4px}

/* Source picker: two stacked radio cards (one per row, so the billing line reads in full), selection = DS blue, identity = mark + name */
.srcs{display:grid;grid-template-columns:1fr;gap:8px;margin:0;padding:0;border:0;min-width:0}
.src{position:relative;padding:8px 12px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--g3);display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.src:hover{box-shadow:inset 0 0 0 1px var(--g2)}
.src input{position:absolute;opacity:0;width:1px;height:1px}
.src.on{box-shadow:inset 0 0 0 2px var(--blue1);background:var(--blue5)}
.src:has(input:focus-visible){outline:2px solid var(--blue1);outline-offset:2px}
.src .sm{width:32px;height:32px;flex:none;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1px var(--g3);display:inline-flex;align-items:center;justify-content:center}
.src .tx>b{display:block;font-size:14px;line-height:20px;font-weight:600}
.src small b{font-weight:500;color:var(--black)}
.src small{display:block;font-size:12px;line-height:16px;color:var(--g1)}
.src .rd{margin-left:auto;flex:none;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px var(--g2)}
.src.on .rd{box-shadow:inset 0 0 0 5px var(--blue1)}
.src .tx{min-width:0}

/* Destination strip: sits right above the primary button and says where the number will live and who bills it */
.dest{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--g4);font-size:13px;line-height:18px}
.dest .mark{width:28px;height:28px;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 1px var(--g3)}
.dest b{font-weight:600}
.dest .tx{flex:1;min-width:0}
.dest .tx span{display:block;color:var(--g1);font-size:12px;line-height:16px}

/* Number finder (stacked inputs in one box) */
.sel{position:relative}
.sel select{width:100%;height:40px;padding:0 40px 0 44px;border:0;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 1px var(--g3);font-size:14px;line-height:16px;appearance:none;-webkit-appearance:none;cursor:pointer;outline:none}
.sel select:hover{box-shadow:inset 0 0 0 1px var(--g2)}
.sel .lead{position:absolute;left:12px;top:50%;transform:translateY(-50%);display:flex;pointer-events:none}
.sel .chev{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--g1);display:flex;pointer-events:none}
.sel .badge{position:absolute;right:40px;top:50%;transform:translateY(-50%);padding:2px 8px;border-radius:6px;background:var(--g3);font-size:12px;line-height:16px;pointer-events:none}
.sel.paycard select{padding-right:116px}
.finder{border-radius:8px;box-shadow:inset 0 0 0 1px var(--g3);background:#fff}
.finder:focus-within{box-shadow:inset 0 0 0 1px var(--blue1),0 0 0 3px var(--blue6)}
.finder .row{display:flex;align-items:center;gap:8px;height:40px;padding:0 8px 0 12px}
.finder .row + .row{box-shadow:inset 0 1px 0 var(--g3)}
.finder svg{flex:none;color:var(--g1)}
.finder input{flex:1;min-width:0;height:100%;border:0;outline:none;background:transparent;font-size:14px;line-height:16px;box-shadow:none!important}
.finder input::placeholder{color:var(--g2)}
.seg{flex:none;display:flex;gap:2px}
.seg button{padding:4px 6px;border:0;border-radius:6px;background:transparent;font-size:14px;line-height:16px;cursor:pointer}
.seg button:hover{color:var(--blue3)}
.seg button[aria-pressed="true"]{color:var(--blue1);font-weight:500}
.nums{display:grid;grid-template-columns:1fr;gap:18px;margin:4px 0 0;padding:0 10px;border:0;min-width:0}
.nums.tf{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:17px;padding:0}
.num{display:flex;align-items:center;gap:8px;font-size:14px;line-height:16px;white-space:nowrap;cursor:pointer;min-width:0}
.num small{margin-left:auto;padding-left:12px;font-size:12px;color:var(--g1);overflow:hidden;text-overflow:ellipsis}
.num input[type="radio"]{flex:none;width:16px;height:16px;margin:0;accent-color:var(--blue1);cursor:pointer}
.none{margin:24px 0;text-align:center;font-size:14px;color:var(--g1)}

/* "In your Twilio account" tab */
.tools{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.tools .search{flex:1;min-width:160px}
.tools .search input{width:100%}
.scroll{overflow:auto;border-radius:8px;max-height:300px}
.xt{min-width:400px}
.xt th{position:sticky;top:0;z-index:2}
.xt th:first-child{width:48px;padding-left:16px;border-radius:8px 0 0 8px}
.xt th:last-child{padding-right:16px;border-radius:0 8px 8px 0}
.xt td{height:44px}
.xt td:first-child{padding-left:16px}
.xt td:last-child{padding-right:16px;color:var(--g1)}
.xt tbody tr:not(.added):hover td{background:var(--g4)}
.xt tr.added td{color:var(--g2)}
.xt input[type="checkbox"]{width:18px;height:18px;margin:0;accent-color:var(--blue1);cursor:pointer;vertical-align:middle}
.atag{margin-left:8px;padding:2px 8px;border-radius:6px;background:var(--g4);color:var(--g1);font-size:12px;line-height:16px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;line-height:16px;color:var(--g1)}
.foot b{color:var(--black);font-weight:500}

/* Payment */
.disc{align-self:flex-start;padding:0;border:0;background:transparent;display:inline-flex;align-items:center;gap:6px;font-size:14px;line-height:16px;font-weight:500;color:var(--blue1);cursor:pointer}
.disc svg{transition:transform .2s}
.disc[aria-expanded="false"] svg{transform:rotate(180deg)}
.pt th:first-child{padding-left:16px;border-radius:8px 0 0 8px}
.pt th:last-child{border-radius:0 8px 8px 0;text-align:right;padding-right:16px}
.pt td{height:40px}
.pt td:first-child{padding-left:16px}
.pt td:last-child{text-align:right;padding-right:16px}
.pt .ty{margin-left:8px;font-size:12px;color:var(--g1)}
#sel-list{max-height:240px;overflow:auto;border-radius:8px}
.billgrp{display:flex;flex-direction:column;gap:12px}
.billh{display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px;font-weight:500;color:var(--g1);text-transform:uppercase;letter-spacing:.4px}
.total{padding:16px;border-radius:12px;background:var(--g4);display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:16px}
.total .ln{display:flex;justify-content:space-between;align-items:center;gap:12px}
.total .ln small{margin-left:8px;font-size:12px;color:var(--g1)}
.total hr{width:100%;margin:0;border:0;height:1px;background:var(--g3)}
.total .grand{font-weight:600}
.total.out{background:#fff;box-shadow:inset 0 0 0 1px var(--g3)}
.total .note{font-size:12px;line-height:16px;color:var(--g1)}

/* Prototype control */
.proto{position:fixed;right:16px;top:8px;z-index:55;display:flex;align-items:center;gap:4px;padding:2px 2px 2px 10px;border-radius:10px;background:rgba(20,22,26,.92);color:#fff;font-size:12px;line-height:16px;box-shadow:var(--shadow1)}
.proto span{margin-right:4px;color:#B7BFC8}
.proto button{min-width:24px;height:24px;padding:0 8px;border:0;border-radius:8px;background:transparent;color:#fff;font-size:12px;cursor:pointer}
.proto button[aria-pressed="true"]{background:#fff;color:var(--black);font-weight:600}

@media (max-width:800px){
  .side{position:static;height:auto;width:100%;box-shadow:inset 0 -1px 0 var(--g3)}
  .side .bottom{display:none}
  .main{padding:24px 16px 96px}
  h1{font-size:28px;line-height:32px;letter-spacing:-.56px}
  .search input{width:100%}
  .proto span{display:none}
}
@media (max-width:600px){
  .dialog.buy{padding:20px;max-height:calc(100vh - 32px)}
  .overlay.tall{padding:16px 8px}
  .nums.tf{grid-template-columns:repeat(2,minmax(0,1fr))}
}

        '<span class="cname">' + esc(c.name) + (c.sub ? ' <span class="muted">' + esc(c.sub) + '</span>' : '') +
        (tw && S.twilio ? '<br><span class="muted" style="font-size:12px">' + plural(S.numbers.filter((x) => x.src === 'tw').length, 'number') + ' in Call Loop</span>' : '') +
        (c.meta ? '<br><span class="muted" style="font-size:12px">' + esc(c.meta) + '</span>' : '') + '</span>' +
        '<div class="cact">' + act + '</div>' +
        (menu && S.menu ? '<div class="menu" role="menu" aria-label="Twilio actions"><button type="button" class="mi" role="menuitem" data-act="openBuy" data-v="tw">Add Twilio numbers</button><button type="button" class="mi" role="menuitem" data-act="openEdit">Edit credentials</button><button type="button" class="mi" role="menuitem" data-act="demo">Docs</button><button type="button" class="mi" role="menuitem" data-act="openDisconnect" style="color:var(--err)">Disconnect</button></div>' : '') +
        '</div>';
    }).join('');
    return '<div class="topbar"><h1>Integrations</h1></div><div class="grid">' + html + '</div>';
  }

  function statusCell(s) {
    if (s === 'ok') return '<span class="st ok"><i>✓</i>Verified</span>';
    if (s === 'warn') return '<span class="st warn"><i>!</i>Unverified</span>';
    if (s === 'review') return '<span class="st rev"><i>◷</i>In review</span>';
    return '<span class="muted">–</span>';
  }

  /* Matches the live Numbers page (incl. CWR-4595). The only addition for Twilio is "(external)" after the type. */
  function numbersView() {
    const rows = S.numbers.map((x) =>
      '<tr class="' + (S.fresh.includes(x.id) ? 'fresh' : '') + '"><td>' + esc(x.n) + '</td><td>' + (x.label ? esc(x.label) : '–') + '</td><td>' + statusCell(x.status) + '</td>' +
      '<td' + (x.fwd ? '' : ' class="dim"') + '>' + (x.fwd ? esc(x.fwd) + ' <span class="muted">· Ext</span>' : 'Disabled') + '</td>' +
      '<td' + (x.auto ? '' : ' class="dim"') + '>' + (x.auto ? 'Enabled' : 'Disabled') + '</td>' +
      '<td>' + esc(x.type) + (x.src === 'tw' ? ' <span class="ext" tabindex="0">(external)<span class="tip" role="tooltip">From your Twilio account' + (S.twilio ? ' ' + esc(S.twilio.account) : '') + '</span></span>' : '') + '</td>' +
      '<td>' + (x.loc ? esc(x.loc) : '–') + '</td><td></td></tr>').join('');
    return '<h1>Numbers</h1>' +
      '<div class="topbar"><div style="display:flex;gap:12px;flex-wrap:wrap"><button type="button" class="btn primary" data-act="openBuy">' + IC.plus + 'Buy number</button><button type="button" class="btn secondary" data-act="demo">' + IC.plus + 'Add caller ID</button><button type="button" class="btn secondary" data-act="demo">' + IC.plus + 'Get short code</button></div>' +
      '<div class="search">' + IC.search + '<input type="search" aria-label="Search numbers" placeholder="Search..."></div></div>' +
      '<div class="tbl"><table class="nt"><thead><tr><th scope="col">Phone</th><th scope="col">Label</th><th scope="col">Status</th><th scope="col">Call forwarding</th><th scope="col">Autoresponse</th><th scope="col">Type</th><th scope="col">Location</th>' +
      '<th scope="col"><button type="button" class="colset" data-act="demo" aria-label="Choose columns">' + IC.cols + '</button></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  /* ---------- buy number: one dialog for both sources ----------
     Steps: [Connect Twilio] → Choose number → Payment. "Connect Twilio" is only there while the
     Twilio source is picked and the account isn't connected (or was connected in this dialog). */
  const overlay = (inner, tall) => '<div class="overlay' + (tall ? ' tall' : '') + '" data-act="closeModal">' + inner + '</div>';
  const closeBtn = '<button type="button" class="x" data-act="closeModal" aria-label="Close">' + IC.x + '</button>';
  const alertBox = (title, body) => '<div class="alert"><i>' + IC.info + '</i><div class="tx"><b>' + title + '</b>' + (body ? '<p>' + body + '</p>' : '') + '</div></div>';
  const LEARN = ' <a href="#" data-act="learn">Learn more</a>';

  function steps() {
    const b = S.b;
    const list = [];
    if (b.src === 'tw' && (b.connectedHere || !S.twilio)) list.push('connect');
    list.push('choose', 'pay');
    return list;
  }
  function stage() { return S.b.src === 'tw' && !S.twilio ? 'connect' : S.b.step; }
  function tabsFor(src) {
    return src === 'tw'
      ? [['account', 'In your account'], ['local', 'Local'], ['tollfree', 'Toll-Free']]
      : [['local', 'Local number'], ['tollfree', 'Toll-Free number']];
  }
  const tabOf = () => S.b.tab[S.b.src];
  const pickKey = () => S.b.src + '-' + tabOf();

  function pool(src, tab) {
    const b = S.b;
    if (tab === 'tollfree') {
      const d = norm(b.tfDigits);
      return POOLS[src].tollfree.filter((n) => !S.bought.includes(n.id) && (!d || norm(n.number).includes(d)));
    }
    const d = norm(b.digits), p = b.place.trim().toLowerCase();
    return POOLS[src].local[b.country].filter((n) => !S.bought.includes(n.id) &&
      (!d || norm(n.number).includes(d)) &&
      (!p || (b.mode === 'city' ? n.place.toLowerCase().includes(p) : norm(n.number).startsWith(norm(p)))));
  }
  function visibleNums(src, tab) {
    const all = pool(src, tab), size = PAGE[tab];
    if (all.length <= size) return all;
    const start = (S.b.page[src + tab] || 0) * size % all.length;
    return all.slice(start).concat(all.slice(0, start)).slice(0, size);
  }
  function pickFirst(src, tab) { const v = visibleNums(src, tab); S.b.pick[src + '-' + tab] = v.length ? v[0].id : null; }
  function ensurePick() {
    const t = tabOf();
    if (t === 'account') return;
    const v = visibleNums(S.b.src, t);
    if (!v.some((n) => n.id === S.b.pick[pickKey()])) pickFirst(S.b.src, t);
  }

  /* The Twilio card's second line says who bills what. No Twilio price here: it's Twilio's to set. */
  function twSub() {
    if (!S.twilio) return 'Connect your account to use or buy numbers in it';
    return 'Numbers in your Twilio account. Call Loop charges a ' + money(TW_FEE) + '/month fee';
  }

  function sourcePicker() {
    const b = S.b;
    const opt = (src, sub) => '<label class="src' + (b.src === src ? ' on' : '') + '"><input type="radio" name="src" value="' + src + '" data-act="src" data-v="' + src + '"' + (b.src === src ? ' checked' : '') + '>' +
      '<span class="sm">' + mark(src, 20) + '</span><span class="tx"><b>' + SRC_NAME[src] + '</b><small>' + sub + '</small></span><span class="rd" aria-hidden="true"></span></label>';
    return '<fieldset class="srcs"><legend class="sr">Where the number comes from</legend>' +
      opt('cl', money(CL_PRICE) + '/month per number, billed by Call Loop') +
      opt('tw', twSub()) + '</fieldset>';
  }

  function connectBody() {
    const f = S.form;
    return alertBox('Connect your Twilio account', 'Use numbers you already have in Twilio, or buy new ones there. Your Call Loop numbers keep working as they are.') +
      '<div class="fields">' +
      '<div class="field"><label for="f-key">API Key</label><input id="f-key" data-input="key" placeholder="Enter API Key" autocomplete="off" value="' + esc(f.key) + '"></div>' +
      '<div class="field"><label for="f-token">API Token</label><div style="position:relative"><input id="f-token" style="width:100%;padding-right:40px" type="' + (f.show ? 'text' : 'password') + '" data-input="token" placeholder="Enter API Token" autocomplete="new-password" value="' + esc(f.token) + '">' +
      '<button type="button" class="x" data-act="eye" aria-label="' + (f.show ? 'Hide' : 'Show') + ' token" style="position:absolute;right:8px;top:8px">' + IC.eye + '</button></div></div>' +
      '<a href="#" data-act="learn" style="font-size:14px;font-weight:500;text-decoration:none">Where do I find these?</a></div>';
  }

  function radioGrid(src, tab) {
    const list = visibleNums(src, tab);
    if (!list.length) return '<p class="none">No numbers match your search. Try another ' + (tab === 'local' && S.b.mode === 'city' ? 'city or ' : '') + 'digit filter.</p>';
    const key = src + '-' + tab;
    return '<fieldset class="nums' + (tab === 'tollfree' ? ' tf' : '') + '"><legend class="sr">Available numbers</legend>' +
      list.map((n) => '<label class="num"><input type="radio" name="num-' + key + '" data-act="radio" data-id="' + n.id + '"' + (S.b.pick[key] === n.id ? ' checked' : '') + '>' + n.number + (n.place ? '<small title="' + n.place + '">' + n.place + '</small>' : '') + '</label>').join('') +
      '</fieldset>';
  }

  function localBody(src) {
    const b = S.b, tw = src === 'tw';
    return (b.country === 'US' ? alertBox('You are required by the carriers to register for A2P 10DLC', (tw ? 'Register it for 10DLC in your Twilio account to avoid blocked messages.' : 'Complete 10DLC registration to avoid blocked messages and carrier fees.') + LEARN) : '') +
      '<div class="field"><label for="country">Country</label><div class="sel"><span class="lead">' + IC[b.country] + '</span>' +
      '<select id="country" data-act="country">' + Object.keys(COUNTRIES).map((k) => '<option value="' + k + '"' + (k === b.country ? ' selected' : '') + '>' + COUNTRIES[k].name + '</option>').join('') + '</select>' +
      '<span class="chev">' + IC.chev + '</span></div></div>' +
      '<div class="finder"><div class="row">' + IC.pin +
      '<input id="place" type="text" autocomplete="off" aria-label="' + (b.mode === 'city' ? 'City' : 'Area code') + '" placeholder="' + (b.mode === 'city' ? 'Enter a city name' : 'Enter an area code') + '"' + (b.mode === 'area' ? ' inputmode="numeric"' : '') + ' value="' + esc(b.place) + '">' +
      '<div class="seg" role="group" aria-label="Search by"><button type="button" data-act="mode" data-v="city" aria-pressed="' + (b.mode === 'city') + '">City</button><button type="button" data-act="mode" data-v="area" aria-pressed="' + (b.mode === 'area') + '">Area code</button></div></div>' +
      '<div class="row">' + IC.pad + '<input id="digits" type="text" inputmode="numeric" autocomplete="off" aria-label="Filter by digits" placeholder="Filter by digits" value="' + esc(b.digits) + '"></div></div>' +
      radioGrid(src, 'local');
  }

  function tollFreeBody(src) {
    return alertBox('You are required by the carriers to verify your toll-free numbers', (src === 'tw' ? 'Verify it in your Twilio account to avoid carrier filtering.' : 'Complete toll-free verification to avoid carrier filtering.') + LEARN) +
      '<div class="finder"><div class="row">' + IC.pad + '<input id="tfDigits" type="text" inputmode="numeric" autocomplete="off" aria-label="Filter by digits" placeholder="Filter by digits" value="' + esc(S.b.tfDigits) + '"></div></div>' +
      radioGrid(src, 'tollfree');
  }

  function accountBody() {
    const b = S.b;
    const added = inCallLoop();
    const q = norm(b.q);
    const rows = S.twAccount.filter((x) => (!b.hideAdded || !added.has(x.n)) && (!q || norm(x.n).includes(q)));
    const free = rows.filter((x) => !added.has(x.n));
    const all = free.length > 0 && free.every((x) => b.sel.includes(x.n));
    return '<div class="tools"><div class="search">' + IC.search + '<input id="q" type="search" data-input="q" aria-label="Search numbers" placeholder="Search..." value="' + esc(b.q) + '"></div>' +
      '<label class="sw"><input type="checkbox" data-act="hideAdded"' + (b.hideAdded ? ' checked' : '') + '><span class="tr"></span>Hide added <span class="cnt">(' + added.size + ')</span></label></div>' +
      '<div class="scroll"><table class="xt"><thead><tr><th scope="col"><input type="checkbox" data-act="pickAll" aria-label="Select all available numbers"' + (all ? ' checked' : '') + (free.length ? '' : ' disabled') + '></th><th scope="col">Phone number</th><th scope="col">Type</th><th scope="col">Bought in Twilio</th></tr></thead><tbody>' +
      rows.map((x) => {
        const a = added.has(x.n);
        return '<tr class="' + (a ? 'added' : '') + '"><td>' + (a ? '' : '<input type="checkbox" data-act="pick" data-v="' + esc(x.n) + '" aria-label="Select ' + esc(x.n) + '"' + (b.sel.includes(x.n) ? ' checked' : '') + '>') + '</td>' +
          '<td>' + esc(x.n) + (a ? '<span class="atag">In Call Loop</span>' : '') + '</td><td>' + esc(x.type) + '</td><td>' + esc(x.date) + '</td></tr>';
      }).join('') + '</tbody></table>' + (rows.length ? '' : '<p class="none">No numbers match “' + esc(b.q) + '”.</p>') + '</div>' +
      '<div class="foot"><span>' + (S.twAccount.length - added.size) + ' available · ' + added.size + ' already in Call Loop</span>' + (b.sel.length ? '<b>' + b.sel.length + ' selected</b>' : '') + '</div>';
  }

  /* What the current selection is, wherever it came from. */
  function selection() {
    const b = S.b, t = tabOf();
    if (b.src === 'tw' && t === 'account') return S.twAccount.filter((x) => b.sel.includes(x.n)).map((x) => ({ number: x.n, type: x.type, existing: true }));
    const n = (t === 'tollfree' ? POOLS[b.src].tollfree : POOLS[b.src].local[b.country]).find((x) => x.id === b.pick[pickKey()]);
    return n && visibleNums(b.src, t).some((v) => v.id === n.id) ? [{ id: n.id, number: n.number, type: TYPE_NAME[t], tab: t, place: n.place }] : [];
  }

  /* The strip above the primary button: where the number will live and who bills it. */
  function destStrip() {
    const b = S.b, t = tabOf();
    let title, sub;
    if (b.src === 'cl') { title = 'Bought from <b>Call Loop</b>'; sub = money(CL_PRICE) + '/month per number, billed by Call Loop'; }
    else if (t === 'account') { title = 'Uses numbers in your <b>Twilio</b> account <b>' + esc(S.twilio.account) + '</b>'; sub = money(TW_FEE) + '/month Call Loop fee per number. Nothing new is bought in Twilio.'; }
    else { title = 'Bought in your <b>Twilio</b> account <b>' + esc(S.twilio.account) + '</b>'; sub = money(TW_PRICE[t]) + '/month billed by Twilio + ' + money(TW_FEE) + '/month Call Loop fee'; }
    return '<div class="dest"><span class="mark">' + mark(b.src, 18) + '</span><div class="tx">' + title + '<span>' + sub + '</span></div></div>';
  }

  function payBody() {
    const b = S.b, t = tabOf();
    const nums = selection();
    const tw = b.src === 'tw', existing = tw && t === 'account';
    const fee = tw ? TW_FEE : CL_PRICE;
    const monthly = nums.length * fee;
    const unused = Math.round(monthly * UNUSED_RATIO * 100) / 100;
    const card = PAY_CARDS.find((c) => c[0] === b.card);
    const twCost = existing ? 0 : nums.reduce((s, n) => s + TW_PRICE[n.tab], 0);
    return destStrip() +
      '<button type="button" class="disc" data-act="listToggle" aria-expanded="' + b.listOpen + '" aria-controls="sel-list">' + IC.chevUp + 'Selected numbers: ' + nums.length + '</button>' +
      (b.listOpen ? '<div id="sel-list"><table class="pt"><thead><tr><th scope="col">Phone number</th><th scope="col">Source</th><th scope="col">' + (tw ? 'Call Loop fee' : 'Price') + '</th></tr></thead><tbody>' +
        nums.map((n) => '<tr><td>' + esc(n.number) + '<span class="ty">' + esc(n.type) + '</span></td><td>' + srcChip(b.src) + '</td><td>' + money(fee) + '</td></tr>').join('') + '</tbody></table></div>' : '') +
      '<div class="billgrp"><span class="billh"><span class="mark">' + clMark(14) + '</span>Charged by Call Loop</span>' +
      '<div class="field"><label for="card">Card</label><div class="sel paycard"><span class="lead">' + IC[card[0]] + '</span>' +
      '<select id="card" data-act="card">' + PAY_CARDS.map((c) => '<option value="' + c[0] + '"' + (c[0] === b.card ? ' selected' : '') + '>' + c[1] + '</option>').join('') + '</select>' +
      (card[2] ? '<span class="badge">Primary</span>' : '') + '<span class="chev">' + IC.chev + '</span></div></div>' +
      '<div class="total"><div class="ln"><span>' + (tw ? 'Call Loop fee' : 'Monthly total') + '<small>' + nums.length + ' × ' + money(fee) + '</small></span><span>' + money(monthly) + '/month</span></div>' +
      '<div class="ln"><span>Unused time</span><span>−' + money(unused) + '</span></div><hr>' +
      '<div class="ln grand"><span>Total charged today</span><span>' + money(monthly - unused) + '</span></div></div></div>' +
      (tw && !existing ? '<div class="billgrp"><span class="billh"><span class="mark">' + twMark(14) + '</span>Charged by Twilio</span>' +
        '<div class="total out"><div class="ln"><span>Number rental<small>' + nums.length + ' × ' + money(twCost / nums.length) + '</small></span><span>' + money(twCost) + '/month</span></div>' +
        '<span class="note">Billed by Twilio to account ' + esc(S.twilio.account) + ' at Twilio’s rates. Usage (messages, minutes) is billed by Twilio too.</span></div></div>' : '');
  }

  function buyModal() {
    const b = S.b;
    const st = stage();
    const list = steps();
    const idx = list.indexOf(st) + 1;
    const t = tabOf();
    const titles = { connect: 'Connect Twilio', choose: 'Choose number', pay: 'Payment' };
    let body, actions;
    if (st === 'connect') {
      const ok = S.form.key.trim() && S.form.token.trim();
      body = sourcePicker() + connectBody();
      actions = '<button type="button" class="btn primary" data-act="connect"' + (ok ? '' : ' disabled') + '>Connect &amp; continue</button><button type="button" class="btn secondary" data-act="closeModal">Cancel</button>';
    } else if (st === 'choose') {
      const tabs = '<div class="tabs" role="tablist" aria-label="Number type">' + tabsFor(b.src).map(([k, l]) =>
        '<button type="button" class="tab" role="tab" data-act="btab" data-v="' + k + '" aria-selected="' + (t === k) + '">' + l + (k === 'account' ? '<span class="n">' + (S.twAccount.length - inCallLoop().size) + '</span>' : '') + '</button>').join('') + '</div>';
      body = sourcePicker() + tabs + (t === 'account' ? accountBody() : t === 'tollfree' ? tollFreeBody(b.src) : localBody(b.src));
      const n = selection().length;
      actions = '<button type="button" class="btn primary" data-act="buyNext"' + (n ? '' : ' disabled') + '>' + (t === 'account' && n ? 'Continue (' + n + ')' : 'Continue') + '</button>' +
        '<button type="button" class="btn secondary" data-act="refresh">' + IC.refresh + (t === 'account' ? 'Sync' : 'Refresh') + '</button>';
    } else {
      body = payBody();
      const existing = b.src === 'tw' && t === 'account';
      actions = '<button type="button" class="btn primary" data-act="buy">' + (existing ? 'Add ' + plural(selection().length, 'number') : b.src === 'tw' ? 'Buy in Twilio' : 'Buy number') + '</button><button type="button" class="btn secondary" data-act="buyBack">Back</button>';
    }
    return overlay('<div class="dialog buy" role="dialog" aria-modal="true" aria-labelledby="b-t">' +
      '<div class="top"><div><span class="kick">' + (b.from === 'integrations' ? '<span class="mark">' + twMark(14) + '</span>Twilio integration' : 'Buy number') + '</span><h2 id="b-t">' + titles[st] + '</h2></div>' + closeBtn + '</div>' +
      '<div class="step"><span>Step ' + idx + ' / ' + list.length + '</span><div class="bar" role="progressbar" aria-label="Step ' + idx + ' of ' + list.length + '" aria-valuenow="' + idx + '" aria-valuemin="0" aria-valuemax="' + list.length + '"><i style="width:' + Math.round(idx / list.length * 100) + '%"></i></div></div>' +
      '<div class="body">' + body + '</div>' +
      '<div class="dact">' + actions + '</div></div>', true);
  }

  /* ---------- other modals ---------- */
  function editModal() {
    const f = S.form;
    const ok = f.key.trim() && f.token.trim();
    return overlay('<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="c-t">' +
      '<div class="dhead"><span class="mlogo" aria-hidden="true">' + twMark(20) + '</span><h2 id="c-t">Edit Twilio connection</h2>' + closeBtn + '</div>' +
      '<div class="fields"><div class="field"><label for="f-key">API Key</label><input id="f-key" data-input="key" autocomplete="off" value="' + esc(f.key) + '"></div>' +
      '<div class="field"><label for="f-token">API Token</label><div style="position:relative"><input id="f-token" style="width:100%;padding-right:40px" type="' + (f.show ? 'text' : 'password') + '" data-input="token" autocomplete="new-password" value="' + esc(f.token) + '">' +
      '<button type="button" class="x" data-act="eye" aria-label="' + (f.show ? 'Hide' : 'Show') + ' token" style="position:absolute;right:8px;top:8px">' + IC.eye + '</button></div></div></div>' +
      '<div class="dact"><button type="button" class="btn primary" data-act="applyEdit"' + (ok ? '' : ' disabled') + '>Apply</button><button type="button" class="btn secondary" data-act="closeModal">Cancel</button></div></div>');
  }

  function disconnectModal() {
    const t = S.toggles;
    const row = (k, title, body) => '<div class="tog"><div><b>' + title + '</b><span>' + body + '</span></div><label class="sw"><input type="checkbox" data-act="tog" data-k="' + k + '"' + (t[k] ? ' checked' : '') + ' aria-label="' + title + '"><span class="tr"></span></label></div>';
    const allOff = !t.phones && !t.triggers && !t.broadcasts;
    return overlay('<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="d-t">' +
      '<div class="dhead"><h2 id="d-t">Disconnect Twilio</h2>' + closeBtn + '</div>' +
      alertBox('Disconnect Twilio?', 'To disconnect Twilio, turn off the following features. Your Call Loop numbers aren’t affected.') +
      '<div class="toggles">' +
      row('phones', 'Twilio phone numbers', 'Turning off disconnects all Twilio numbers from Call Loop. They stay in your Twilio account.') +
      row('triggers', 'Triggers', 'Triggers that use Twilio numbers: Active → Disabled.') +
      row('broadcasts', 'Broadcasts', 'Broadcasts that use Twilio numbers: Scheduled → Draft, Sending → Paused.') +
      '</div><div class="dact"><button type="button" class="btn primary" data-act="confirmDisconnect"' + (allOff ? '' : ' disabled') + '>Disconnect Twilio</button><button type="button" class="btn secondary" data-act="closeModal">Back</button></div></div>');
  }

  function dropNumberModal() {
    const x = S.numbers.find((r) => r.id === S.modal.id);
    return overlay('<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="n-t">' +
      '<div class="dhead"><h2 id="n-t">Disconnect number</h2>' + closeBtn + '</div>' +
      alertBox('Disconnect ' + esc(x ? x.n : '') + ' from Call Loop?', 'The number stays in your Twilio account, and Call Loop stops charging its fee.') +
      '<div class="box"><b>Disconnecting affects everything that uses this number:</b><ul><li>Scheduled broadcasts</li><li>Campaigns</li><li>Triggers</li><li>Keywords</li><li>Web Forms</li></ul></div>' +
      '<label class="ack"><input type="checkbox" data-act="ack"' + (S.ack ? ' checked' : '') + ' data-autofocus><span>I understand this action is destructive and can’t be undone</span></label>' +
      '<div class="dact"><button type="button" class="btn primary" data-act="dropNumber"' + (S.ack ? '' : ' disabled') + '>Disconnect number</button><button type="button" class="btn secondary" data-act="closeModal">Cancel</button></div></div>');
  }

  function modalView() {
    const m = S.modal;
    if (!m) return '';
    if (m.type === 'buy') return buyModal();
    if (m.type === 'edit') return editModal();
    if (m.type === 'disconnect') return disconnectModal();
    if (m.type === 'drop') return dropNumberModal();
    return '';
  }

  /* ---------- render ---------- */
  const root = document.getElementById('root');
  function render() {
    const active = document.activeElement;
    const keep = active && active.id && active.tagName === 'INPUT' ? { id: active.id, pos: active.selectionStart } : null;
    const keepAct = !keep && active && active.dataset && active.dataset.act ? active.dataset : null;
    const bodyEl = root.querySelector('.dialog.buy .body');
    const bodyTop = bodyEl ? bodyEl.scrollTop : 0;
    root.innerHTML = '<div class="app">' + sidebar() + '<main class="main"><div class="wrap">' + (S.screen === 'numbers' ? numbersView() : integrationsView()) + '</div></main></div>' +
      modalView() +
      '<div aria-live="polite">' + (S.toast ? '<div class="toast">' + IC.check + esc(S.toast) + '</div>' : '') + '</div>' +
      '<div class="proto" role="group" aria-label="Prototype: Twilio state"><span>Twilio:</span>' +
      [[false, 'Not connected'], [true, 'Connected']].map(([k, l]) => '<button type="button" data-act="seed" data-v="' + k + '" aria-pressed="' + (!!S.twilio === k) + '">' + l + '</button>').join('') + '</div>';
    document.title = (S.screen === 'numbers' ? 'Numbers' : 'Integrations') + ' · Call Loop prototype';
    const newBody = root.querySelector('.dialog.buy .body');
    if (newBody && S.b && S.b.keepScroll) newBody.scrollTop = bodyTop;
    if (S.b) S.b.keepScroll = true;
    const target = focusAfter ? document.getElementById(focusAfter) : (keep ? document.getElementById(keep.id) : null);
    if (target) {
      target.focus();
      if (keep && target.id === keep.id && target.setSelectionRange && target.type !== 'password' && target.type !== 'checkbox' && keep.pos != null) {
        try { target.setSelectionRange(keep.pos, keep.pos); } catch (e) {}
      }
    } else if (keepAct) {
      const sel = '[data-act="' + keepAct.act + '"]' + (keepAct.v ? '[data-v="' + keepAct.v + '"]' : '') + (keepAct.id ? '[data-id="' + keepAct.id + '"]' : '') + (keepAct.k ? '[data-k="' + keepAct.k + '"]' : '');
      const el = root.querySelector(sel);
      if (el) el.focus();
    } else if (S.modal) {
      const ov = root.querySelector('.overlay');
      if (!ov.contains(active)) { const af = ov.querySelector('[data-autofocus]') || ov.querySelector('input,button'); if (af) af.focus(); }
    }
    focusAfter = null;
  }

  function openModal(m) {
    if (!S.modal) lastFocusBtn = document.activeElement;
    S.modal = m; S.ack = false; S.menu = false;
  }
  function closeModal() {
    S.modal = null; S.b = null;
    if (lastFocusBtn && document.body.contains(lastFocusBtn)) setTimeout(() => lastFocusBtn && lastFocusBtn.focus(), 0);
  }
  /* One entry point for Buy number, Integrations → Connect and Integrations → Numbers. */
  function openBuy(src, from) {
    openModal({ type: 'buy' });
    S.b = {
      src: src || 'cl', from: from || 'numbers', step: 'choose', connectedHere: false, keepScroll: false,
      tab: { cl: 'local', tw: S.twilio ? 'account' : 'account' },
      country: 'US', mode: 'city', place: '', digits: '', tfDigits: '', page: {}, pick: {},
      sel: [], q: '', hideAdded: false, listOpen: true, card: 'mc'
    };
    S.form = { key: '', token: '', show: false };
    ensurePick();
    if (stage() === 'connect') focusAfter = 'f-key';
  }

  function resetScroll() { if (S.b) S.b.keepScroll = false; }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    const hadMenu = S.menu;
    if (S.menu && !(t && ['toggleMenu', 'openEdit', 'openDisconnect', 'openBuy'].includes(t.dataset.act))) S.menu = false;
    // Re-render only when needed: a label click is followed by a click on its input, which a re-render would detach.
    if (!t) { if (hadMenu) render(); return; }
    const act = t.dataset.act;
    if (act === 'country' || act === 'card') return; // handled on change
    if (t.tagName === 'A') e.preventDefault();
    if (act === 'closeModal' && t.classList.contains('overlay') && e.target !== t) return;
    const b = S.b;
    switch (act) {
      case 'demo': showToast('Not part of this prototype'); break;
      case 'learn': showToast('Opens the help article'); break;
      case 'go': S.screen = t.dataset.v; S.fresh = []; window.scrollTo(0, 0); break;
      case 'seed': S = fresh(t.dataset.v === 'true'); showToast(S.twilio ? 'Twilio connected, 2 Twilio numbers in Call Loop' : 'Twilio not connected'); break;
      case 'toggleMenu': S.menu = !S.menu; break;
      /* Same flow on every plan: no release warning, Call Loop numbers stay. */
      case 'startConnect': openBuy('tw', 'integrations'); break;
      case 'openBuy': openBuy(t.dataset.v, S.screen === 'integrations' ? 'integrations' : 'numbers'); break;
      case 'src': if (b.src !== t.value) { b.src = t.value; resetScroll(); ensurePick(); if (stage() === 'connect') focusAfter = 'f-key'; } break;
      case 'btab': b.tab[b.src] = t.dataset.v; resetScroll(); ensurePick(); break;
      case 'mode': if (b.mode !== t.dataset.v) { b.mode = t.dataset.v; b.place = ''; ensurePick(); } break;
      case 'radio': b.pick[pickKey()] = t.dataset.id; break;
      case 'eye': S.form = Object.assign({}, S.form, { show: !S.form.show }); break;
      case 'connect':
        if (!S.form.key.trim() || !S.form.token.trim()) break;
        S.twilio = { account: 'callloop', key: S.form.key.trim() };
        b.connectedHere = true; b.tab.tw = 'account'; b.step = 'choose'; resetScroll();
        showToast('Twilio connected. Choose numbers to use in Call Loop.');
        break;
      case 'hideAdded': b.hideAdded = t.checked; break;
      case 'pick': { const v = t.dataset.v; b.sel = t.checked ? b.sel.concat(v) : b.sel.filter((p) => p !== v); break; }
      case 'pickAll': {
        const added = inCallLoop(), q = norm(b.q);
        const ids = S.twAccount.filter((x) => !added.has(x.n) && (!q || norm(x.n).includes(q))).map((x) => x.n);
        b.sel = t.checked ? Array.from(new Set(b.sel.concat(ids))) : b.sel.filter((x) => !ids.includes(x));
        break;
      }
      case 'refresh':
        if (tabOf() === 'account') showToast('Synced with Twilio');
        else { const k = b.src + tabOf(); b.page[k] = (b.page[k] || 0) + 1; pickFirst(b.src, tabOf()); showToast('Numbers refreshed'); }
        break;
      case 'buyNext': if (selection().length) { b.step = 'pay'; b.listOpen = true; resetScroll(); } break;
      case 'buyBack': b.step = 'choose'; resetScroll(); break;
      case 'listToggle': b.listOpen = !b.listOpen; break;
      case 'buy': {
        const nums = selection();
        const tab = tabOf();
        const ids = [];
        nums.forEach((n) => {
          const id = 'n' + S.seq++;
          ids.push(id);
          S.numbers.unshift({ id, n: n.number, src: b.src, type: n.type.replace('-', ' '), status: 'warn', loc: n.place });
          if (n.id) S.bought.push(n.id);
          // A number bought in Twilio now also lives in the Twilio account.
          if (b.src === 'tw' && !n.existing) S.twAccount.unshift({ n: n.number, type: n.type, date: 'Oct 29, 2026' });
        });
        const msg = b.src === 'cl' ? plural(nums.length, 'number') + ' bought from Call Loop'
          : tab === 'account' ? plural(nums.length, 'Twilio number') + ' added to Call Loop'
          : plural(nums.length, 'number') + ' bought in Twilio (' + S.twilio.account + ')';
        closeModal();
        S.screen = 'numbers'; S.fresh = ids;
        window.scrollTo(0, 0);
        showToast(msg);
        break;
      }
      case 'openEdit': openModal({ type: 'edit' }); S.form = { key: S.twilio.key, token: '123456789abcd', show: false }; focusAfter = 'f-key'; break;
      case 'applyEdit': if (S.form.key.trim() && S.form.token.trim()) { S.twilio.key = S.form.key.trim(); closeModal(); showToast('Twilio connection updated'); } break;
      case 'openDisconnect': openModal({ type: 'disconnect' }); S.toggles = { phones: true, triggers: true, broadcasts: true }; break;
      case 'tog': S.toggles = Object.assign({}, S.toggles, { [t.dataset.k]: t.checked }); break;
      case 'confirmDisconnect': {
        const n = S.numbers.filter((x) => x.src === 'tw').length;
        S.twilio = null; S.numbers = S.numbers.filter((x) => x.src !== 'tw');
        closeModal();
        showToast('Twilio disconnected. ' + plural(n, 'Twilio number') + ' removed, Call Loop numbers unchanged.');
        break;
      }
      case 'ack': S.ack = t.checked; break;
      case 'openDropNumber': openModal({ type: 'drop', id: t.dataset.id }); break;
      case 'dropNumber': {
        const x = S.numbers.find((r) => r.id === S.modal.id);
        S.numbers = S.numbers.filter((r) => r.id !== S.modal.id);
        closeModal();
        showToast((x ? x.n : 'Number') + ' disconnected from Call Loop');
        break;
      }
      case 'closeModal': closeModal(); break;
    }
    render();
  });

  document.addEventListener('change', (e) => {
    const t = e.target;
    const act = t.dataset && t.dataset.act;
    if (!S.b || (act !== 'country' && act !== 'card')) return;
    if (act === 'country') { S.b.country = t.value; S.b.place = ''; S.b.digits = ''; ensurePick(); }
    else S.b.card = t.value;
    render();
  });

  document.addEventListener('input', (e) => {
    const el = e.target;
    const k = el.dataset && el.dataset.input;
    if (S.b && ['place', 'digits', 'tfDigits'].includes(el.id)) { S.b[el.id] = el.value; ensurePick(); render(); return; }
    if (!k) return;
    if (k === 'q') S.b.q = el.value;
    else S.form = Object.assign({}, S.form, { [k]: el.value });
    render();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (S.modal) { closeModal(); render(); }
    else if (S.menu) { S.menu = false; render(); }
  });

  render();
})();
</script>
</body>
</html>
